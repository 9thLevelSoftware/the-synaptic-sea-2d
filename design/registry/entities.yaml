      expression: per island: supply = sum(reactor_out) + battery_discharge; demand by tier 0..4; served_pm per LOAD = 1000 for tiers fully met, partial for the first unmet tier, 0 below (brownout shed order: tier 4 'other' first, then tier 3 lamps and HEATER; sat_3 drives lamp brightness)
      variables: supply W, demand_by_tier W, battery stock dJ, tier 0..4
