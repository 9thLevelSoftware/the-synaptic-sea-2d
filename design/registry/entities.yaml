# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
#             economy-designer, systems-designer (new cross-system entries,
#               after asking)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /design-review (Phase 1 — cross-doc facts, in place of sibling GDDs)
#             /content-audit (Step 2 — planned named-content count)
#             /balance-check (Phase 3 — intended constant/formula values)
#             /propagate-design-change (Step 3 — downstream GDD impact via referenced_by)
#             /asset-spec (named entities to write specs for)
#             economy-designer, systems-designer (before authoring items,
#               loot tables and formulas)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="design/gdd/inventory.md" -B 8
#                            (referenced_by is a block list, so match the
#                            path; referenced_by.*inventory never matches)
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts "- name: <name>" with the dash at column 2 (or 0, the same for every
#   entry of a section); its fields sit two columns past the dash, and a deeper
#   line belongs to the field above it. Quote a value that holds ": ". A line
#   in any other shape is reported as unsupported layout, with its number.

version: 1
last_updated: "2026-10-26"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: speed_ceiling
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by: []
    attributes:
      expression: v_ceil = min(ceil(LAG_CUT/(FOLLOW_TAU*TICK_RATE)) - 1, floor((0.30*field_h - LOOKAHEAD_PX)/(FOLLOW_TAU*TICK_RATE)))
      variables: LAG_CUT 48, FOLLOW_TAU 0.18, TICK_RATE 60, field_h 360, LOOKAHEAD_PX 72
      output: 3 px/tick at defaults (inner-box inequality binds: v_max < 200 px/s)
    added: 2026-10-26
    revised: 2026-10-26
    # Couples Player Controller speeds to the camera; with v_run 3, FOLLOW_TAU <= 0.20 and LOOKAHEAD_PX <= 75 are the operative ceilings
  - name: locomotion_axis_step
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by: []
    attributes:
      expression: sub += unit[octant]*v*256; step = trunc(sub/256); sub -= step*256 (x then y, 1-px AABB sweeps)
      variables: unit table 256 cardinal / 181 diagonal (1/256 px fixed point), v px/tick
      output: integer base px per tick; diagonal cadence walk 1,1,2,1,2,1,1,2; run eight 2s then 3
    added: 2026-10-26
    revised: 2026-10-26
    # Owned by Body's LocomotionStep per PC-14; the avatar has no physics body
  - name: facing_from_aim
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by: []
    attributes:
      expression: facing = sector(aim_angle) with 2-quanta hysteresis; overrides: frozen (stagger/down/dead), channel-locked, running -> movement; aim idle -> movement
      variables: aim_angle 0..4095 (1/4096 turn), FACING_HYSTERESIS 64 units
      output: one of 8 facings (5 drawn + 3 mirrored)
    added: 2026-10-26
    revised: 2026-10-26
    # Beam state does not change the rule; pad default follows movement until first right-stick input
  - name: chest_point
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by: []
    attributes:
      expression: chest = floor(lerp(pos_prev, pos_curr, tick_alpha)) + CHEST_POINT[facing][anim] * (flip_h ? (-1,1) : (1,1))
      variables: CHEST_POINT per facing and animation, |x| <= 2
      output: integer base px; beam origin (chest-mounted lamp, user decision 2026-10-26)
    added: 2026-10-26
    revised: 2026-10-26
    # Hand point is retained only for tool-sprite placement
  - name: world_scale_k
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by: []
    attributes:
      expression: k = floor(min(W/640, H/360))
      variables: W, H window px
      output: int >= 2; 2/3/4/6 at 720p/1080p/1440p/2160p; remainder letterboxed under keep
    added: 2026-10-26
    revised: 2026-10-26
    # Every screen-pixel figure in every GDD derives from k
  - name: hud_multiplier
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by: []
    attributes:
      expression: H_default = max(k, 3); H in [H_default, 2*H_default] integer
      variables: k (world scale)
      output: int >= 3 on every display; cap height = 7*H px
    added: 2026-10-26
    revised: 2026-10-26
    # HUD never below 3x; Steam Deck runs k=2, H=3
  - name: zoom_out_k
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by: []
    attributes:
      expression: k_out = ceil(k/2); visible field = (W/k_out, H/k_out) base px
      variables: k
      output: integer step only, hold-to-step-back; steps to 1x on 2x worlds
    added: 2026-10-26
    revised: 2026-10-26
    # Implemented by changing the viewport logical size, never Camera2D.zoom
  - name: camera_follow
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/player-controller-input.md
    attributes:
      expression: cam += (target - cam) * (1 - exp(-dt / FOLLOW_TAU)); pose = floor_to(cam, QUANTUM)
      variables: dt render s, FOLLOW_TAU 0.18 s, QUANTUM in {1, 1/k} base px
      output: zero overshoot; steady-state lag = v * tau
    added: 2026-10-26
    revised: 2026-10-26
    # Quantise after smoothing
  - name: camera_lookahead
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by: []
    attributes:
      expression: offset = aim_dir * LOOKAHEAD_PX, slewed at <= L_SLEW_MAX, eased over LOOKAHEAD_TAU
      variables: aim_dir (local raw aim, regardless of beam state), LOOKAHEAD_PX 72, L_SLEW_MAX 144 px/s, LOOKAHEAD_TAU 0.40 s
      output: <= 72 px default; range 48-120
    added: 2026-10-26
    revised: 2026-10-26
    # Player-owned input only; never world state
  - name: camera_cut_predicates
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/player-controller-input.md
    attributes:
      expression: cut if follow_speed > 1.25*v_max for T_PAN, or lag > LAG_CUT, or single-frame jump >= JUMP_CUT
      variables: T_PAN 0.10 s, LAG_CUT 48 px, JUMP_CUT 48 px; invariant LAG_CUT > v_max*FOLLOW_TAU
      output: bool -> CUT (never a fast pan)
    added: 2026-10-26
    revised: 2026-10-26
    # Evaluated on the unclamped follow term only
  - name: flash_count
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by: []
    attributes:
      expression: flashes_per_s = count of opposing >= 10% relative-luminance changes in any 1 s window
      variables: per light, per 213x120 base px region, frame mean; red flash included
      output: must be <= 3 (WCAG 2.3.1)
    added: 2026-10-26
    revised: 2026-10-26
    # Enforced in the 2D Lighting modifier contract; deployable flicker must be specified inside it
  - name: ticks_for_seconds
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by: []
    attributes:
      expression: round(seconds * TICK_RATE)
      variables: seconds (float, s), TICK_RATE (int, Hz)
      output: int ticks; 10-30 s tell window = 600-1800 ticks at 60 Hz
    added: 2026-10-25
    revised: 2026-10-25
    # Every duration in every GDD is expressed in ticks via this formula
  - name: hook_runs_this_tick
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by: []
    attributes:
      expression: (T mod divisor) == offset
      variables: T (int tick), divisor (int >= 1), offset (int, 0..divisor-1)
      output: bool; effective_hook_rate = TICK_RATE / divisor
    added: 2026-10-25
    revised: 2026-10-25
    # Step divisors: Graph 6, Attention 6, Suit vitals 6, Sanity drift 12, Controller/Body/Emitter 1
  - name: tick_alpha
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by:
      - design/gdd/player-controller-input.md
      - design/gdd/pixel-perfect-render-pipeline-camera.md
    attributes:
      expression: clamp(t_since_last_commit / tick_duration, 0, 1)
      variables: t_since_last_commit (float s), tick_duration = 1/TICK_RATE
      output: 0.0-1.0; presentation interpolation fraction
    added: 2026-10-25
    revised: 2026-10-25
    # Read by every presentation system that interpolates motion
  - name: ordering_key
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by: []
    attributes:
      expression: (queued_tick, host_order) lexicographic
      variables: queued_tick (int), host_order (int, kernel-stamped unique counter)
      output: total order of commands; G1 determinism guarantee
    added: 2026-10-25
    revised: 2026-10-25
    # Single-player = submission order
  - name: is_stale
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by: []
    attributes:
      expression: (T - queued_tick) > max_age_ticks
      variables: T, queued_tick (int ticks), max_age_ticks (per command type: 30 intents, 120 actions)
      output: bool -> Rejected(STALE); unreachable locally at defaults (queue drains in 8 ticks)
    added: 2026-10-25
    revised: 2026-10-25
    # VS-B seam for remote-stamped ticks
  - name: state_hash
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by: []
    attributes:
      expression: hash(canonical_snapshot(blocks))
      variables: blocks (persist or all SIM), canonical ordering, -0.0 == +0.0, NaN normalised
      output: u64; equality is the G3/G4 determinism and save-equivalence test
    added: 2026-10-25
    revised: 2026-10-25
    # Also the desync check for VS-B
  - name: rng_derive
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by: []
    attributes:
      expression: mix64(world_seed, hash(stream_name), counter)
      variables: world_seed (u64), stream_name (StringName), counter (u64 stored in the owning block)
      output: u64 / unit [0,1); pure and deterministic
    added: 2026-10-25
    revised: 2026-10-25
    # No global randf() anywhere in simulation (H9)


