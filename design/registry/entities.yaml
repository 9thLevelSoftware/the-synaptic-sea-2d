    attributes:
      kind: footprint rectangle record (section-local base px, half-open [x0,x1) x [y0,y1), every coordinate on the 24-px grid except a door leaf's moving edge)
      flags: "SOLID | OCCLUDES_LIGHT | DOOR_LEAF | PROP | MACHINE | HULL"
      queries: "solid_in(body_id, aabb) returns SOLID rects (Body's sweep); OccluderSource.rects_in(aabb) returns OCCLUDES_LIGHT rects as the occupied closed span (x0, y0, x1-1, y1-1)"
      frame: rects_in and solid_in answer in the BODY frame; every other geometry read is section-local
      rules: rects are simulation data, never engine collision shapes; the avatar has no physics body; a socket's span is carved from its HULL run; a state change switches slot activity, never an idx
      socket_jamb_class: "SOLID | OCCLUDES_LIGHT | HULL (variant slot JAMB, WELDED two-sided, width_tiles >= 3 only; zero-width and omitted at width_tiles 2)"
      query_contract: "rects_in and solid_in are out-parameter calls into a caller-owned buffer; they take half-open input boxes and return occupied spans"
      # added 2026-10-27 (design review; LY-7 and LY-12 e), no prior value changed
    added: 2026-10-26
    revised: 2026-10-27
