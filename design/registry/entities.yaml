    attributes:
      kind: host-local read published by Save/Load (not a command, not a block)
      values: "IDLE | WRITING | WRITTEN (sticky until the next write begins, carries written_at_T) | FAILED"
      display_hold: RETIRED (STATUS_WRITTEN_HOLD_TICKS removed with UI-1; no per-write glyph in the MVP - Stage 12 CD-GDD-ALIGN). Do not register STATUS_WRITTEN_HOLD_TICKS
      consumers: Chart Table pause panel (newest record's playtime via SaveInfo; WRITING only during the player's own Save & Quit), HUD failed-write notice (FAILED after AUTOSAVE_FAIL_ESCALATE_COUNT only), Debug Overlay
