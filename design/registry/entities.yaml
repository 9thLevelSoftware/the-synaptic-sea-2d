      keys: "SEC/<section_id> (KIND 1), BODY/<body_id> (KIND 2), S/<seam_id> (KIND 3), LEAF/<section_id> (KIND 4, marked by layout.doors), ALL past MAX_DIRTY_KEYS"
      # was: KIND set SEC 1, BODY 2, SEAM 3 (no LEAF) before 2026-10-29 (ADR-0013 section 8)
      encoding: "int (KIND << 32) | id; namespaced by block, so Layout's SEC/<id> and the Graph's SEC/<id> are different keys"
    added: 2026-10-26
    revised: 2026-10-29

