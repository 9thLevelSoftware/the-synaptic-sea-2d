    # was: kind side file slot_epoch.bin (u32 LE + CRC32, slot_epoch.tmp -> flush -> rename -> re-read); exposure request_restore(payload, restore_epoch, expected_state_hash); exclusions 'the snapshot header'; rule 'a missing or corrupt slot_epoch.bin' before 2026-10-29 (ADR-0006 3.1 pair with seq, has_expected_hash; kernel CR-8)
    # Delegated ruling R1 (user ruling D16/X8 consequence): Save/Load owns the persisted value, the kernel owns the derivation (rng_derive_epoch, RESTORE_KEY_STRIDE)
    # was: kind 'persisted u32 in every WORLD generation (save-slot) header'; rule 'on every restore (death stub, load, fault recovery; in-process or fresh-process) set to min(2^32 - 1, E_seen + 1), E_seen = max over all parseable headers in the campaign directory plus the in-memory value; durably written by an atomic header-only rewrite before the first RUNNING tick' before 2026-10-28
    # Delegated rulings R13/R14 (2026-10-28) amend R1: side file pair slot_epoch_a/b.bin (was slot_epoch.bin before 2026-10-29), a Continue of the newest non-demoted verified QUIT generation carries the epoch, durable in a staging step before request_restore

  - name: slot_epoch_a/b.bin
    status: active
    source: design/gdd/save-load-and-versioned-format.md
    referenced_by:
      - design/gdd/command-simulation-layer.md
      - design/gdd/horror-entities.md
      - design/gdd/boarding-and-salvage.md
    attributes:
      kind: "per-slot PAIR of side files holding the live restore_epoch: user://saves/<campaign_id>/slot_epoch_a.bin and slot_epoch_b.bin, 12 bytes each (u32 LE epoch, u32 LE seq, u32 LE CRC32 of the first 8 bytes)"
      write: "Save/Load worker overwrites the OLDER file of the pair in place with seq = max + 1, flush, close, re-read and CRC check; no .tmp, no rename, no remove (ADR-0006 3.1); EPOCH_DURABLE on a valid re-read; issued in the pre-restore staging step, before request_restore (SL-23 (2))"
      recovery: "the reader takes the valid file (size 12, CRC matches) with the higher seq; no .tmp exists so nothing is deleted at campaign open (T-6); rebuilt as max(newest verified generation header copy, 0) + 1 only when BOTH files are missing or invalid"
      diagnostics: "SL_EPOCH_NOT_DURABLE (write failed or timed out; save_status FAILED), SL_EPOCH_FILE_REBUILT (both files missing or invalid)"
      timeout: RESTORE_EPOCH_WRITE_MAX_MS
    added: 2026-10-28
    revised: 2026-10-29
    # was: entity slot_epoch.bin, single file, 8 bytes (u32 LE + CRC32), write slot_epoch.tmp -> flush -> rename over slot_epoch.bin -> re-read, recovery deletes a leftover slot_epoch.tmp (T-6) and rebuilds on a missing or bad-CRC file, before 2026-10-29 (ADR-0006 3.1: pair with seq, overwrite-older, 12 bytes)
    # Delegated ruling R14. One registered spelling for each name; see SL_EPOCH_NOT_DURABLE for the variant spellings

