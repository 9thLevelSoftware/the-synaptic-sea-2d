      kind: persisted enum per socket (sparse; only non-FREE rows stored)
      values: "FREE | WELDED(seam_id) | CAPPED (after a SEALED cut) | CUT_OPEN (after a RAGGED cut)"
      rules: CAPPED and CUT_OPEN never return to FREE in MVP; state changes only inside attach_section / detach_section
      reason_set_can_attach: "SOCKET_UNKNOWN, SOCKET_NOT_FREE, SAME_BODY, FACING_MISMATCH, WIDTH_MISMATCH, CLASS_MISMATCH, LANE_MISMATCH, GEOM_OVERLAP (closed, evaluated in this order)"
      can_attach_preview_payload: "{reason, hatch_one_sided, openings_count}"
      reason_set_can_detach: "SEAM_UNKNOWN, SEAM_NOT_ACTIVE, CAPACITY (closed)"
      variant_slot_activity: "hatched socket, slots PLATE / JAMB / LEAF (idx reserved, omitted when off): FREE = PLATE on, JAMB off, LEAF off; WELDED two-sided = PLATE off, JAMB on iff W>=3 (W=2: length 0, omitted), LEAF on iff leaf_w>0; WELDED one-sided (this socket hatched, mate bare) = PLATE on, JAMB off, LEAF off; CAPPED = PLATE on, JAMB off, LEAF off; CUT_OPEN = PLATE on, JAMB off, LEAF off. W=2 span is the 96-px doorway (PLATE 96x24); W>=3 span is W*48 (PLATE W*48 x 24, JAMB (W*48-96) x 24). A hatchless socket reserves no variant slots"
    added: 2026-10-26
    revised: 2026-10-27
    # was: no reason_set_can_detach, no variant-slot matrix and no preview payload before 2026-10-27 (design review, LY-15 / LY-29); reason_set_can_attach unchanged
