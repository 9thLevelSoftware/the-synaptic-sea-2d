      kind: Save/Load diagnostic event (a log code, not a command or a state)
      rule: "raised when the pre-restore slot_epoch_a/b.bin write fails or exceeds RESTORE_EPOCH_WRITE_MAX_MS; sets save_status = FAILED; the restore proceeds with the advanced value in memory (listed exposure: a kill before the next successful write may replay the epoch once); the write is re-attempted with the next write job (SL-23 (2a), (2b))"
      aliases: "none; the publisher (Save/Load) spelling SL_EPOCH_NOT_DURABLE is canonical (G1) and the kernel GDD conforms (CR-15, KRN-EPO-05). SL_EPOCH_FILE_REBUILT (both slot_epoch_a/b.bin files missing or invalid, rebuilt) is a separate Save/Load diagnostic"
