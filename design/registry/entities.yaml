  - name: control_plane_request_outcomes
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by: []
    attributes:
      kind: "kernel diagnostics enum (a log outcome, not a command result record): SERVED | DEFERRED | IGNORED"
      rule: "every control-plane request (CR-15) is recorded when made and ends in exactly one outcome: SERVED (a tabled transition occurred, or for request_snapshot the capture completed), DEFERRED (made while an atomic step was active; kept in arrival order and evaluated at the first boundary after the step), IGNORED (the (state, trigger) pair is not in the table when evaluated: one invalid-transition entry, no state change); while SAVING every request is DEFERRED; while LOADING only request_shutdown is DEFERRED and every other request is IGNORED (matches Save/Load T-1)"
      pair_count: "the first-boot BOOTING rows (BOOTING + request_new_game, BOOTING + request_restore, both to LOADING) raise the KRN-STATE-01 (state, trigger) pair count by 2; new ACs KRN-STATE-03 and KRN-STATE-04"
    added: 2026-10-28
    revised: 2026-10-28
    # Requested by the kernel writer (rr4); Save/Load T-1 reuses these names identically (not yet cited by name there, so referenced_by stays empty until it does)

  - name: kernel_binding_table
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by:
      - design/gdd/ship-body-and-interior-physics.md
      - design/gdd/emitter-state-and-light-exposure-query.md
      - design/gdd/save-load-and-versioned-format.md
      - design/gdd/player-controller-input.md
      - design/gdd/interaction-system.md
      - design/gdd/suit-and-equipment.md
      - design/gdd/modular-ship-assembly.md
    attributes:
      kind: "kernel-owned binding table in two halves (CR-7, KRN-BIND-01..05)"
      half_a: "peer_id -> PlayerId: session state mutated only by the session owner through the host-only API (MVP boot step: HOST_PEER_ID 1 -> PlayerId 1); never touched by restore, death restart or new game; resets no seq or last_seq"
      half_b: "PlayerId -> {(source block_id, entity_id)}: never saved; rebuilt by the kernel as the last LOADING step (after post_restore and the K-4 check): clear, then call each binding_source in ascending block_id order and store each delivered (player_id, entity_id) as player_id -> (source_block_id, entity_id)"
      actor_source: "mandatory iff actor_binding = OWNED_BY_ISSUER; names a block with a registered binding_source (body.state for avatar-acting types, emitter.state for toggle_beam); P2 authority passes iff (actor_source(type), actor) in half_b[PlayerId(issuer_peer)]; a missing actor_source, one naming a block without a binding_source, or one declared on a NONE type fails boot with ACTOR_SOURCE_INVALID"
      binding_source: "optional BOOTING-only block registration: binding_source(ctx), a pure read with no WriteScope, delivering [(player_id, entity_id)] ascending via ctx.put and ending with return ctx.complete()"
      errors: "BINDING_REBUILD_CONFLICT (one (source block_id, entity_id) key for two PlayerIds, or a duplicate (player_id, source block_id, entity_id) triple; equal entity numbers from different sources are not a conflict), or the source fault, take LOADING -> FAULTED"
      mvp_sources: "body seat_bindings(), emitter beam_bindings()"
    added: 2026-10-28
    revised: 2026-10-28
    # Body gap BDY-7/BDY-31 (OQ 30) resolved under G6; HOST_PEER_ID is registered under constants
    # 2026-10-28 (rr3, CR-7/CR-8): half_b was "PlayerId -> {entity ids}" (bare keys; false conflict on every boot since Body and Emitter ids both start at 1); actor_source added; KRN-BIND-05 added

