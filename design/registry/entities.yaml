# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: speed_ceiling
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by:
      - design/gdd/pixel-perfect-render-pipeline-camera.md
    attributes:
      # was: expression FOLLOW_TAU_eff = FOLLOW_TAU*s, LAG_CUT unscaled, no V_LADDER_MAX term in the min before 2026-10-27
      expression: v_ceil = min(ceil(LAG_CUT_eff/(FOLLOW_TAU_eff*TICK_RATE)) - 1, floor((INNER_BOX_FRAC*field_h - L_MAX_eff)/(FOLLOW_TAU_eff*TICK_RATE)), V_LADDER_MAX) with FOLLOW_TAU_eff = FOLLOW_TAU*min(1,s), LAG_CUT_eff = LAG_CUT*s, L_MAX_eff = LOOKAHEAD_PX*s, s = field_h / 360; when FOLLOW_TAU = 0 the I1 and I2 terms are unbounded (skipped from the min, v_ceil capped by V_LADDER_MAX = 4); joint integer constraint (I2 itself, asserted by the pipeline loader) v_run * TICK_RATE * FOLLOW_TAU_ms + 1000 * LOOKAHEAD_PX <= 300 * 360 with FOLLOW_TAU_ms = round(1000 * FOLLOW_TAU)
      # was: expression without the FOLLOW_TAU = 0 guard or the joint integer constraint before 2026-10-27 (design review)
      variables: LAG_CUT 48, FOLLOW_TAU 0.18, TICK_RATE 60, field_h 360, LOOKAHEAD_PX 72, V_LADDER_MAX 4, FOLLOW_TAU_ms round(1000*FOLLOW_TAU)
      # was: output 3 px/tick at defaults, the same integer at every step before 2026-10-27
      output: "3 px/tick at defaults; exactly 3 for s <= 1, >= 3 at every step (4 at 720 rows; I2 176.4 <= 216); inner-box inequality binds at 360 rows: 0.30*360 = 108 > 180*0.18 + 72 = 104.4; v_max < 200 px/s"
    added: 2026-10-26
    revised: 2026-10-27
    # The FOLLOW_TAU (0-0.20) and LOOKAHEAD_PX (48-75) ranges are each valid only with the other at its default; the box corner 0.20/75 gives 36 + 75 = 111 > 108 (design review 2026-10-27)
    # Couples Player Controller speeds to the camera; with v_run 3, FOLLOW_TAU <= 0.20 and LOOKAHEAD_PX <= 75 are the operative ceilings
    # asserted at every reachable field_h, not only the default (consistency check 2026-10-26)
    # Scale-free: with every length knob scaled by s the inner-box inequality holds at every field iff it holds at 360 rows (consistency check 2026-10-26)
    # re-run at V_RUN 3 = 180 px/s
    # Revised 2026-10-27 (re-review, Controller D.2 and Pipeline D.6/D.10, general rule G1): the follow time constant scales by min(1, s), not s; there is no separate PCI invariant 17, the joint integer form is I2 itself

  - name: locomotion_axis_step
    status: active
    source: design/gdd/ship-body-and-interior-physics.md
    referenced_by:
      - design/gdd/player-controller-input.md
      - design/gdd/horror-entities.md
    attributes:
      expression: sub_a += UNIT[octant].a * v_eff; step_a = trunc(sub_a / 256); sub_a -= step_a * 256 (x then y, 1-px AABB sweeps)
      variables: unit table 256 cardinal / 181 diagonal (1/256 px fixed point), v_eff px/tick
      output: integer base px per tick; diagonal cadence walk 1,1,2,1,2,1,1,2; run eight 2s then 3
    added: 2026-10-26
    revised: 2026-10-27
    # Owned by Body's LocomotionStep per PC-14; the avatar has no physics body
    # was: expression sub += unit[octant]*v*256 (extra *256) and source player-controller-input.md before 2026-10-27 (consistency pass)
  - name: facing_from_aim
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by:
      - design/gdd/interaction-system.md
      - design/gdd/modular-ship-assembly.md
    attributes:
      # was: expression channel-locked override before 2026-10-27
      # was: expression '... CHANNELLING -> the stored controller.state.channel_face (written by set_channel_ref's face_octant), ...' (no none case) and no octant_of variable before 2026-10-28
      expression: "facing = sector(aim_angle) with 2-quanta hysteresis; overrides: frozen (stagger/down/dead), CHANNELLING -> the stored controller.state.channel_face (written by set_channel_ref's face_octant; none -> facing_prev), running -> movement; aim idle -> movement"
      variables: "aim_angle 0..4095 (1/4096 turn), FACING_HYSTERESIS 64 units, channel_face 0-7 or none (stored, readable by a MIRROR client); octant_of(r), r = anchor_o - foot: NONE if r = (0,0), else argmax over o in 0..7 of dot(UNIT[o], r) (integer, D.3 UNIT table), ties to the smaller o"
      output: one of 8 facings (5 drawn + 3 mirrored)
      precedence: DEAD > DOWNED > IN_POD > STAGGERED > CHANNELLING > class (controller.step)
    added: 2026-10-26
    revised: 2026-10-28
    # Beam state does not change the rule; pad default follows movement until first right-stick input
    # revised 2026-10-28 (rr3): D.8 rule 2 holds facing_prev when channel_face is none; octant_of defined in D.8
  - name: chest_point
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by:
      - design/gdd/pixel-perfect-render-pipeline-camera.md
      - design/gdd/failure-and-trail-system.md
      - design/gdd/emitter-state-and-light-exposure-query.md
      - design/gdd/2d-lighting-and-occlusion.md
      - design/gdd/interaction-system.md
      - design/gdd/derelict-authoring-handmade-kits.md
      - design/gdd/suit-and-equipment.md
      - design/gdd/perception-filter.md
      - design/gdd/hud-and-suit-layer.md
      - design/gdd/in-world-instruments-and-inspect-view.md
    attributes:
      expression: "chest = floor(lerp(pos_prev, pos_curr, tick_alpha)) + CHEST_POINT[sheet][anim] * (flip_h ? (-1,1) : (1,1)); sheet = mirror_of(facing) for the three mirrored facings, else facing"
      variables: CHEST_POINT per drawn sheet (5) and animation, |x| <= 2
      output: integer base px; beam origin (chest-mounted lamp, user decision 2026-10-26)
    added: 2026-10-26
    revised: 2026-10-27
    # was: expression indexed CHEST_POINT[facing][anim]; variables "CHEST_POINT per facing and animation" before 2026-10-27 (consistency pass)
    # Hand point is retained only for tool-sprite placement
  - name: world_scale_k
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/failure-and-trail-system.md
      - design/gdd/perception-filter.md
      - design/gdd/in-world-instruments-and-inspect-view.md
    attributes:
      expression: k = floor(min(W/640, H/360))
      variables: W, H window px
      output: int >= 2; 2/3/4/6 at 720p/1080p/1440p/2160p; remainder letterboxed under keep
    added: 2026-10-26
    revised: 2026-10-26
    # Every screen-pixel figure in every GDD derives from k
  - name: hud_multiplier
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/chart-table-web-map-and-menus.md
      - design/gdd/in-world-instruments-and-inspect-view.md
      - design/gdd/hud-and-suit-layer.md
    attributes:
      expression: H_default = max(k, 3); H in [H_default, 2*H_default] integer
      variables: k (world scale)
      output: int >= 3 on every display; cap height = 7*H px
    added: 2026-10-26
    revised: 2026-10-26
    # HUD never below 3x; Steam Deck runs k=2, H=3
    # Instruments read k as the default rung k_auto (PIPE PR-12)
  - name: zoom_out_k
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/player-controller-input.md
      - design/gdd/failure-and-trail-system.md
      - design/gdd/2d-lighting-and-occlusion.md
      - design/gdd/adaptive-audio-and-tells.md
      - design/gdd/perception-filter.md
      - design/gdd/hud-and-suit-layer.md
      - design/gdd/in-world-instruments-and-inspect-view.md
    attributes:
      expression: k steps through the integer ladder k_z in [1, k_base + 2] via zoom_in / zoom_out (k_base = manual k below Auto if set, else k_auto); field under keep = (2*floor(320*k_base/k_z), 2*floor(180*k_base/k_z)), under expand = (2*floor(W/(2*k_z)), 2*floor(H/(2*k_z))), always even; zoom input at most one step per frame and >= 0.15 s apart
      # was: k steps through the integer ladder [1, k_auto + 2]; visible field = (W/k, H/k) base px before 2026-10-27 (design review)
      variables: k
      output: integer ladder in both directions, persistent, cut per step, reset to default on re-wake
      withholding: "ZOOM_MIN_K static data table keyed by (k_base, target class), default 1; effective ladder [ZOOM_MIN_K, k_base+2]; on a k_base change k_z <- clamp(k_z, ZOOM_MIN_K(k_base_new), k_base_new+2); a refused step logs diag reason WITHHELD (D.5, D.16)"
    added: 2026-10-26
    revised: 2026-10-27
    # Implemented by changing the viewport logical size, never Camera2D.zoom
    # was: k_out = ceil(k/2) single step out — superseded by user decision 2026-10-26 (zoom ladder both directions)
    # was: integer step only, hold-to-step-back

  - name: camera_follow
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/player-controller-input.md
    attributes:
      expression: cam += (target - cam) * (1 - exp(-dt / FOLLOW_TAU_eff)); pose = floor_to(cam, QUANTUM)
      alt_form: "follow_offset_quantised (D.6b): pose_q = p + floor(clamp(f - target + L, -B, B)/Q)*Q"
    # was: exp(-dt / FOLLOW_TAU) before 2026-10-27 (consistency pass)
      # was: variables FOLLOW_TAU_eff = FOLLOW_TAU * s before 2026-10-27
      variables: dt render s, FOLLOW_TAU 0.18 s, FOLLOW_TAU_eff = FOLLOW_TAU * min(1, s), s = field_h / 360 (s = 1 at the default 360-row field), QUANTUM in {1, 1/k} base px
    # was: no FOLLOW_TAU_eff or s before 2026-10-27 (consistency pass)
      # was: output lag = v * FOLLOW_TAU_eff with FOLLOW_TAU_eff = FOLLOW_TAU * s before 2026-10-27
      output: zero overshoot; steady-state lag = v * FOLLOW_TAU_eff (FOLLOW_TAU_eff = FOLLOW_TAU * min(1, s)); settle time t_95 = 3 * FOLLOW_TAU_eff
    # was: steady-state lag = v * tau before 2026-10-27 (consistency pass)
    added: 2026-10-26
    revised: 2026-10-27
    # Quantise after smoothing
  - name: camera_lookahead
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/player-controller-input.md
    attributes:
      # was: expression w = LOOKAHEAD_RUN_WEIGHT*smoothstep(V_WALK, V_RUN, |v|), u_v = per-tick displacement direction before 2026-10-27
      expression: "L_target = L_MAX_eff*((1-w)*m*u(aim) + w*u_v), w = LOOKAHEAD_RUN_WEIGHT * r, r = 1 iff the Controller's committed loco_state == RUN and the avatar moved on any of the last 3 ticks, else 0; u_v = unit vector of the committed movement octant; offset slewed at <= L_SLEW_MAX, eased over LOOKAHEAD_TAU"
      # was: offset = aim_dir * LOOKAHEAD_PX, slewed at <= L_SLEW_MAX, eased over LOOKAHEAD_TAU (pure-aim form) before 2026-10-27 (D6 option B, user rulings)
      variables: aim_dir (local raw aim, regardless of beam state), u_v (unit direction of movement), LOOKAHEAD_PX 72, LOOKAHEAD_RUN_WEIGHT 0.50, L_SLEW_MAX 144 px/s, LOOKAHEAD_TAU 0.40 s
      output: "<= L_MAX_eff = LOOKAHEAD_PX * s (s = field_h / 360): 72 at 360 rows, 54 at 270, 43.2 at 216, 144 at 720; range 48-75 at the default field"
    added: 2026-10-26
    revised: 2026-10-27
    # Player-owned input only; never world state
    # L_MAX scales with the field so the inner-box invariant holds at every ladder step (consistency check 2026-10-26)
    # All solver LENGTH parameters (L_MAX, L_SLEW_MAX, FOLLOW_TAU, LAG_CUT, JUMP_CUT) scale by s; the pan ceiling 1.25*v_max does not (consistency check 2026-10-26, systems-designer finding adopted)
    # D.7 re-keyed the run weight on the committed gait flag to remove per-tick jitter on diagonals (re-review 2026-10-27); value 0.5 and range unchanged

  - name: camera_cut_predicates
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/player-controller-input.md
    attributes:
      expression: "cut if follow_speed > 1.25*v_max for T_PAN, or lag > LAG_CUT, or single-frame jump >= JUMP_CUT, or a named cut source (TRANSIT_HOLD end, loading_to_running, re-wake, pod or transit body transfer: unconditional cuts; wake/load cuts start with L = 0; a weld/detach BODY_TRANSFER with frame_delta_px is a REBASE, not a cut)"
      pan_hold: "P_pan hold time evaluated in the integer domain: running int64 sum of ceil(dt*1e6) us against T_PAN_us = 100000"
      rebase_exception: body_transfer_cut excludes weld/detach rebases (BODY_TRANSFER with frame_delta_px)
    # was: cut if follow_speed > 1.25*v_max for T_PAN, or lag > LAG_CUT, or single-frame jump >= JUMP_CUT before 2026-10-27 (consistency pass)
    # was: ... or body_transfer, or loading_to_running (both unconditional cuts) before 2026-10-27 (design review); predicates are backstops tied to named sources
      variables: T_PAN 0.10 s, LAG_CUT 48 px, JUMP_CUT 48 px at 360 rows (both * s at other ladder steps, s = field_h / 360); invariants LAG_CUT > v_max*FOLLOW_TAU (48 > 32.4) and INNER_BOX_FRAC*field_h > v_max*FOLLOW_TAU_eff + L_MAX_eff, asserted at every reachable field_h and also with the after-update lag at DT_MAX; FOLLOW_TAU_eff = FOLLOW_TAU*min(1,s), L_MAX_eff = LOOKAHEAD_PX*s
    # was: variables used FOLLOW_TAU_eff undefined (FOLLOW_TAU*s) and asserted only at the steady-state lag before 2026-10-27 (design review)
      output: bool -> CUT (never a fast pan)
    added: 2026-10-26
    revised: 2026-10-27
    # Evaluated on the unclamped follow term only
    # second invariant added (consistency check 2026-10-26)
    # length cut thresholds scale with the field; the 1.25*v_max pan ceiling does not (consistency check 2026-10-26)

  - name: flash_count
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/failure-and-trail-system.md
      - design/gdd/emitter-state-and-light-exposure-query.md
      - design/gdd/2d-lighting-and-occlusion.md
      - design/gdd/perception-filter.md
      - design/gdd/hud-and-suit-layer.md
    attributes:
      expression: "F(window) = ceil(n_transitions / 2) over any sliding 1 s window; a transition is |Y_i - Y_ref| >= 0.10 * Y_scale that reverses the sign of the previous transition; a flash is one pair of opposing transitions; a region or frame-mean transition counts on area-weighted change >= 10 % (dM_r = (a_e/A_r)*dY_e); sub-threshold digit swaps and prompt show-starts are exempt from the element-level count only; strict set (no exemption): the Alarm Red mark and every source under reduce flashing"
      # was: F(window) = floor(n_transitions / 2) ... (no area weighting or exemptions stated) before 2026-10-27 (X9 / D91, user rulings)
      # was: flashes_per_s = count of opposing >= 10% relative-luminance changes in any 1 s window before 2026-10-27 (consistency pass)
      variables: "per light, per region = a ninth of the displayed picture at the current field (3x3 grid; 213x120 base px only at the default 640x360 field), and on the frame mean; red flash included"
      # was: per light, per 213x120 base px region, frame mean; red flash included before 2026-10-27 (consistency pass)
      output: must be <= 3 (WCAG 2.3.1)
      y_ref: "Y_ref is a running extremum with direction state (UNSET / RISING / FALLING): the max while RISING, the min while FALLING; a transition fires when the series reverses by 0.10*Y_scale against the current direction; the window is half-open [t, t+1s); F = ceil(n_transitions/2) unchanged (D.15)"
    added: 2026-10-26
    revised: 2026-10-27
    # Enforced in the 2D Lighting modifier contract; deployable flicker must be specified inside it
    # Revised 2026-10-27 (re-review, D.15): the old Y_ref (the level at the last trigger) undercounted smooth flicker. HUD note: orphan transitions (hide, mark OFF edge) are counted by the HUD arbiter so ceil(n_transitions / 2) <= E holds for windows with orphans (hud_flash_budget); no value or unit change
  - name: ticks_for_seconds
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by:
      - design/gdd/emitter-state-and-light-exposure-query.md
      - design/gdd/2d-lighting-and-occlusion.md
      - design/gdd/interaction-system.md
      - design/gdd/attention-system.md
      - design/gdd/suit-and-equipment.md
    attributes:
      expression: round(seconds * TICK_RATE)
      variables: seconds (float, s), TICK_RATE (int, Hz)
      output: int ticks; 10-30 s tell window = 600-1800 ticks at 60 Hz
    added: 2026-10-25
    revised: 2026-10-25
    # RATIFIED 2026-10-27 (user ruling X13 / D1, R-1): round(seconds * TICK_RATE) is round half-up; owners needing a guaranteed-minimum wait use ceil and say so
    # Every duration in every GDD is expressed in ticks via this formula
  - name: hook_runs_this_tick
    status: active
    source: design/gdd/command-simulation-layer.md
    referenced_by:
      - design/gdd/life-support-graph.md
      - design/gdd/emitter-state-and-light-exposure-query.md
    attributes:
      expression: (T mod divisor) == offset
      variables: T (int tick), divisor (int >= 1), offset (int, 0..divisor-1)
      output: bool; effective_hook_rate = TICK_RATE / divisor
    added: 2026-10-25
    revised: 2026-10-28
