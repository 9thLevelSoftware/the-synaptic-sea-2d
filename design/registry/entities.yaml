# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: speed_ceiling
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by:
      - design/gdd/pixel-perfect-render-pipeline-camera.md
    attributes:
      expression: v_ceil = min(ceil(LAG_CUT/(FOLLOW_TAU*TICK_RATE)) - 1, floor((INNER_BOX_FRAC*field_h - L_MAX_eff)/(FOLLOW_TAU_eff*TICK_RATE))) with FOLLOW_TAU_eff = FOLLOW_TAU*s, L_MAX_eff = LOOKAHEAD_PX*s, s = field_h / 360
      variables: LAG_CUT 48, FOLLOW_TAU 0.18, TICK_RATE 60, field_h 360, LOOKAHEAD_PX 72
      output: "3 px/tick at defaults (inner-box inequality binds: 0.30*360 = 108 > 180*0.18 + 72 = 104.4; v_max < 200 px/s)"
    added: 2026-10-26
    revised: 2026-10-26
    # Couples Player Controller speeds to the camera; with v_run 3, FOLLOW_TAU <= 0.20 and LOOKAHEAD_PX <= 75 are the operative ceilings
    # asserted at every reachable field_h, not only the default (consistency check 2026-10-26)
    # Scale-free: with every length knob scaled by s the inner-box inequality holds at every field iff it holds at 360 rows (consistency check 2026-10-26)
    # re-run at V_RUN 3 = 180 px/s

  - name: locomotion_axis_step
    status: active
    source: design/gdd/ship-body-and-interior-physics.md
    referenced_by:
      - design/gdd/player-controller-input.md
      - design/gdd/horror-entities.md
    attributes:
      expression: sub_a += UNIT[octant].a * v_eff; step_a = trunc(sub_a / 256); sub_a -= step_a * 256 (x then y, 1-px AABB sweeps)
      variables: unit table 256 cardinal / 181 diagonal (1/256 px fixed point), v_eff px/tick
      output: integer base px per tick; diagonal cadence walk 1,1,2,1,2,1,1,2; run eight 2s then 3
    added: 2026-10-26
    revised: 2026-10-27
    # Owned by Body's LocomotionStep per PC-14; the avatar has no physics body
    # was: expression sub += unit[octant]*v*256 (extra *256) and source player-controller-input.md before 2026-10-27 (consistency pass)
  - name: facing_from_aim
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by: []
    attributes:
      expression: "facing = sector(aim_angle) with 2-quanta hysteresis; overrides: frozen (stagger/down/dead), channel-locked, running -> movement; aim idle -> movement"
      variables: aim_angle 0..4095 (1/4096 turn), FACING_HYSTERESIS 64 units
      output: one of 8 facings (5 drawn + 3 mirrored)
    added: 2026-10-26
    revised: 2026-10-26
    # Beam state does not change the rule; pad default follows movement until first right-stick input
  - name: chest_point
    status: active
    source: design/gdd/player-controller-input.md
    referenced_by:
      - design/gdd/pixel-perfect-render-pipeline-camera.md
      - design/gdd/failure-and-trail-system.md
      - design/gdd/emitter-state-and-light-exposure-query.md
      - design/gdd/2d-lighting-and-occlusion.md
      - design/gdd/interaction-system.md
      - design/gdd/derelict-authoring-handmade-kits.md
      - design/gdd/suit-and-equipment.md
      - design/gdd/perception-filter.md
      - design/gdd/hud-and-suit-layer.md
      - design/gdd/in-world-instruments-and-inspect-view.md
    attributes:
      expression: "chest = floor(lerp(pos_prev, pos_curr, tick_alpha)) + CHEST_POINT[sheet][anim] * (flip_h ? (-1,1) : (1,1)); sheet = mirror_of(facing) for the three mirrored facings, else facing"
      variables: CHEST_POINT per drawn sheet (5) and animation, |x| <= 2
      output: integer base px; beam origin (chest-mounted lamp, user decision 2026-10-26)
    added: 2026-10-26
    revised: 2026-10-27
    # was: expression indexed CHEST_POINT[facing][anim]; variables "CHEST_POINT per facing and animation" before 2026-10-27 (consistency pass)
    # Hand point is retained only for tool-sprite placement
  - name: world_scale_k
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/failure-and-trail-system.md
      - design/gdd/perception-filter.md
      - design/gdd/in-world-instruments-and-inspect-view.md
    attributes:
      expression: k = floor(min(W/640, H/360))
      variables: W, H window px
      output: int >= 2; 2/3/4/6 at 720p/1080p/1440p/2160p; remainder letterboxed under keep
    added: 2026-10-26
    revised: 2026-10-26
    # Every screen-pixel figure in every GDD derives from k
  - name: hud_multiplier
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/chart-table-web-map-and-menus.md
      - design/gdd/in-world-instruments-and-inspect-view.md
      - design/gdd/hud-and-suit-layer.md
    attributes:
      expression: H_default = max(k, 3); H in [H_default, 2*H_default] integer
      variables: k (world scale)
      output: int >= 3 on every display; cap height = 7*H px
    added: 2026-10-26
    revised: 2026-10-26
    # HUD never below 3x; Steam Deck runs k=2, H=3
    # Instruments read k as the default rung k_auto (PIPE PR-12)
  - name: zoom_out_k
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/player-controller-input.md
      - design/gdd/failure-and-trail-system.md
      - design/gdd/2d-lighting-and-occlusion.md
      - design/gdd/adaptive-audio-and-tells.md
      - design/gdd/perception-filter.md
      - design/gdd/hud-and-suit-layer.md
      - design/gdd/in-world-instruments-and-inspect-view.md
    attributes:
      expression: k steps through the integer ladder [1, k_auto + 2] via zoom_in / zoom_out; visible field = (W/k, H/k) base px
      variables: k
      output: integer ladder in both directions, persistent, cut per step, reset to default on re-wake
    added: 2026-10-26
    revised: 2026-10-26
    # Implemented by changing the viewport logical size, never Camera2D.zoom
    # was: k_out = ceil(k/2) single step out — superseded by user decision 2026-10-26 (zoom ladder both directions)
    # was: integer step only, hold-to-step-back

  - name: camera_follow
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/player-controller-input.md
    attributes:
      expression: cam += (target - cam) * (1 - exp(-dt / FOLLOW_TAU_eff)); pose = floor_to(cam, QUANTUM)
    # was: exp(-dt / FOLLOW_TAU) before 2026-10-27 (consistency pass)
      variables: dt render s, FOLLOW_TAU 0.18 s, FOLLOW_TAU_eff = FOLLOW_TAU * s, s = field_h / 360 (s = 1 at the default 360-row field), QUANTUM in {1, 1/k} base px
    # was: no FOLLOW_TAU_eff or s before 2026-10-27 (consistency pass)
      output: zero overshoot; steady-state lag = v * FOLLOW_TAU_eff; settle time t_95 = 3 * FOLLOW_TAU_eff
    # was: steady-state lag = v * tau before 2026-10-27 (consistency pass)
    added: 2026-10-26
    revised: 2026-10-27
    # Quantise after smoothing
  - name: camera_lookahead
    status: active
    source: design/gdd/pixel-perfect-render-pipeline-camera.md
    referenced_by:
      - design/gdd/player-controller-input.md
    attributes:
      expression: offset = aim_dir * LOOKAHEAD_PX, slewed at <= L_SLEW_MAX, eased over LOOKAHEAD_TAU
      variables: aim_dir (local raw aim, regardless of beam state), LOOKAHEAD_PX 72, L_SLEW_MAX 144 px/s, LOOKAHEAD_TAU 0.40 s
      output: "<= L_MAX_eff = LOOKAHEAD_PX * s (s = field_h / 360): 72 at 360 rows, 54 at 270, 43.2 at 216, 144 at 720; range 48-75 at the default field"
