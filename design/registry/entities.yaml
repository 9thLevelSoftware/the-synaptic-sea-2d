entities:
  - name: save_status
    status: active
    source: design/gdd/save-load-and-versioned-format.md
    referenced_by:
      - design/gdd/chart-table-web-map-and-menus.md
      - design/gdd/hud-and-suit-layer.md
      - design/gdd/debug-overlay-true-values.md
