    source: design/gdd/debug-overlay-true-values.md
    referenced_by:
      - design/gdd/save-load-and-versioned-format.md
    attributes:
      ref_classes_in_precedence_order: "UNAVAILABLE (NOTE) | SKEW (NOTE) | DEFECT_NO_LEAK (DEFECT) | DEFECT_SILENT_LIE (DEFECT) | DEFECT_BYPASS (DEFECT) | DELIBERATE (NOTE, tagged LIE plus a second tag, first match in order: NO_NEEDLE | SHORT_REACH | INTENT_UNKNOWN | SUB_TOL | ONSET) | RETURNING (NOTE) | HONEST (OK) | DEFECT_UNCAUSED (DEFECT, catch-all, with a why tag: NO_LEDGER_DIFF | LIE_WITHOUT_LEDGER | RETURN_STALLED | RETURN_GROWTH | BINARY_RETURN)"
    # was: DELIBERATE (NOTE, tagged LIE or ONSET) and DEFECT_UNCAUSED (DEFECT, catch-all) with no why tag before 2026-10-27 (design review)
      non_ref_classes: "HASH_DRIFT (DEFECT) | PERCEPTION_IN_HASH (DEFECT, harness result) | HOST_MIRROR_MISMATCH (VS-B, n/a in MVP)"
      unavailable_reasons_in_precedence_order: "NOT_RUNNING | SETTLING | REMOTE_VIEWER | NO_LEDGER | NO_RESOLVER | NO_TRUE_SOURCE"
      rule: HONEST is exact equality of the integer p_int and the true value tv (never tol; p_int is displayed_value itself on the honest path, an integer from displayed_pm otherwise); UNAVAILABLE is never shown as HONEST; NO_RESOLVER also covers an unpublished or ambiguous lie_targets(ref) and an invalid calibration (value_hi <= value_lo or arc_deg <= 0); the join to the Sanity ledger is by (viewer, subject_ref, surface or quantity), never by subject alone and never lie_id
    # was: HONEST is exact equality of displayed_value and true value; the join to the Sanity ledger is by (viewer, subject_ref) before 2026-10-27 (design review)
    added: 2026-10-26
    revised: 2026-10-27
