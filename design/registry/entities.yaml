# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

  - name: fairness_gate
    status: active
    source: design/gdd/life-support-graph.md
    referenced_by: []
    attributes:
      expression: endogenous transition to FAILED/DESTROYED (or LEAK->BREACH) allowed iff warn_elapsed >= W_MIN_STEPS, where W_MIN_STEPS = W_MIN_WARNING_S * TICK_RATE / GRAPH_STEP_TICKS = 100 and warn_elapsed counts consecutive runs with a sev>=1 descriptor on the subject
      variables: warn_elapsed (steps), W_MIN_WARNING_S 10, cause in {ENDOGENOUS, EXOGENOUS}
      output: bool; exogenous causes bypass; the transition is deferred, never skipped
    added: 2026-10-26
    revised: 2026-10-26
    # D.11; the reason 'death is a bitch' is never arbitrary
    # pending referenced_by (GDD not yet written): design/gdd/horror-entities.md, design/gdd/interaction-system.md, design/gdd/suit-and-equipment.md

  - name: atmosphere_derive
