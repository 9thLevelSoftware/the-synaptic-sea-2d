      variant_slot_activity: "hatched socket, slots PLATE / JAMB / LEAF (idx reserved, omitted when off): FREE = PLATE on, JAMB off, LEAF off; WELDED two-sided = PLATE off, JAMB on iff W>=3 (W=2: length 0, omitted), LEAF on iff leaf_w>0; WELDED one-sided (this socket hatched, mate bare) = PLATE on, JAMB off, LEAF off; CAPPED = PLATE on, JAMB off, LEAF off; CUT_OPEN = PLATE on, JAMB off, LEAF off. W=2 span is the 96-px doorway (PLATE 96x24); W>=3 span is W*48 (PLATE W*48 x 24, JAMB (W*48-96) x 24). A hatchless socket reserves no variant slots"
