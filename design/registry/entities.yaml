      companion_read: "fail_escalated (bool): true from the AUTOSAVE_FAIL_ESCALATE_COUNT-th consecutive failed write until the next WRITTEN; save_status reads FAILED on every failed write; the HUD counts nothing (HS-46)"
    # was: no companion_read before 2026-10-27 (consistency pass)
