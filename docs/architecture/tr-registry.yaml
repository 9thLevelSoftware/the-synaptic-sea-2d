  revised: ""
  status: active

- id: TR-sanity-037
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Restore, including the death-reload path, reinstates stored Sanity state verbatim: no recompute of stage from level, counters (harm_below_runs, stage_dwell) resume from stored values, and the autosave state fully replaces the dead seat's frozen state."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-038
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Sanity's candidate set must read the simulation lit(ref) value, and a debug counter lit_render_mismatch must count disagreements with the renderer's drawn-lit set, which may lag by at most LIT_RECHECK_TICKS (6) ticks."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-039
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "No UI, HUD, crew strip, pause, chart, menu or inspect-card source may reference a sanity symbol outside the Debug Overlay, enforced by a lint over the UI source root, and no sanity-bearing number, bar, icon or tint may exist on any screen."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-040
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Every Graph node hosting a lie-capable gauge in lie_targets.json must have an instrument placement record and an INSTRUMENT OBJECT subject registered through sync_section for which lit(ref) answers; a node without one fails with INSTRUMENT_NO_BINDING, and the per-seat visit map is bounded by those registered subjects."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-001
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Filter registers no kernel block, step hook or mutator and subscribes only as `PRESENTATION`; its perceived channel is never read by simulation, never persisted and never part of `state_hash`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-002
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Filter writes only `CanvasItem` members, `Material`/shader parameters, particle members and audio requests; it writes no real `Light2D` member, no `Camera2D`/`Viewport`/`SubViewport`/`SubViewportContainer` property, no simulation state; a grep lint enforces it."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-003
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Filter holds no handle on `sanity.state` or `sanity.ledger`, imports no simulation module, never registers/moves an Interaction subject and never submits a command (lint)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-004
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Filter is the only non-diagnostic caller of Graph `true_value(kind, id)` and Suit `true_value(key, player_id)`; HUD and Instruments obtain values only via `perceived()`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-005
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "`perceived(ref: PerceptionRef, viewer: PlayerId) -> Perceived` is a pull query called from the render callback, memoised per (ref, viewer, frame); the no-lie path returns the true value with `leak_amplitude_pm` 0, `motion_mode` HONEST and allocates nothing."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-006
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The `Perceived` record (displayed_pm, displayed_value, frame_override, motion_mode {HONEST,GLIDE,TICK,STALE,BREATH,RETURN}, tick_phase_ms, leak_amplitude_pm, leak_modes bitmask {GLEAM=1,GLIDE=2,SOUND=4}, tremor_weight_pm, lie_id, lie_kind) never contains the true value while a lie is active."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-007
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "`PerceptionRef` is a tagged union (GRAPH_NODE, GRAPH_COMPARTMENT, SUIT_KEY, SCANNER, HOUSING_GLOW, STATE_GLYPH, MACHINE_FRAME) with a stable integer `ref_key` (never an instance id); Sanity's `subject_ref {stable_id, surface 1..5}` maps to exactly one ref via one constructor (bijection)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-008
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "`perceived` answers only for the local seat keyed by PlayerId (never peer_id); a remote PlayerId returns the honest record and `sanity.perception` is `OWNER_PRIVATE`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-009
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Every presentation node under the world layer is TRUTH by default; a `PerceptionTag` resource {class TRUTH_PX/TRUTH_ST/LEAK/CORRUPTIBLE, lie_surface_id} marks exceptions, resolved by a headless-testable resolver; CORRUPTIBLE requires a `lie_surface_id` in `lie_targets.json`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-010
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Build-failing lints: no TRUTH_PX node has a non-rest leak parameter in any frame; TRUTH_ST allows only `edge_bleed_pm`; seam-lane valve/breaker ids absent from the wrapped registry; every module kind in `lie_targets.json` has a tagged CORRUPTIBLE surface; no `set_shader_parameter` on a material shared by more than one node."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-011
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The consequence channel (trails, acoustic classes, Suit body cues, lamp brightness from `served_pm`, AIRFLOW, SEAL_STRAIN), character sprites, crewmate beams, true reveal radius, camera framing, HUD frame, walls/door geometry and Attention tells are never removed, altered, added to or shifted; no lie adds scorch, mist, drip, frost, puddle or sparks."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-012
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Lie trajectories run on sim time: `lie_tau = (T_c - SANITY_DRIFT_DIVISOR * act_run + tick_alpha) / TICK_RATE` (divisor 12, rate 60), using Sanity's `active_run`; displayed value is a pure function of entry, live true value, lie_tau and per-lie constants, modulo one non-persisted slew state; pause freezes lies."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-013
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "All presentation randomness is a pure 32-bit integer hash of (viewer, ref_key, lie_key=Sanity `lie_id`, epoch) plus use tag, with explicit masking; never `rng_derive`, global RNG or `RandomNumberGenerator`; per-lie draws use epoch 0 so they are restore-exact."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-014
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Presentation state (envelopes, slew, return tracks, breath phase, tick phase, tag registry) is never saved and is rebuilt from the formula on `hard_start`; the only persisted inputs are Sanity's ledger including `lie_id` and `next_lie_id`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-015
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The first RUNNING frame after LOADING, and after `force_stage`/`force_level`, is rendered already filtered with envelopes at target and ACTIVE lies at formula value with full leak (`hard_start`); `perceived` is answerable before the first RUNNING frame; counter `first_frame_filtered`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-016
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "A lie ends only by its entry leaving `sanity.perception`; the three end types are presentation-identical (RETURN follower at `GLIDE_RETURN_RATE` until CLEAR); `away` entries cause no ONSET/RETURN/CLEAR/sound change and `away` is read only by the rim gate."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-017
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Every drawn ACTIVE lie carries GLEAM plus a hue-independent motion mode (`popcount(leak_modes)>=2`, GLEAM bit set); only SOUND is droppable; a lie that cannot render both is not drawn (honest path, `lie_unrenderable`); enforced by `lint_leak_palette.gd`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-018
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Gleam is violet `#B07BE6`, edge-only, lit with its host, capped at `LEAK_MAX_CH` (= `DECOY_MAX_CH` 0.85, at most 0.9 x `GLOW_HDR_THRESHOLD`), and never a fill, vignette, blur, colour grade or sanity meter."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-019
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Leak geometry is defined in art px of the 640x360 base, drawn inside the world render (not as a container post-process) as exact integer multiples of zoom k at every k in [1, k_auto+2] under render pass A and B; widths re-derived on a zoom cut; marks are sprites/quads, never `draw_line`; nearest sampling only."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-020
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Filter luminance output obeys PIPE PR-13 (<=3 flashes/s per light per ninth-of-picture region and on frame mean) and HR-13 (HUD <=3 Hz); all sources are amplitude-continuous except the rise-only onset step; verified by a 60 s flash scan at stage 3 at the largest field."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-021
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Stage effects use linear envelopes slewed over `STAGE_RAMP_S` (default 8 s, min 6.5) of `present_time`, rate latched at each target change; stage steps are instant in SIM and never announced; rim fringe ships LIE_BOUND (`reach_lie_active`) and hue bleed ships default-off (`AMBIENT_FRINGES_ENABLED` false)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-022
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Lying numeral readouts share a region scheduler: `T_tick = max(LIE_TICK_MS, N_r*334)`, floor 334 ms, with a region governor guaranteeing >=334 ms between Filter-owned lying ticks; honest numerals use the HUD-owned 500 ms `HONEST_TICK_MS` grid."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-023
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Wander (one sinusoid per lie, 0.40 to 0.45 Hz, `WANDER_AMP_PX` 2.2) guarantees a held lie's needle tip changes quantised pixel at least every 1.0 s; needles below `NEEDLE_LEN_MIN_PX` 16 are not lied on; reduced motion scales time axis only (`RM_GLIDE_SCALE` >=0.7) and never scales wander or removes a leak."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-024
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Filter owns audio class ids `FILTER_AUDIO_CLASSES` (`FA_LIE_SIG_GAUGE`, `FA_LIE_SIG_SPRITE`; VS-A `FA_PHANTOM_MOVE`, `FA_PHANTOM_PRESENCE`) lint-disjoint from Graph witness, Attention and Horror classes, and sends requests `(viewer, ref/position, intent {ON, LEVEL(pm), OFF}, class)` with ON on the first ACTIVE frame carrying `(LEVEL, T_s, SOUND_BREATH_FLOOR_PM)` and OFF at CLEAR."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-025
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Frame order per render callback: Avatar Presenter, then the Filter (dirty-marks in notification, draws in render), then Lighting reads the per-viewer decoy list; SIM-to-pixel latency is up to one sanity run (12 ticks) plus one frame."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-026
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Gleam transport follows a ladder gated by spike S-1: (1) per-instance shader params, (2) `MultiMeshInstance2D` overlay per (depth band, atlas page, light mask), (3) otherwise the surface is not lied on; added effect draws stay within `D_FX_ADDED_MAX` 10; MVP container draws 0."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-027
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Presentation CPU budget: median <= `CPU_BUDGET_MS` 0.5 ms, p99 <= 1.0 ms, max <= 2.0 ms per frame; GPU leak block <= 0.05/0.15 ms at rest (1080p/2160p) and <= 0.15/0.40 ms at stage 3 with four lies; no `STEP_BUDGET_MS` (no hook)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-028
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Fail open to truth: any missing, malformed or unresolvable Filter datum yields the honest path with the matching counter incremented and never propagates to simulation or TRUTH nodes; one live lie per `subject_ref` (lowest `start_run`, then `lie_id`; `lie_collisions`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-029
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Dial/readout surfaces supply a calibration record via the tag (`arc_deg`, `needle_len_px`, zone bands, `lsb`; linear branch `travel_px`) plus a separate pivoted needle sprite, `_msk` edge slice and both honest state frames; absent record means honest path and a coverage-lint failure."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-030
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Container route at MVP is PER_ELEMENT with the `SubViewportContainer.material` slot null (assigned/nulled only by the pipeline root) and published as `filter_route`/`NOT_USED` (not an error); the Filter publishes the decoy list `{decoy_id, kind, anchor, shape, tint_leak, start, end}` for Lighting on mask bit 3 (VS-A)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-031
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Filter ships exactly three distinct ShaderMaterial source files (HullSurface leak block, Emissive leak block, fringe); all are code shaders, none reads TIME, none overrides the sprite's nearest filter, and no sixth material is added without a ratified Lighting decision."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-032
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Every leak shader variant is instantiated once off-screen during LOADING under the black hold, so no variant compiles on first use in RUNNING; the registry counter `variant_first_use_after_loading` must stay 0 in a full 10-minute session."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-033
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Filter correctness depends on a windowed, rendering-capable test lane distinct from the headless CI lane; render-tagged checks must report SKIPPED, never PASS, when the baseline capture is blank or the draw count reads 0."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-034
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Leak transport and the added-draw budget must hold on each renderer backend in the spike matrix (D3D12, Vulkan, Compatibility) on both reference machines, with draw-call counts read through the engine rendering-info monitor, whose 4.7.2 availability is unverified."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-035
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Presentation slew and ramp advance with delta clamped to `DT_SLEW_MAX_S` (0.1 s) so a render hitch cannot snap a needle or produce a flash pair, while `lie_tau` keeps advancing by true simulation time."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-036
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Lie presentation state is independent of visibility and distance: off-screen, unlit or other-compartment lies keep full leak modes, amplitude at or above floor and their sound request, evaluate from the formula at current `lie_tau` on re-entry, and play no onset animation."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-037
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Filter's audio request stream re-sends LEVEL only when it moves by at least `AUDIO_LEVEL_STEP_PM` (20), re-issues ON on the first RUNNING frame after a restore, sends nothing while PAUSED, and the audible start must follow the first ACTIVE frame by at most `SOUND_LEAD_MAX_MS` (100 ms) on the real audio thread."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-038
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The only Filter settings exposed to Accessibility Settings are `reduced_motion_glide_pm`, `breath_depth_pm` and `lie_tick_min_ms`, each range-bound; reduced-motion scale is latched per lie at activation and at `hard_start`, and no setting may remove a leak mode."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-039
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Filter tuning constants are validated at boot by named assertions (rate, arrival-bound, ramp-floor, flash-margin, dead-zone and similar inequalities) that fail boot with the assertion name, and a lint requires the shipped assertion list to equal the Tuning Knobs derived-constraints table."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-040
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Filter publishes a fixed diagnostic counter set (including `lies_drawn`, `leak_repaired`, `lie_unrenderable`, `lie_collisions`, `filter_route`, `first_frame_filtered`, `render_cpu_us`) and a side-by-side `true_value`/`perceived` read for one ref, consumed only by the Debug Overlay."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-041
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Debug Overlay, its Filter hooks and the `--filter-test-freeze-dither` flag are excluded from release builds by file or feature tag, and no accessibility option exposes them; a release-build lint asserts their absence."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-042
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "Breath and sound-envelope periods are drawn per lie from the hash, kept outside registered dead zones fed by other systems' periodic signals (alarm sweep `BEACON_SWEEP_TICKS`, Attention `tell_beat`, Audio fallback breath), so cross-correlation stays below `BREATH_LOCK_CEIL`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-043
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The own-cone rim fringe reads the beam pose Lighting publishes for the same frame and must match it with zero art-pixel error; it adds one draw, casts no light and is absent from `emitter.state`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-044
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "The Filter consumes `sanity.perception` entries of Sanity's closed SN-23 schema (including `direction`, `params.readout_mode`, `away`, `leak_modes`); a published value contradicting the kind mapping follows the published value and trips a debug assertion, and presentation never derives these from `lie_id` hash."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-percfilter-045
  system: percfilter
  gdd: design/gdd/perception-filter.md
  requirement: "`ref_key` values at or above `0xFFFF0000` are reserved for non-subject effect vectors; the `(stable_id, surface)` to `PerceptionRef` join must reject WORN rows and surfaces outside 1 to 5, and a COMPARTMENT record without `quantity` fails closed at build time and at runtime."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-001
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The HUD is a `PRESENTATION`-class kernel subscriber that owns no block, hook, command, mutator, reading key, RNG stream or `INPUT_SURFACE`, and writes only CanvasItem/Material/audio-request properties."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-002
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The HUD is a `CanvasLayer` (layer 2, group `hud`) in the root viewport, never under the 640x360 world `SubViewport`; a `Control` under the world SubViewport fails the scene-tree lint (build gate)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-003
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "HUD scale `H` is an integer in `{H_default..2*H_default}` with `H_default = max(k_auto,3)`, independent of world scale `k`; HUD code never reads `k` or assumes `H==k`; an `H` change alters no simulation value."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-004
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Frame-register nodes (plates, keycaps, prompts, bar, rail, notices) are bit-identical with the Perception Filter on or off; the only Filter-fed exception is an allow-list of mark-slot visibility properties (headless oracle: scene-state hash)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-005
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Exactly six reading-register node families (`suit.o2`, `suit.reserve`, `suit.integrity`, `suit.warmth`, `suit.charge`, scanner slot) are lie-capable and are read only via `perceived(SUIT_KEY(k), PlayerId)` / `perceived(SCANNER, PlayerId)`; HUD modules contain zero `true_value` call sites."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-006
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "`perceived` reads fill a preallocated caller-owned `Perceived` record (`perceived(key, viewer, out)`); no record is cached across frames and steady state makes zero per-frame heap allocations."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-007
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Non-reading suit data comes only from `Suit.view(PlayerId)` (+ `tool_in_hand`, `stowed_count`, `carried_instance`, `tool_charge`, `breath_src`); the four pre-wrap reading fields (`o2_pp_dkpa`, `reserve_pm`, `cell_pm`, `integrity_pm`) are never drawn."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-008
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The HUD's read interface is closed to the HS-6 table; it never reads Attention, Horror, Sanity state, Graph state at a distance, `peer_id`, `lit(ref)`, `loco_state`, `abort_cause`, `input_ignored_view`, or any `PERCEPTION_OUT` block."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-009
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Update model is hybrid pull: `perceived`, `focus_view`, `channel_view` and Controller reads are pulled every render frame; the discrete model rebuilds on dirty key `S/<PlayerId>` / `save_status`, and is force-rebuilt on first RUNNING frame, any restore, `ALL`-coalesced dirty (> `MAX_DIRTY_KEYS` 256), exit from PAUSED, and any `H`/locale/glyph-device change."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-010
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Animation, settle, debounce, bar fill/drain and tick phases run on `present_time` (frozen while kernel PAUSED); the mark phase, honest-numeral grid and flash-arbiter window use committed tick `T` + `tick_alpha`; layer 3 uses process time; post-pause/hitch time steps clamp at `HUD_DT_CLAMP_MS` 50 and no integrator divides by dt."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-011
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "`HudLayout` outputs integer HUD-px rectangles via manual snapping (`anchor_snap`) at every `H`/display; `Control.scale` is (1,1), no node animates scale/rotation, `offset_transform_*` unused, and bars/arcs are rect/atlas fills, not `draw_line`/`draw_arc`; `gui_snap_controls_to_pixels` is never relied on."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-012
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Needle tips quantise to whole HUD px and the Filter never-rest rule (`NEVER_REST_MAX_S` 1.0 s) still holds (tip pixel changes at least once per 1.0 s at H 3 and 6; `L` 11 ineligible)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-013
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The surface inventory is closed (`hud_strip`, `hud_suit_panel`, `hud_rail`, `hud_prompt`+`hud_bar`, `hud_give_up_plate`, `hud_notice`, conditional `hud_aim_indicator`, inspect-card frame, reserved anchors); forbidden surfaces (minimap, health bar, Attention/sanity/horror indicators, toast, death screen, etc.) are lint-banned under any setting."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-014
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The strip's breath dial shows `suit.o2` while `breath_src` is ROOM/GASP/NONE and `suit.reserve` (whole seconds) while RESERVE; `breath_src` also selects hue and mark eligibility and is never derived from displayed values."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-015
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Warning-mark phase is `((T mod BEACON_SWEEP_TICKS)+tick_alpha)/BEACON_SWEEP_TICKS` (`BEACON_SWEEP_TICKS` 128, duty `MARK_DUTY_PM` 500), leading edge at `T mod 128 == 0` within one render frame of the audio edge, one shared phase for all six mark slots."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-016
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "While PAUSED an active mark is held ON solid, and on resume stays ON until the next leading edge (resume bridge); reduce-flashing/reduced-motion hold marks solid (reduce_flashing default ON)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-017
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "A single flash arbiter keyed to `T` window `(T-TICK_RATE, T]` enforces `FLASH_MAX_PER_S` over all HUD luminance events: clock-locked events never delayed, hides never deferred, deferrable events wait at most `MAX_DEFER_TICKS` 60, grid boundaries are skip-only (`GRID_MAX_CONSEC_SKIPS` 1), overruns are recorded as `HUD_FLASH_OVERRUN`, never dropped, never altering the Filter's schedule."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-018
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The HUD creates no simulation state and persists nothing: no HUD state is saved, replicated or hashed; on restore all presentation-local counters (debounce, grid, bar fill/drain, tick phases, flash history, device latch) are cleared and readings draw directly at restored values with no settle."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-019
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Save feedback is read-only: failed-write notice shows when Save/Load's `fail_escalated` (threshold `AUTOSAVE_FAIL_ESCALATE_COUNT` 3) is true and clears on `WRITTEN`; the HUD counts nothing; first-frame line shows for `UI7_DWELL_S` 8 after a fallback load or a `DEATH_STUB` restore (`restore_reason` read as request only)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-020
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Interaction display is driven by `focus_view(seat)`, `channel_view(seat)` (local seat only), the result-event record, and Controller `confirm_view`/`glyph_view`; the bar fill is `fill_px = (hold_pm*L) div 1000` with the HUD doing no hold drain, and prompt show follows Interaction D.UI-2."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-021
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The HUD issues no commands and plays no sound (zero HUD-originated audio requests at MVP); sound-request ids exist only for dormant lie slots, and the mark clock is the shared AAV-9 grid, cited not reimplemented."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-022
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Per-frame presenter order is fixed (camera solver, Avatar Presenter, Filter, HUD, Lighting) so `world_to_hud` and `perceived` are read after their producers."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-023
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "HUD performance budget on RM-DESKTOP (1920x1080) and RM-DECK (1280x800, `H` 3 over `k` 2) release export: <= 60 draw calls, <= `HUD_PRIMITIVE_MAX` 90 primitives, <= `HUD_FRAME_BUDGET_US` 400 us p95 over 600 frames, atlas+needle footprint <= `HUD_MEM_CEILING_MB` 8; provisional until spike S2."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-024
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "HUD maths (`strip_budget`, `hud_flash_budget`, `reserve_seconds`, `mark_phase`, `o2_dial_angle`, `bottom_row_fit`, `anchor_snap`, `cap_px`, `needle_frame_index`, etc.) are pure static functions assertable headlessly (e.g. `cap_px` H3..6 = 21,28,35,42; `side_avail` 149,102,73,53 at 1280)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-025
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Dial faces are baked once per layout (not per frame) and instrument faces use bitmap/atlas assets with tabular numerals; the widget approach (Control tree vs custom draw) and Theme structure are an ADR decision."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-026
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Tuning data lives in external `hud_tuning` data validated at load; out-of-range knobs (e.g. `PROMPT_MIN_CYCLE_TICKS` < 20, `HONEST_TICK_MS` != 500, `HUD_SETTLE_MS` outside 250-400, `BAR_LEN_*` not ordered S<M<L in 12-64) fail, and no gameplay-balance key may exist in it."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-027
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Nine diagnostic counters (`HUD_READ_MISSING`, `hud_perceived_oob`, `hud_unmapped_key_glyph`, `UI_MISSING_KEY`, `hud_layout_overlap`, `UI_PLACEMENT_WITHHELD`, `HUD_FLASH_OVERRUN`, `hud_plate_overflow`, `hud_unknown_override`) exist, read 0 on a clean run, and are exposed via `hud_debug_snapshot()`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-028
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "`HudSettings` hooks (opacity, reduce_flashing/flash_mode, aim_indicator, pattern strength, etc.) are consumed by the HUD but never read or written by game state; Alpha settings screens are owned elsewhere."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-029
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Prompt plates and glyphs follow the Controller's device latch and closed `keycap_token` enumeration; unknown tokens fall back to the `?` keycap and count `hud_unmapped_key_glyph`; gamepad-only play of the core loop is fully supported."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-030
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Missing upstream data degrades safely: a missing `perceived` record draws a blank numeral with arc at rest and increments `HUD_READ_MISSING`; the HUD never falls back to `view()` readings or invents a rule for an unowned *when*."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-031
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The HUD reaches Suit, Filter, Interaction, Controller, Save/Load and the kernel clock only through injectable interfaces, accepts a scripted (T, tick_alpha) pinner, and exposes a scene-state hash (ordered visible nodes with atlas region, rect, modulate, visibility) so a headless lane asserts what the render lane checks as pixels."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-032
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The needle settle is a closed-form critically damped step that is frame-rate independent (6x50 ms, 18x16.7 ms and 1x300 ms agree), keeps position and velocity continuous on retarget, never overshoots, yields no NaN for any dt, and receives its dt already clamped by the caller."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-033
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Suit publishes per-axis rung states and a one-bit TRUTH-class `suit.alarm` key (lie stage pinned never, read via `perceived`); the HUD derives mark_active from them and never compares displayed values to thresholds."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-034
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The `Perceived` record schema carries displayed value and permille, motion_mode (HONEST/GLIDE/TICK/STALE/RETURN), tick phase, leak amplitude and lie_tick_min_ms; the Filter owns the lie schedule, the HUD clamps out-of-range fields and never reschedules substitutions."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-035
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Zone and band constants (O2 band edges, HYPOXIA_PP, SUIT_HP thresholds, warmth zone edges, RESERVE_S, CELL_*) are read by name from their owners' published data with no HUD literals; a missing or non-increasing edge draws no notch, counts hud_perceived_oob and fails the data-load lint."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-036
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Interaction and Controller views expose monotonic transition_seq/result_seq, ended_by, length_class, give_up_live and press_blocked_moving; the HUD edge-detects them so terminal transitions are never skipped across multi-tick render frames, and never recomputes length_class or drains hold itself."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-037
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Plate placement uses `world_to_hud(anchor)` on the unjolted camera pose with floor snapping; a zoom step re-projects plates and recomputes bar fill but recomputes no layout, while an `H` change recomputes layout as a cut; plates are withheld, never clamped, when no placement clears."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-038
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "`HudLayout` is a pure function of (picture rect, H) over a closed `offered()` display table (720p to 2160p, ultrawide, Deck keep/expand) with per-side fit and 5% safe margin; an out-of-set pair raises a defect flag, counts hud_layout_overlap and falls back to `H_default`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-039
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "Every HUD string resolves through `tr()` with a StringName key (a missing key renders the key and counts once per distinct key per show); plates wrap at 72 px under a +40% pseudo-locale without truncation; digit changes are atlas-region swaps with no text reshape."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-040
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "The HUD is unmounted until the first committed tick, draws nothing and calls neither `view()` nor `perceived` before it or during kernel LOADING, holds its last model through DEAD and LOADING, and adds no scene node on death or restore except the record line."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-041
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "In `gameplay` context every HUD node has `mouse_filter` IGNORE and `focus_mode` NONE, gamepad focus is never assigned to a HUD node, and the OS cursor visibility follows the active input context."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-hud-042
  system: hud
  gdd: design/gdd/hud-and-suit-layer.md
  requirement: "All HUD Controls use the single `ui_theme_main` Theme with no per-node colour, font or stylebox override, and shared components (keycap, plate, bezel, bracket, bar, tabular-numeral label) each exist once as a reusable scene or resource."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-001
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Instruments register zero sim blocks, hooks, mutators, commands, dirty keys or persisted fields; they are `PRESENTATION` subscribers that write only CanvasItem, Material, Light2D, particle and audio-request state."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-002
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Instruments persist and replicate nothing; all settle, tremor, dwell, numeral-throttle and cull-history scalars are discarded on restore, cull, camera cut and `hard_start`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-003
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Each on-screen instrument in a loaded section makes exactly one `perceived(ref, viewer)` call per frame, via one `InstrumentPresenter` per instrument; wall node and card are views of the frame index and digits it publishes once per frame."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-004
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Instruments never call `true_value`, `summary()`, `power_use()`, `can_join()` or `block_hash()`, never cache a `Perceived` record across frames, never address the Filter by `peer_id`, and never derive a displayed value themselves."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-005
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Non-value `read_view` inputs (tremor predicate, module frame selection, WORN, patch-plate hp, alarm eligibility, binding validity) are refreshed once per Graph step (`GRAPH_STEP_TICKS` 6), never per frame, and never feed a displayed value."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-006
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "An instrument that was culled or whose section was unloaded snaps to `displayed_pm` on its first pull with no settle or interpolation from stale history."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-007
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Every instrument is one data record in `assets/data/instruments/` (`instrument_id`, `gauge_kind`, `size_class`, `quantity`, `value_lo/hi`, `lsb`, `unit_key`, `name_key`, `zones[]` as LS-7 band names, `lie_surface_id`s, `beyond_witness`) rendered by one scene definition at two scales (wall `k` and card `H`); a missing or malformed record yields the honest path plus `lie_unrenderable`, which is a build failure for any kind in `lie_targets.json`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-008
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Build-time lints fail the build on: `BEYOND_WITNESS_MISMATCH`, `LIE_SURFACE_ENUM_MISMATCH`, `INSTR_QUANTITY_COLLISION` (duplicate `(subject, quantity)`), `ALARM_MARK_ON_REMOTE`, `INSTRUMENT_NO_BINDING`, `PANEL_GAUGE_VERB_CONFLICT`, a zone arc narrower than `ZONE_MIN_ARC_PX` (6), and `lsb` visibility (D.12); `NO_BEAT_C_FIXTURE` is advisory."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-009
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Zone thresholds are derived at build time from LS-7 band names and never typed into instrument data; zone bands, ticks and bezel arcs are baked sprites, never drawn at runtime."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-010
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The needle is a separate pivoted element placed on whole art pixels with NEAREST sampling, 2 art px thick; baseline is pre-rendered needle frames indexed by rounded tip pixel (about 100 on DIAL_L, 76 on DIAL_S), with the wall and card reading the same frame index; no antialiased drawn lines."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-011
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "A needle's motion is selected solely by the Filter's `motion_mode` (HONEST, GLIDE, TICK, STALE, BREATH, RETURN); an honest gauge never glides and a lie never settles or starts a tremor; the instrument never infers a lie."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-012
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Honest motion is \"step, then rest\": a new honest sample ramps from `prev_honest_pm` to `target_pm` over one Graph step (100 ms) through the PR-8 rule-5 interpolator (`tick_alpha`); rest means no sample for `INSTR_REST_STEPS` (3) steps; a closed-form underdamped settle (D.4, overshoot at most 5 %, 250-400 ms) fires only on `settle_eligible` quantities (`load` at MVP) when the change accumulated in the 4-step window reaches `INSTR_SETTLE_JUMP_PM` (40)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-013
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "A reversal of at most one quantum is held `INSTR_REVERSAL_DWELL_STEPS` (4) Graph steps before acceptance, so a 10 Hz dither across a quantum edge yields at most one needle move."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-014
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Honest tremor (positional, +-`TREMOR_AMP_PX`, 6-10 Hz, raised to a 2 screen px minimum at `k` 1) starts only when `motion_mode` is HONEST and a physical-stress predicate holds, and is never driven by Attention, sanity, a timer or a lie; a tremor running at lie onset fades by the Filter's `tremor_weight_pm` over `TREMOR_BLEND_S` (latched `env_hold`), while the settle triple and the reduced-motion notch clear at once."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-015
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Under `reduced_motion` honest settle becomes a step and tremor (wall and card) is replaced by a held stress notch pair shown only while HONEST and the predicate holds; the alarm mark holds solid."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-016
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The card numeral is formatted integer-only from `displayed_value` per the quantity table and `lsb`; honest numerals update only on the HUD's shared `HONEST_TICK_MS` (500 ms) grid with at most `FLASH_MAX_PER_S` (3) transitions per second, showing the then-current step; lying numerals are drawn from Filter-supplied digits under `T_tick`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-017
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The inspect card opens only from the `gameplay` context on a press while the target is lit (`lit(ref)`, Emitter State) and resolvable; it uses the same `PerceptionRef` and `Perceived` as its wall gauge, so it lies identically (no card ref, no card lie), and opening it calls no `record_falsification`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-018
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The card closes in the same render frame, with no animation, on `lit(ref)` false, `cancel`/B, a second `inspect`, restore/`hard_start`, binding loss, leaving reach, section transit, any context change (pause included, with no restore on resume), STAGGERED/DOWNED/DEAD/IN_POD, or movement past the dead-zone (avatar moves in the same frame); the card runs in real time on `present_time` and does not pause the sim."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-019
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The card is a seat-local layer-2 node subtree on an opaque Ground plate, never replicated and not an `INPUT_SURFACE`; all card/instrument Controls have `mouse_filter` IGNORE and `focus_mode` NONE; it is placed via `world_to_hud(anchor_px)` with side chosen at open (right, left, above, below), latched, and follows its anchor per frame on the HUD grid."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-020
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The card contains only label (`name_key`), the same dial/meniscus and zones, and one numeral with `unit_key`; it never shows a state/condition word, rating, bar, reason string, lie indicator, wear or alarm mark; all text goes through `tr()` StringName keys, and a missing glyph falls back per element to the default-locale string then the `instrument_id` stencil."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-021
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Instruments are `INSTRUMENT`-class OBJECT subjects registered via Interaction's `sync_section` from Layout's `subject_anchors(section_id)`, counted inside `INTERACT_FIXTURE_BUDGET`; `N_loaded` must not exceed `INSTRUMENT_SHARE_MAX` (24 placeholder); `inspect` acts on primary focus if it is an INSTRUMENT, else on a secondary INSTRUMENT slot (provisional pending Controller/Interaction)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-022
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The Module-Body Presenter selects one honest sheet frame from Graph `state`/`served_pm`, with `frame_override` swapping only to the other honest frame of the pair; SPRITE_SWAP eligibility requires an Item DB `has_both_frames(def_id, pair)` query, and both frames of every lie-capable `mach_*` sheet sit on one sheet page."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-023
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The in-world 16x16 Alarm Red mark is an untagged TRUTH node drawn only on housings physically at an `alarm_eligible` subject per the IW-19 decision table (never on DIAL_S, GLYPH, FRAME, the card or REMOTE instruments), uses the descriptor's `alarm_eligible` flag and never re-derives it from `sev`, and pulses no faster than 3 Hz."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-024
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The gleam is drawn from `leak_amplitude_pm` as a runtime material parameter on glass/needle/housing edges only (never baked, never a fill, peak channel at most `LEAK_MAX_CH` 0.85, hue fixed under coloured light), at zero added ShaderMaterials (LO-13 budget of five); fallback is a child edge sprite per lying instrument if per-instance shader parameters are unavailable."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-025
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "World gauge faces are not gated in code on `lit(ref)` (the lit renderer/HullSurface makes unlit faces dark); only the inspect prompt and card are gated on `lit(ref)` (hysteresis `LIT_ON_PM` 150 / `LIT_OFF_PM` 120); the housing pip is on the emissive layer (mask bit 2), exists only while `served_pm` > 0, casts no light and is corruptible via `HOUSING_GLOW(ref)`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-026
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Performance budget: for 20 on-screen instruments (4 lying) the presenter pass costs median at most 0.25 ms and p99 at most 0.5 ms on RM-DESKTOP and RM-DECK release builds (proposal, pending technical-director acceptance); per-frame work is O(1) per instrument; draw calls are at most 2 per instrument plus 1 per lying instrument on the gleam fallback; `perceived()` calls equal the on-screen instrument count."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-027
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The `load` reading must be a Graph-published `load_pm` `true_value` kind (0 when `supply` is 0, else `min(1250, floor(1000*demand/supply))`, quantum `LOAD_QUANTUM_PERMILLE` 20, separate dead/idle/overload cases); Instruments never derive it, and until granted `inst_engine_bus_load` is not buildable as a lie target."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-028
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Lie-eligibility floors are lints over data and placements: L-2I per seat and direction (fixed same-loop gauge, scanner, or suit for ALARM-direction only), at least 3 lie-eligible surfaces per site (counted as a range by scanner availability), a consequence-channel witness within `WITNESS_HOPS_MAX` 2 sharing no node, and no decorative gauge (`beyond_witness` non-empty)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-029
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Hard never-do list: no schematic/overlay/minimap/ship-status/loop-summary screen, no numerals or text on a world gauge, no closed progress ring, no condition word/bar, no Attention/threat/proximity indicator on any instrument, no sanity/lie counter, and a scene lint asserts no node outside an instrument or the card renders Graph state at a distance."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-030
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "A binding to a DESTROYED, SALVAGED, ABSENT or unresolvable node shows a truth-graded DEAD frame (hairline crack, snapped 4-px needle stub) with no prompt, card, gleam, tremor or pip; a missing Filter datum falls back to the honest path."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-031
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "In development builds only, each instrument exposes read-only `drawn_value(ref)` and `instrument_diag(ref)`, publishes a stable integer `ref_key`, keeps counters `diag.instr_pm_clamped`, `diag.inspect_unresolved`, `diag.instr_quantity_collision`, `diag.gleam_over_cap`, and registers one Debug Overlay channel (DO-12); all stripped from release builds and never exposing `true_value`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-032
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "`inspect` is not a kernel command; the `inspect_card` input context sends `set_move_intent {NONE}` on entry, and movement past `MOVE_DEADZONE` (plus `CARD_PAD_DEADZONE_MARGIN` on a pad) closes the card and submits the first `set_move_intent` in that same frame. A direction key held at open is ignored until released, `set_aim` stays live, and the cursor stays hidden and inert."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-033
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Card open latency: a press on a lit target draws the card within 2 render frames (next frame nominal) at any tick after focus or close, with no dropped press. The prompt appears after the HUD-owned `PROMPT_SHOW_DEBOUNCE_TICKS`, read by name and never hard-coded, and the debounce delays only the plate."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-034
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Tremor frequencies and phases derive from a hash of the stable integer `ref_key`, never from `rng_derive` or any wall-clock or unseeded source, so a given instrument shows the same offset sequence every run and across a restore, and different instruments differ."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-035
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "The `Perceived` record carries the native-unit `displayed_value` alongside the permille triple. The card numeral is built from the native value, never rebuilt from the lossy pm triple, and uses an explicit `floor_div` helper because native GDScript integer division truncates toward zero."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-036
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Instruments request no sound directly; they publish only `card_opened` and `card_closed` once per transition, plus a single `UI_INSTRUMENT_CARD_UNLATCH` request on light-loss close. Lying-gauge sound comes only from the Filter, and Audio's hum-pitch sign must track the needle, machine frame and lamp values."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-037
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Instrument and overlay sheets (`mach_*`, `ui_*`, `ovl_*`) are lossless palette-locked PNG with binary alpha and NEAREST filtering. They carry the required named slices (`glass`, `needle_edge`, `needle`) and state-token sidecar vocabulary, and a build lint scans reserved hue bands."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-038
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Each instrument placement record carries a valid `instrument_id`, `node_ref` or `room_key` plus `quantity`, `mount` in {WALL_FACE, MACHINE_PANEL} and `host_face`. Lints forbid DIAL_L on pipe runs, restrict DIAL_S to terminal fittings or panels, and make a panel-mounted gauge beside a verb target an error while the secondary-slot question is open."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-039
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Card, alarm mark, housing/glyph gleam, notch placement and panel-only dials are each independently switchable by a data flag; disabling one leaves the inspect binding dormant and changes only a pre-declared set of other criteria, verified by a test-owned per-flag matrix."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-040
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Only presentation nodes with a `lie_surface_id` in the corruptible set are bound to a `PerceptionRef`; anchor and TRUTH nodes (housing, bands, ticks, alarm mark, DEAD frame, notch, card frame, label) carry no ref and no tag, enforced by a scene lint."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-instr-041
  system: instr
  gdd: design/gdd/in-world-instruments-and-inspect-view.md
  requirement: "Card plate size and placement are a pure function of display size, `k` and `H`: `H_card` is an integer HUD scale capped by the display, plates snap to the HUD art-pixel grid, candidate rects are rejected on overlap, and a resize or zoom re-projects without closing the card, with side changes as cuts."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-001
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The chart table is one layer-3 `CanvasLayer` in the root viewport, opened only by the `chart_table` action from the `gameplay` context, and is never wrapped by the Perception Filter or Sanity (pixel-identical at sanity stage 0 and forced stage 3 apart from the world beneath)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-002
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The layer registers no state block, hook, command or mutator, submits zero commands at MVP, and holds only host-local state (`ChartPick`, `PauseGate`, `SettingsStore`, authored layout) that is never in a snapshot."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-003
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "`PauseGate` is the single adapter to the kernel control plane (`request_pause`, `request_resume`, `request_shutdown`): SOLO pauses on open and resumes on close; OVERLAY (VS-B) makes no kernel call; no chart/pick/panel/menu rule may read `kernel.state == PAUSED` except `PauseGate.can_save_quit`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-004
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "`PauseGate` re-issues the latest desired pause state until the kernel matches, so a same-boundary `request_pause`/`request_resume` pair leaves no wedged half-open state."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-005
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Layer 3 handles input and animates on its own UI clock (render delta, deltas clamped to `UI_DT_MAX_MS`) independent of kernel state, `present_time` and `SceneTree.paused`; hold timers and filament drift accumulators persist across opens."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-006
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "A layer raise (panel open, console-press chart open, Chart from panel, message plates) arriving less than `CHART_REOPEN_MIN_MS` (334 ms; 1000 ms under reduce flashing) after the last lower is queued in a single latched cancellable slot and applied together with its `request_pause`; lowers/closes are never delayed."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-007
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "`ChartPick` is NONE or one `derelict_id`, host-local, never persisted, never a field of `web.state`/`web.view`, reset on any `request_restore`, on arrival, or when the picked record leaves the legal-target mirror, and frozen while `transit_state != IDLE`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-008
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The legal-target mirror is computed purely from `web.view` for selectability only (empty while any record is `berthed` and not ABSORBED; never reflects fuel/range/busy refusals) and is not a second copy of WM-9's reason order."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-009
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The pod console press is the only simulation write; the Input Adapter's seam injects `ChartPick` into `pod_hop{target_id}` / `berth{derelict_id}` per the R1-R8 verb-resolution table, routes a no-pick press to \"open chart\", and `unberth{}` never needs a pick."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-010
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The layer reads no input device: all input arrives as the Adapter-owned MenuInput event stream (NAV_DOWN/UP, ACCEPT_DOWN/UP, BACK, CLOSE, FOCUS_OUT/IN, DEVICE_CHANGED, POINTER), delivered on render frames at frame start; mouse buttons never produce ACCEPT."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-011
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Every layer-3 `Control` is created with `focus_mode = FOCUS_NONE` and `mouse_filter = MOUSE_FILTER_IGNORE`; the layer tracks a single retained focus id itself and the bracket is drawn from keyboard/gamepad focus only."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-012
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The Adapter latches the closing activation, key echo and the open press's release/repeat so no `interact` edge reaches gameplay or the layer until a fresh press, protecting the irreversible `pod_hop`; focus loss aborts any hold fill."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-013
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Chart layout is authored data (`assets/data/ui/chart_layout.json`, path provisional): per-`derelict_id` art-px positions in a fixed 288x162 `CHART_FRAME`, `home_attach` offsets, ring radii, filament refs and ordinals; nothing is derived from `world_slot`, leg data, ticks or distance; a missing position is a content-lint failure with a deterministic runtime fallback."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-014
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The chart draws `web.view` only (nodes, `pod_at`, `transit_state`, `leg_target_id`/`leg_origin_id`/`leg_dir`) and never calls `web.leg_timing()`; while `transit_state != IDLE` it is view-only and the in-flight route is drawn only from `leg_*` fields, never from `ChartPick`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-015
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Hard never-show rules: no Attention, horror, sanity, loot value, salvage count, fuel, time, ETA, danger, \"recommended\", distance or name label on any chart/panel/menu surface under any setting, and no save decoration (autosave mark, thumbnail, spinner, \"progress saved\")."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-016
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Every layer-3 rectangle is positioned by anchors 0/1 plus integer HUD-px offsets (panel width `floor(canvas_w/3)`), valid at every HUD canvas `picture/H` with `H` in `[H_default, 2*H_default]`, `H_default = max(k,3)`; chart multiplier `m < 1` switches to the compact vertical list."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-017
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Routes, seams and rule lines are 1-art-px quads aligned to whole art px (no width-1 line draws on fractional transforms); filament drift moves in whole-art-px steps from an authored irregular interval table (>= 1 s) and stops under reduced motion."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-018
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The `SettingsStore` is a host-local per-install store of four comfort values (display mode, reduced motion, reduce flashing, master volume) plus `notice_seen`, not a kernel block and not WORLD/PROFILE scope; the safety toggles and `notice_seen` are written synchronously, display mode and volume debounced (`SETTINGS_WRITE_DEBOUNCE_MS`) and flushed on close/quit/exit; first-launch default is reduce flashing ON."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-019
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The `SettingsStore` exposes a read interface and presentation-only change signal to consumers (Lighting, Filter, Audio, Camera); a missing/unreadable store is treated as first launch and re-shows the photosensitivity notice; a write failure shows one ship-log line once per process."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-020
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Save & Quit disables items and presents one frame, then calls Save/Load `save_and_quit()` which must return promptly (`REFUSED_DOWNED`/`STARTED`) and report via `save_status`/`quit_held`/`quit_write_active` without blocking the frame loop; the layer holds no write timer and calls `cancel_held_close()` once on return to play."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-021
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Boot-flow calls into Save/Load (`new_game(world_seed)`, `continue_campaign()`, `retire_campaign`, `delete_campaign`, `campaign_info()`, `list_saves()`) follow a load sequence: items disabled and plate removed, layer-1 black presented (>= `t_hold_pad` 120 ms), then the blocking call, then a camera CUT on the first RUNNING frame; nothing is drawn between."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-022
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Destructive actions (UI-3 quit-without-saving, UI-5 Retire/Delete) use a linear hold-to-confirm gesture on the UI clock reading the action's effective duration (`CONFIRM_HOLD_S`, `DELETE_HOLD_S` = 2x), firing on the first frame the threshold is reached and aborting on release/cancel/chart_table/pointer exit/focus loss."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-023
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "FAULTED in release returns to the boot-flow main menu with Continue focused (the kernel never overwrites the existing save)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-024
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "All user-visible strings are keys in a closed `ct.*` table via `tr()` with fit classes (`LABEL_1`/`LABEL_2`/`PARAGRAPH`), lint-measured with the real faces at every canvas row, never truncated; instrument face (bitmap, integer H) versus reading face (vector, continuous scale)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-025
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The layer plays no sound itself; it requests UI-bus cues (focus-move, confirm, `UI_CHART_REOPEN_QUEUED`) from Adaptive Audio and publishes the master-volume step through the `SettingsStore`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-026
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Every focusable chart node is a `Control` carrying an accessible name equal to its neutral ordinal (nothing drawn), and every other control's accessible name is its visible `ct.*` label; the compact list uses a stable authored order with whole-key `ct.compact.slot_<n>` ordinals."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-027
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Layer-3 draw calls stay within `LAYER3_DRAW_CALL_BUDGET` (default 40; estimate ~26 on the MVP chart, max 33), asserted at load and measured via `Viewport.get_render_info`; layer 2 (HUD) is hidden under a full-bleed plate."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-028
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The chart table layer is an `INPUT_SURFACE` subscriber class, reads only `web.view`, `SaveInfo`, `save_status`, `restore_reason`, `campaign_info()`/`list_saves()` and its own host-local state, and rebuilds its state machine from CLOSED on any `request_restore`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-029
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Rate of large-plate raises is limited so the registry `flash_count` stays `F <= 3` (<= 2 under reduce flashing) on the layer-3 rectangle; verified by a per-frame linear-luminance capture."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-030
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Display & Comfort changes apply immediately (no Apply/revert timer), read back the applied display mode, and recompute `k`, `H_default`, canvas and panel width live while retaining focus by item id."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-031
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The layer state machine is data-driven from `assets/data/ui/chart_table_transitions.json`, diffed at build against a fixture of every authored (from, trigger, to) triple; every kernel `request_*` and Save/Load API call is bound to exactly the edges that name it, and every state has a path to CLOSED or a boot exit."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-032
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Every layer-owned tuning knob is read from a config resource with a registry entry of identical name, never a script literal; out-of-range values and violated coupled constraints (C-1..C-10) are clamped with a log line or refused at load, and derived knobs are computed, not settable."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-033
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Layer-3 script time per frame stays within a measured budget (placeholder 0.5 ms, p95 over 600 frames on RM-DESKTOP and RM-DECK release exports); opening a surface costs one presented frame, the layout file is parsed at boot, and a `SettingsStore` flush completes inside one frame."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-034
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "An OS window-close request is handled by Save/Load, not the layer; the layer reacts to `quit_write_active` and `save_status`/`quit_held` from any state including CLOSED: it enters `SAVE_QUIT_WAIT` with nothing drawn from CLOSED, raises the panel with one `request_pause` on FAILED, and shows `UI3_PLATE` on `SL_QUIT_NO_WRITE_DOWNED`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-035
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Boot-flow screens (notice, main menu, UI-5, UI-7/8/9, load hold) run while the kernel is not RUNNING with no session: they make no `request_pause`, reference no Sanity, Filter or Attention symbol, are not children of the Filter viewport, and Quit from any of them calls only `request_shutdown`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-036
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "Adapter `POINTER` events carry a position in a defined unit (canvas or window px) mapped to HUD and art px under the `canvas_items` stretch, with picture top-left mapping to HUD (0,0); the layer publishes a cursor-hint request on hover; the unit is verified by a 4.7.2 spike."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-037
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "On fractional HUD canvases (e.g. 426.67 x 266.67 at `H` 3) every bitmap glyph, bezel, seam and route edge lies on a whole screen-pixel boundary, 1-art-px strokes are exactly `H` screen px on every side, and the panel left edge is an integer screen px, verified on the real display path."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-charttable-038
  system: charttable
  gdd: design/gdd/chart-table-web-map-and-menus.md
  requirement: "The layer takes all neighbours (view, kernel control plane, Save/Load, clock, store, window, audio, MenuInput) by injection and exposes a per-frame draw list, forced-`H`, frame-capture and `force_stage` hooks as data, with contract tests keeping doubles schema-equal to the real interfaces; render-capture checks run on a pinned non-headless CI runner."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-001
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Audio registers no hook, state block, mutator, command or `push_stimulus`; it is a `PRESENTATION` subscriber that reads `SIM` and `PERCEPTION_OUT` views and writes audio nodes only, and muting any bus leaves `state_hash` unchanged."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-002
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Audio persists nothing and is not hashed or replicated; its presentation memory (`(tell_epoch, tell_beat)`, `phase`, `transition_seq`, `result_seq`, `last_result.T`, shared `last_alarm_T`) is rebuilt from published state after any restore."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-003
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Every cue is the output of one pure, headless-testable function `cue_requests(published_state, presentation_memory) -> [cue_request]`; the `cue_request` record carries cue_id, family, tier, kind, anchor, transmission, gain/pitch/rate, start_T, seek, listener_scope, leak_flags."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-004
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "P5 notification handlers only record into a mailbox (idempotent, no cue creation or `play()`); one frame poll per render frame, ordered after the last sim step and before the presenter draw, classifies net change and creates all requests."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-005
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Cue dedupe uses last-seen counters set to the observed value (never seen+1): at most one beat per poll, no catch-up burst after hitch, pause or restore."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-006
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "No timer exists in Audio: no `Tween`, `Timer`, `create_tween` or wall-clock call drives a world voice; all world-voice envelopes (`volume_db`, `pitch_scale`) are pure functions of sim `T` (+ render alpha) written in the frame poll, clamped at -80 dB."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-007
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Pause sets `stream_paused` on all world voices while the kernel is PAUSED (UI and Voice voices continue, `SceneTree.paused` not used); audio never causes a tick and never pauses the sim."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-008
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "On restore, one-shot cues never replay and last-seen values are primed from restored state; sustained cues resume at steady level with `DECLICK_TICKS`, the tell bed fades in over `RESTORE_FADE_TICKS`, an active lie's leak resumes at full level on frame one, REACH lead-in resumes with `seek`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-009
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Death and save play no sound; `restore_reason` is never read by Audio."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-010
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Exactly one audio family (`hal`) is PERCEIVED; all other families are true at every sanity stage, never suppressed, delayed or synthesised by the Filter or Sanity; audio never reads `sanity.perception`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-011
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "A master identity table binds each asset (name `sfx_<token>_<context>_<name>_<variant>`) to exactly one family token and one bus; a build-time lint over `assets/data/audio/tell_audio.json` and the asset dir proves families disjoint and `hal` ids equal to the Filter's `FILTER_AUDIO_CLASSES`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-012
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "All levels, radii, intervals, loudness and class tables live in `assets/data/audio/tell_audio.json` (and sibling files), never in code; assets 48 kHz, mono for positional, OGG for loops/beds and sounds over `PCM_MAX_TICKS`, 16-bit PCM for short one-shots, all preloaded at boot."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-013
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Tell onset carries beat 0 on one reserved impulse voice, and each strictly-greater `(tell_epoch, tell_beat)` yields exactly one unpitched beat with no suppression before `breach_due_T`; audio starts no later than the visual twin by call order, not absolute latency."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-014
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "During `phase == TELL` a non-positional, pool-exempt structure-borne bed plays for every living player, never attenuated by distance, transmission, zoom, camera or room, at least `TELL_AUDIBILITY_MARGIN_DB` above the loudest concurrent non-tell bed per band."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-015
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Tell tier layering is discrete (three tiers, `TIER_XFADE_TICKS` crossfade), no audible parameter varies continuously with `tell_elapsed` or `level_pm`, and `level_pm` is used only as the argument of `ambient_cue_step`; Audio reads `phase` never `breach_phase`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-016
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Alarm clock: breach entry is pulse 0 (always emitted); later pulses one per `BEACON_SWEEP_TICKS` on ALIGNED or FALLBACK grid, at most one `attn` and one `ann` start per tick, gap >= `ALARM_MIN_GAP_TICKS` against `last_alarm_T`, branch re-evaluated only at pulse boundaries, duty capped by `ALARM_DUTY_MAX_PM`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-017
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Pre-tell creaks are a stateless predicate over the shared presentation hash (`HASH_SEED`, never `rng_derive`), scan capped at `CREAK_SCAN_MAX_TICKS`, primed to current `T` on restore/resume, positioned in the listener's own section, four discrete density steps only in CALM."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-018
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Abort plays a release cue and decays the bed over `RELEASE_TICKS`; `release_cue_relation` (`RELEASE_TICKS < ABORT_HOLD_TICKS` and `STRAND_RELEASE_TICKS == RELEASE_TICKS`) is a boot error if false; CALM and subside never map to an all-clear."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-019
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Witness (`wit`) cues exist iff a live Graph descriptor has `acoustic != NONE` and `medium != NONE`, positioned at the descriptor anchor with level/rate from `intensity_pm`/`sev`; eight classes only; the annunciator (`ann`) is reachable only from `alarm_eligible` descriptors."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-020
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Running loops (`run`) are read from `node()`/`loop_component()` and woken by `N/`, `L/`, `C/`, `B/`, `F/`, `E/` dirty keys; smooth values (`served_pm`, `intensity_pm`) are polled at render rate."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-021
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Listener is the avatar position (never the camera, lead or zoom); gain is the manual D.9 value written per voice (built-in 2D attenuation disabled); transmission attenuates but never culls a `sev >= 1` witness; an unknown door state is treated as open."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-022
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Fixed voice pool (`VOICE_POOL_SIZE` 32 placeholder) with `RESERVED_TELL_IMPULSE_VOICES` (3) never lent out, pool-exempt tell bed and INTEGRITY room tone, deterministic stealing order (tier, quietest, oldest), tell and `hal` voices protected, named DIAGNOSTIC on any tier-1 steal."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-023
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Mix priority is five tiers; ducking is applied per voice (not by bus effect/sidechain) only to tier >= 4 beds; no compressor, limiter or sidechain may attenuate a tier-1 cue; `hal` cues never duck, delay or mask a true cue."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-024
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "`hal` requests are `OWNER_PRIVATE` per seat, driven only by the Filter audio request `(viewer, ref/position, intent {ON, LEVEL(pm), OFF}, class)`, carry an audible leak with restore-exact `(T_s, floor)` breathing, and are never stolen while lies <= `LIES_MAX`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-025
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Hull anchor of `locus_section_id` is derived by Audio from Layout's `plate_positions` composed with `section_offset` and the body transform (D.16); sources on moving bodies stay attached to ship-local anchors."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-026
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Cue delivery for Horror consumes `horror.view` (`strike_T`, `reach_end_T`, ingress/egress events); the REACH resolve is a sustained-with-seek cue evaluated as a function of `T`, and the strike cue never replays on restore."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-027
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Settings: one World slider covers all in-world families; no setting lowers the tell bed below its margin, strips a `hal` leak, sonifies Attention level, or is affected by reduce-flashing/reduce-motion; the only tactile exceptions are Suit own-body cues and the opt-in off-by-default `haptic_beat_pulse` (fixed duration/strength, same edge rules as the beat)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-028
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Captions policy: `wit`, `ann`, `run`, `suit`, foley, three interaction terminals and UI are captionable; tell, breach/alarm, pre-tell creaks, Horror, `hal` and the P1 cue are never captioned."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-029
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Audio main-thread cost (poll, `cue_requests`, node updates) is at most `AUDIO_FRAME_BUDGET_US` (500 placeholder) at p95 on RM-DESKTOP and RM-DECK release export, with flat `OBJECT_COUNT` and `MEMORY_STATIC` after a 300-frame warm-up."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-030
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Audio never reads Attention internals beyond the published `attention.view`; nothing in Attention or the Graph references Audio symbols (no `AudioServer`/`AudioStreamPlayer*`/bus in Attention source)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-031
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "A Sprint-0 request-capture harness runs `cue_requests` headless on the dummy audio driver and returns the request list per poll, and a development-build-only `AudioEffectCapture` test tap bus fed from the shipped Master pre-fader supports loopback-free level measurement; neither exists in release exports."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-032
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Every cross-knob data relation (D.6 bed margin, D.8 radius and floor budget, D.10 pool sizes, D.11 reach pre-roll, D.13 creak density, D.19 audibility and peak relations, D.9 log-law radius) is checked at data load; hard relations refuse boot, soft relations log a DIAGNOSTIC, and a DIAGNOSTIC failing at shipped defaults counts as a failure."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-033
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Output latency is unobservable from the engine, so audio-versus-screen delta and footfall-to-contact-frame offset are measured by loopback on RM-DESKTOP and RM-DECK release exports, and `AUDIO_LEAD_MS` is set from the measured p95 only if negative; the rules claim call-order, never absolute latency."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-034
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Positional audio uses `AudioStreamPlayer2D` with a current `AudioListener2D` on the avatar inside the 640x360 world SubViewport, built-in attenuation disabled, `max_distance` at least 1218 px, pan matching the D.9 world-pixel model within 0.05 at every integer zoom, else a manual-pan fallback arm; 2-tick de-click is verified at 60 Hz tick and 144 Hz render."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-035
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "When one poll holds several simultaneous facts, requests are created in a fixed order (annunciator, strike, BREACH_ENTER), each on a free or reserved voice with none dropped, and every audio request frame is at or before the first visual draw frame of the same event."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-036
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Every dirty key, view field and event name that Audio consumes must match the owning system's published name exactly, and an unknown name fails boot; Audio registers no subscription to a name absent from the owner's inventory."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-037
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "The alarm clock mode (ALIGNED or FALLBACK) is chosen at `breach_enter_T` + 14 from a debounced `beacon_live_f` (Emitter BEACON on the home-ship body with `output_pm` > 0 held `BEACON_LIVE_HOLD_TICKS`, listener on that body), changes only at pulse boundaries, and is immune to read toggling."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-038
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "Footfalls are driven only by published odometer, gait, octant and facing, never by a Presenter `anim_counter`; `FOOT_CONTACT_FRAMES` is exported from the character sidecar, not coded; restore primes the counter and a catch-up poll fires at most one footfall."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-039
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "An output-device loss and return emits one `audio_output_lost` DIAGNOSTIC per loss, replays no one-shot that fell inside the loss, resumes sustained cues at steady level with de-click, and leaves `state_hash` unchanged."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-040
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "The Master bus peak stays below -3 dBFS in the worst-case scene over a 10,000-frame soak (`master_peak_warn` is 0), and the total shipped audio asset size is under `AUDIO_ASSET_BUDGET_MB` with the `wit` asset count capped at `WIT_MVP_ASSET_CAP`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-041
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "The bus tree maps each family to exactly one bus, the `Voice` bus carries only `vox` and has no DSP, no sanity, stage or Filter input and no duck from a `hal` cue, and no `Area2D` `audio_bus_override` is used for routing."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-042
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "No presenter or shader symbol reads Audio, and no visual parameter references an audio level, bus meter, cue start or voice state, so the visual twin never depends on audio and audio-driven flashes, vignettes or camera nudges cannot exist."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-audio-043
  system: audio
  gdd: design/gdd/adaptive-audio-and-tells.md
  requirement: "In co-op, each client derives its own cues from replicated published state: peer-seat P1 cues use `listener_scope` ALL_EXCEPT_SOURCE and trigger on `tell_on`, no bed request is addressed to a dead seat, and a source seat never hears its own cue; the contract is dormant at MVP."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-001
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "A save file is one generation laid out as 8-byte magic (7-byte ASCII prefix + container-layout id byte), u32 LE `header_len`, UTF-8 JSON header, concatenated block payloads, and a 32-byte SHA-256 trailer over all preceding bytes."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-002
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "`header_len` is validated (`0 < header_len <= MAX_HEADER_BYTES` and `12 + header_len + 32 <= file size`) before any allocation, and file/block size caps (`MAX_SAVE_BYTES` 64 MiB, `MAX_BLOCK_BYTES` 32 MiB) are enforced before decode."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-003
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Block payloads are encoded with `var_to_bytes(dict)` (never `var_to_bytes_with_objects`/`bytes_to_var_with_objects`) or the owner's canonical byte form, and decode is bounded by `MAX_DECODE_DEPTH` 16, `MAX_DECODE_NODES` 250 000 and `MAX_JSON_DEPTH` 8."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-004
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Persisted state serialises data models only, never scene trees or Node references."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-005
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Saves are kept as a rolling ring of `AUTOSAVE_GENERATIONS` (3) complete self-verifying files whose order is the header `generation` number, never file name, mtime or tick `T`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-006
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "A write goes to a `.tmp`, is flushed, re-read and re-hashed, then the oldest position is renamed to `.bak`, `.tmp` renamed in, verified again, `.bak` deleted and `campaign.json` rewritten; an existing generation is never overwritten in place nor deleted before its successor verified."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-007
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "The file write runs on a worker thread that receives only immutable per-block `PackedByteArray`s, paths and integers (no kernel, block, Node or scene-touching Callable), and the main thread adds only encode plus hand-off bounded by `SAVE_ENCODE_BUDGET_MS` 4 ms."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-008
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Every `store_*` return value is checked; any false return, open error, hash mismatch or rename failure leaves all previous generations untouched, sets `save_status` FAILED and retries with bounded exponential backoff (`AUTOSAVE_FAIL_BACKOFF_MAX_TICKS` 4 800), escalating after `AUTOSAVE_FAIL_ESCALATE_COUNT` 3 failures."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-009
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Capture is synchronous inside the kernel `SAVING` state at a tick boundary and no write ever begins while the kernel is `FAULTED`; a `FAULTED` capture leaves existing files untouched."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-010
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Autosave fires on a sim-time interval (`AUTOSAVE_INTERVAL_TICKS` 10 800 measured from `kernel.clock.T`) and on `EVENT_TRIGGERS` (`ASSEMBLY_WELD`, `ASSEMBLY_CUT`, `SALVAGE_CUT`, plus `QUIT` and `NEW_GAME`), with a minimum gap `AUTOSAVE_MIN_GAP_TICKS` 1 800 and an event whose owner read is absent never firing."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-011
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "A due autosave is held by the gate (re-evaluated every `AUTOSAVE_RETRY_TICKS` 300, capped at `AUTOSAVE_MAX_DEFER_TICKS` 7 200 then tagged RISKY) while any seat is `DOWNED`, within the post-DOWNED refractory, a suit is CRITICAL or worse, or an owed warning is open; the gate shows no per-write glyph or sound."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-012
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Save & Quit takes a `QUIT` snapshot while `PAUSED` (`PAUSED -> SAVING -> PAUSED`, `T` unchanged), calls `request_shutdown` only after the write verifies, is never deferred (bypasses soft gates only), and times out at `SAVE_QUIT_TIMEOUT_MS` 3 000."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-013
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "The death stub (crew death = every bound seat `DEAD`) restarts through the kernel `request_restore` from the newest non-demoted generation passing the pre-check, with fallback newest-first within `LOAD_MAX_ATTEMPTS`, a fairness step-back, and `restore_reason = DEATH_STUB`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-014
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "The load pre-check is a pure function of (bytes, registry view, build constants) with no clock or file handle, runs entirely before the kernel is touched so a bad file never produces `FAULTED`, and is unit-testable over in-memory byte arrays."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-015
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Verification has a file stage (trailer SHA-256, every `payload_sha256`, structure) before the kernel is touched and a reproduction stage (kernel K-4 `state_hash` compare) after the last `post_restore()` and before the first `RUNNING` tick; a reproduction mismatch is never a fallback reason."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-016
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Versioning has two levels: container `format_version` migrated by Save/Load, and per-block `schema_version` migrated only by the owner inside `restore(data, stored_version)` as a chain of pure functions; Save/Load never rewrites block data."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-017
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Every persisted block meets the authoring contract: registers with the kernel (never calls Save/Load directly), declares `supported_versions`, `persist_scope`, `restore_after`, returns plain data with no object refs, and uses numeric values below 2^53 (S-1)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-018
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Save/Load registers zero state blocks and zero step hooks; its ring bookkeeping lives in `campaign.json` so it cannot roll back with the world."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-019
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "The kernel snapshot is split by `persist_scope` at write time: WORLD blocks go to the generation, PROFILE blocks go to `profile.sav` (same container, `file_kind = PROFILE`, no `state_hash`), and PROFILE data survives an in-session world restore."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-020
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Per-slot `restore_epoch` is stored in `slot_epoch.bin` (u32 + CRC32), made durable before `request_restore`, and is the carrier by which threat draws re-key per restore while physical counters and seeds replay exactly."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-021
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Save/Load never reads, derives, stores or varies by perception: no `PERCEPTION_OUT` block is written (boot assertion and pre-check refuse one), and no thumbnail or \"what the player saw\" field exists."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-022
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "`new_game(world_seed)` creates `user://saves/<campaign_id>/`, a random `campaign_id` and `slot_epoch.bin` = 0, then calls kernel `request_new_game(world_seed, restore_epoch = 0)` and writes the initial `NEW_GAME` generation."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-023
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Save/Load publishes only host-local reads (`save_status` in IDLE/WRITING/WRITTEN/FAILED, `fail_escalated`, `SaveInfo`, `restore_reason`, `quit_held`, `quit_write_active`) and calls (`cancel_held_close()`); it registers no commands and no `save_now` or `load(generation)` outside dev builds."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-024
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Boot asserts the tuning-knob invariants against the data file (e.g. retry <= max_defer/4, min_gap < interval, `LOAD_MAX_ATTEMPTS` >= generations), and gameplay/timing values are data-driven."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-025
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Loading completes within `LOADING_TARGET_MS` (1 000 ms provisional) and a save stays below `SAVE_SIZE_ALARM_BYTES` 2 MiB, with the main-thread hitch bounded by `SAVE_HITCH_BUDGET_MS` / `DEAD_TICK_HITCH_MS` placeholders."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-026
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Bad generations are demoted (`.demoted`) or quarantined after `QUARANTINE_AFTER_FAILURES` 2 restore failures, rename/read failures retry (`RENAME_RETRY_COUNT` 3, `READ_RETRY_COUNT` 3), and abandoned worker jobs are capped at `MAX_LIVE_ABANDONED_JOBS` 2."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-027
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "The first `RUNNING` frame after a load is presented through the Perception pipeline (no clean frame) and the camera `CUT`s on every `LOADING -> RUNNING` transition; camera state is never saved."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-028
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "A load that hits an INCOMPATIBLE reason (newer format, unknown block, unsupported schema, tick-rate mismatch, unknown layout) stops without loading or moving any older generation, puts the campaign in READ_ONLY so no generation is written, and a second process finding the campaign lock held also opens READ_ONLY."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-029
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Crash recovery on campaign open resolves leftover `.tmp` and `.bak` files by generation tiebreak: a complete `.tmp` newer than every ring generation is rolled forward, an older one is deleted, and a file that cannot be proven obsolete is never deleted."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-030
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Each write job carries a `write_epoch` in its `.tmp` name and is abandoned on timeout (`WRITE_JOB_TIMEOUT_MS` 30 000, `DEATH_STUB_WRITE_WAIT_MS` 5 000) or when a restore advances the epoch; a late finisher is quarantined as STALE_EPOCH, and the death stub never blocks or joins on the writer."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-031
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "The newest verified generation is kept as a decoded hot RAM copy, and the likely step-back candidate is pre-staged on the worker when a seat goes DOWNED, so the DEAD-tick boundary performs zero file reads and zero main-thread decode and stays within `DEAD_TICK_HITCH_MS`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-032
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Death-stub restore advances `restore_epoch` and makes it durable before `request_restore`, whereas Continue of the newest QUIT generation leaves it unchanged; a missing or bad-CRC `slot_epoch.bin` is rebuilt from the newest verified header copy, and the value saturates at 2^32 - 1."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-033
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Every owner `restore()` returns `(ok, reason, detail)` with `reason` from its declared closed `<BLOCK>_RESTORE_*` set, never clamps out-of-range data, and leaves the live block byte-identical on failure; a non-conforming return or an owner failure during LOADING sends the kernel to FAULTED with no in-line retry and a persisted per-generation failure counter."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-034
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Every persisted block satisfies restore idempotence (`snapshot -> encode -> decode -> restore -> snapshot` yields equal canonical bytes) and supplies a fixture factory and `default_state()`; blocks that cannot yet meet it sit on an interim `REBASE_BLOCKS` list that must be empty at the first outside build."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-035
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Post-restore verification runs in EXACT mode, comparing the K-4 `state_hash`, or in REBASED mode (migration, stripped or filled block, unknown `hash_algo`, `REBASE_BLOCKS` member), which records a baseline hash in `campaign.json` keyed by generation, build and registry epoch and compares later restores against it, without rewriting the save file."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-036
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "An `ItemInstance` is persisted only in the Item DB canonical `to_array()` form (a 6-element Array: String then five ints), never as a Dictionary, and a holder block whose restore sees a non-canonical instance fails with its named reason."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-037
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Saves identify players only by PlayerId keys in a header `seats` list (non-empty, unique, in range, covering every PER_PLAYER key); no peer id and no binding or controlled-entity table is stored, and the kernel rebuilds bindings after restore so the first RUNNING tick passes authority."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-038
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Save/Load reads only its granted observation set (clock, per-seat loco and vitals state, Graph failures, optional Attention view, Assembly breach and shape-change reads, change notifications), never calls block mutators or `restore()`, uses an injected monotonic source only for I/O timeouts, and capture plus writer leave `state_hash(ALL_SIM)` unchanged."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-039
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "Save/Load intercepts the window-close request (`auto_accept_quit` false) and routes it by kernel state: RUNNING and PAUSED write a QUIT generation then quit, LOADING defers, SAVING settles then dedupes or writes, DOWNED, FAULTED and boot screens write nothing, a failed or timed-out write holds the close, and the handler never blocks a frame."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-040
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "On the frame whose boundary service enters RUNNING from LOADING, PAUSED or SAVING, the tick driver discards the accumulated frame delta so `T` does not advance, and advances by at most one tick on the next frame, so no catch-up burst follows a restore or autosave."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-041
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "The `campaign.json` manifest is a non-authoritative hint: if missing, corrupt or disagreeing with the files it is rebuilt from generation headers, demoted and quarantined generations stay excluded, and `gen_next` is computed from ring, quarantine, demoted files and manifest together."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-saveload-042
  system: saveload
  gdd: design/gdd/save-load-and-versioned-format.md
  requirement: "In dev builds Save/Load registers exactly one `save_load` diagnostics channel with the Debug Overlay during BOOTING, whose `pull()` is read-only and adds no kernel or block reads beyond the observation set, and no channel is registered in release builds."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-001
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay is exactly one kernel subscriber of class `DIAGNOSTIC`; it submits no command, calls no mutator or owner debug-write function, and owns no block, hook, read view or RNG stream."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-002
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The single `DIAGNOSTIC` handler only copies the P5 batch `(block_id, tick, change_keys)` (merged per block per catch-up frame, stamped with the frame's last tick) and marks the model dirty; it does no formatting, classification or I/O."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-003
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "All Overlay code lives under two excluded source roots (observer root `src/observer/`, dev root `src/debug/`); the public release export excludes both by resource filter, verified by a CI file-list check, and the playtest preset excludes only the dev root."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-004
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The playtest preset is the release template plus the custom feature tag `playtest`; the composition root forces `HIDDEN` mode at launch and registers only the `debug_overlay_mark` action."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-005
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "`OverlayModel` is a pure, scene-tree-free class built from (diagnostics snapshot, read views, channels), holds copies not live block references, and performs zero `FileAccess` I/O (observer lines go to an injected `ObserverSink`); it is unit-testable headless."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-006
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "All Overlay state (mode, page, cursor, viewer, pins, marks, defect ring, history windows) is dev-session only: never a block, never in a snapshot, never in `state_hash`, never saved across launches in MVP."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-007
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "With the Overlay `FULL` versus absent over the same scripted run, the `state_hash` sequence is identical, the Filter draw path is unchanged, and honest-path `perceived` calls allocate nothing."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-008
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay never writes, rewinds, replays, sonifies, uploads telemetry, appears in accessibility/rebinding/AccessKit enumerations, or exists in a public release build."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-009
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The view is a root-viewport `CanvasLayer` at pipeline layer 4 (above HUD layer 2 and chart table/menus layer 3), integer-scaled at `H_default = max(k,3)`, receiving no Filter pass, lighting, camera jolt or grade; non-interactive panels use `MOUSE_FILTER_IGNORE` and never take gameplay focus."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-010
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay root and model driver run with `PROCESS_MODE_ALWAYS` so it stays drawable and refreshing in all six kernel states (including `PAUSED` and `FAULTED`, where it shows the FAULT record)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-011
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay reads other systems only through their published read views or registered diagnostics channels (e.g. Graph `true_value(kind,id)`, Suit `true_value(key,player_id)`, `sanity_view`, `sanity.ledger`, `attention.state`, `horror.view`, Filter `perceived`), never into a block it has no view of."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-012
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay is the sole sanctioned non-owner caller of `true_value` and reader of the Sanity ledger (via `ledger_listed(player_id, lie_id)`); on a `MIRROR` the ledger is unreadable so affected refs classify `UNAVAILABLE` reason `NO_LEDGER`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-013
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "`register_channel(declaration: Dictionary) -> Dictionary {ok, reason}` is valid only while the kernel is `BOOTING`; later calls return `LATE_REGISTRATION` and the channel is `REJECTED`; registrations are bounded by `DIAG_CHANNELS_MAX` 64 and sourced from a data-driven `expected_channels` list (14 siblings; Boarding registers none)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-014
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Every channel `pull()` returns `{channel_id, rows, complete}` validated against the closed enum `DIAG_ERR` (NULL_RESULT, NOT_A_DICTIONARY, SCHEMA_MISMATCH, LIMIT_EXCEEDED, INVALID_CALLABLE, INCOMPLETE); failures yield a `DEFECT` row and suspend the channel after `DIAG_PANEL_ERR_LATCH_N` 3 consecutive failures (no exceptions in GDScript)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-015
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "`desync_classifier` is a pure first-match-wins function with fixed order (`UNAVAILABLE` first, `DEFECT_UNCAUSED` catch-all) using exact integer equality `p_int == tv` for HONEST, run at class-fold cadence `CLASS_FOLD_HZ = TICK_RATE / SANITY_DRIFT_DIVISOR = 5` over the classified set (cap `DIAG_FOLD_REFS_MAX` 48)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-016
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Grace and window timers (`DIAG_SILENT_LIE_GRACE_TICKS`, `DIAG_SKEW_GRACE_TICKS`, `DIAG_NO_LEAK_GRACE_TICKS`, `DIAG_RETURN_WINDOW_TICKS`) are denominated in kernel ticks and advance only when `T` changes, so refresh rate, throttling or `Engine.time_scale` never alter verdicts."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-017
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Numeral refresh is driven by accumulated process-delta (never a wall-clock read) at `DIAG_REFRESH_HZ` 10 (ladder {10,5,2}); markers and debug draws update per frame; the Overlay reads no wall clock (`launch_id` supplied by composition root)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-018
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "A restore/new world/transit is detected by the `LOADING`->`RUNNING` edge: all history windows clear, the classifier reports `UNAVAILABLE` reason `SETTLING` for `DIAG_POST_RESTORE_SETTLE_TICKS` 12 kernel ticks, while the defect ring, marks and log survive."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-019
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay never hashes anything itself; it displays the kernel `diagnostics` accessor's `state_hash`, `hash_T`, `hash_algo` (H64 = first 8 bytes of SHA-256) and age `T - hash_T`, with the kernel hash run outside P3 every `DIAG_HASH_CADENCE_TICKS` 60 (phased off the class fold)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-020
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Dirty-key accounting records per delivered batch the key count (or `ALL` collapse) against `MAX_DIRTY_KEYS` 256 with peak-hold, warning at `DIAG_DIRTY_WARN_PM` 500 and alerting at `DIAG_DIRTY_ALERT_PM` 750 per mille."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-021
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "`P-HOOKS` displays the kernel's resolved hook order and per-hook `t_hook` (displayed, not recomputed) plus derived `graph_hook_tick` summed over Graph hooks at stagger offsets 0, 2, 4, with rolling P99 over `DIAG_HOOK_WINDOW_RUNS` 600 against `GRAPH_HOOK_BUDGET_MS`; breaches are `WARN`, never `DEFECT`, as the figure is dev-template-indicative."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-022
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay's own cost stays at or below `OVERLAY_CPU_BUDGET_US` 1000 us/frame mean and `OVERLAY_FRAME_CEILING_US` 2000 us worst frame (budget owned by the technical director, OQ-DO-13), dev builds only, with dirty-driven view updates and a refresh-rate degradation ladder."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-023
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay owns a non-screen observer sink writing `user://debug/observer-<launch_id>.log` (kinds LAUNCH, MODE, KERNEL_STATE, ATTN_PHASE, SANITY_STAGE, VIEW, HASH, CHANNEL, MARK, DEFECT), in every mode but `OFF` (MARK always), capped by `DIAG_LOG_MAX_LINES` 20000 and `DIAG_LOG_MAX_FILES` 4, plus a latched defect ring of `DIAG_DEFECT_RING_MAX` 64."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-024
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "`dump` writes a plain-text snapshot of every page to `user://debug/` (retained count capped by `DIAG_DUMP_MAX_FILES` 20) and `mark` stamps up to `DIAG_MARK_MAX` 8 observer marks, refusing further marks rather than dropping older ones."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-025
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Four modes (`OFF`, `FULL`, `OBSERVER_STRIP`, `HIDDEN`) switch within one rendered frame without altering `T`; `FULL` and the strip must never appear on a tester's screen, and the strip shows only numbers (no ref, pair or ledger field)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-026
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Dev-only input actions (`debug_overlay_toggle`, `_page_next`, `_page_prev`, `_mode`, `_dump`, `_reveal`, `_mark`, `_cursor_next`, `_cursor_prev`) are registered by the Input Adapter only under the dev predicate and forwarded by a host-local call, never as commands or visible rebinding entries."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-027
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay is HOST-authoritative: it addresses viewers by `PlayerId` never `peer_id`, and on a `MIRROR` shows only the own-seat pair classified `UNAVAILABLE`; `HOST_MIRROR_MISMATCH` is defined but deferred (Vertical Slice B)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-028
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "A dev-only render probe (`drawn_value(ref)` as integer pre-snap millidegrees, `drawn_leak(ref)` per mille) from In-World Instruments detects Filter-bypass (`DEFECT_BYPASS`, tolerance `LEAK_EPS_MDEG` 250 inclusive, integer compare); without it, bypass is undetectable."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-029
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "World debug draws use `draw_line` width >= `OVERLAY_DEBUG_DRAW_WIDTH_PX` 1 base pixel, and severity is conveyed by text tag first, with the UI palette only (Alarm Red `#E0102A` only beside `DEFECT` marks and for `NO_MASK`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-030
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Seven MVP pages (`P-KERNEL`, `P-HOOKS`, `P-STATE`, `P-TRUTH`, `P-SANITY`, `P-ATTENTION`, `P-FRAME`) are data tables, plus generic `P-CHANNELS`; sanity seats set by `force_*` carry a `FORCED` tag."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-031
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The kernel `diagnostics` accessor must publish, allocation-free per tick in release, T, state, boot progress and hook-cycle error, per-issuer queue depth, command-log tail, reject counters, lag, the six-field FAULT record, resolved hook order with per-hook t_hook and over-budget flag, save_status, and a forced hash at restore."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-032
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Per-hook t_hook samples are delivered once per (T, restore epoch) and a sample straddling a restore epoch or delivered twice is dropped and counted rather than sampled."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-033
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Every state-block owner optionally publishes `block_hash()` and a `schema_version`; the Overlay shows owner values, shows n/a where none is published, and never hashes itself, so HASH_DRIFT names a block only from an owner-published hash."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-034
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Perception Filter must publish a read surface for the Overlay: per-(ref, viewer) Perceived record, lie_intent, lie_targets(ref), t_return_max, q_display calibration, memo-hit counter, the 15 PF-41 counters and the ref-to-subject map; unpublished items degrade to UNVERIFIED or NO_RESOLVER, never to a defect."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-035
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Sanity must publish `sanity_view`, `sanity.state` with an explicit `forced` flag, and the ledger `lies[]` schema including away rows via `ledger_listed`; the Overlay reads the forced flag directly and never infers forcing from level."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-036
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The Overlay refresh runs with a process_priority after the tick driver and reads every source once at refresh start, so all reads carry the same T; a mismatched read raises a read_straddle counter and a DEFECT that also works in release-template builds where assert() is stripped."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-037
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The composition root loads the observer and dev roots only by a guarded runtime load() after ResourceLoader.exists(); no preload, scene, resource or class_name reference to the dev root exists elsewhere, the dev root declares no class_name, and a release process contains no global-class or script entry from either root."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-038
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "CI lints enforce reader allow-lists: sanity.ledger readable only by Sanity and the observer root, raw attention level and tell_remaining only by named readers, true_value only by owners, Filter and the Overlay, and none routed to a PRESENTATION-class subscriber."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-039
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The composition root and kernel must offer testability seams: injectable dev-tag provider, subscriber id exposed at mutator and WriteScope entry, injectable frame delta and clock, stubbable Filter, Sanity and Graph/Suit true_value sources, a harness hook forcing state_hash every tick, call-spy seams, and an injected ObserverSink."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-040
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "The observer sink writes only at fixed triggers (a class fold with pending lines, a MARK, entry to PAUSED or FAULTED, WM_CLOSE_REQUEST), at most one append per frame; an unwritable user://debug/ drops to the in-memory ring with a NOTE and never stops the Overlay."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-041
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "In HIDDEN and OBSERVER_STRIP the Overlay collects only the observer set (no channel pull, hook-window or P-FRAME reads), calls the classifier exactly n_refs times per fold, never skips collection when throttled, and places a fold and a refresh due on one frame on consecutive frames."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-042
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Engine capabilities on 4.7.2 must be proven by spike before the debug-gate ADR: export resource-filter exclusion, OS.has_feature for dev and playtest tags, Viewport.get_render_info per-viewport draw counts, AccessKit per-node opt-out, and GDScript H64 hash cost over 100-300 KiB against STEP_BUDGET_MS."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-043
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "World debug draws render from a node in the world viewport unshaded and unaffected by lighting, camera jolt or sanity stage, with a layer-4 projection fallback; they exist only in FULL, and leaving FULL yields a zero frame diff against a never-toggled frame."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-044
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "All DIAG_* and OVERLAY_* knobs load from a data file with a startup assertion for ranges and cross-knob constraints (e.g. P99 min samples within window, alert at or above warn, ladder strictly decreasing), clamping and logging a NOTE on violation."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-debug-045
  system: debug
  gdd: design/gdd/debug-overlay-true-values.md
  requirement: "Rendered-pixel tests run only in a named windowed CI job with a real window and GPU; the headless job reports them SKIPPED, and each asserts a nonzero draw or pixel count so it cannot pass vacuously."
