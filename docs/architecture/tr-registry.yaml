  revised: ""
  status: active

- id: TR-emitter-020
  system: emitter
  gdd: design/gdd/emitter-state-and-light-exposure-query.md
  requirement: "Subjects register via E6/E7/E8 with a single anchor; an unregistered ref answers lux 0 / lit false in release (no existence oracle); registration over MAX_EXPOSURE_SUBJECTS (192) or MAX_MOVING_SUBJECTS (16) returns false and reads dark, with release telemetry counters."
