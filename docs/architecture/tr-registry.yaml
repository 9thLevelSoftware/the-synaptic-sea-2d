- id: TR-boarding-022
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Cut is a CHANNEL of `SALVAGE_CHANNEL_TICKS` whose effect lands at completion only; abort leaves module in place and keeps the partial ledger for `PARTIAL_TTL_TICKS`; second seat on same node is `BUSY`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-023
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Price channels (noise, hiss, load breath, pace, time, air) are never altered by hallucination; only the prize may lie (class (b) lies only at MVP; class (d) deferred)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-024
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "No readouts of value/condition/Attention exist: no value tag, rating, condition bar, inventory screen, sortie timer, `listen` verb, or Attention meter (visual or audio)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-025
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Content must satisfy Derelict Authoring lints across all five loaded sets S0-S4 and both sortie orders: carried round trip within `VACUUM_BUDGET_S` 27 s, hazard crossing at most 7 tiles lethal cold, `ESCAPE_ROUTE_BUDGET_PX` 1800 (600 carrying), 18/22 module nodes A/B, loose ledger of 9 placements."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-026
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Carried modules render as one shared plain shape on the tool layer (max 24x14 px, held overhead, figure plus module at most 71 px); stub/cap/kerf art is hue-less and matte (no flesh/violet palette)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-027
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "All Boarding values are integer tick/AU arithmetic over owners' registered constants (TICK_RATE, V_CARRY, TILE_PX etc.); no wall-clock performance criterion of its own; frame-time pending spike on RM-DESKTOP (P99 16.6 ms) / RM-DECK (P99 33.3 ms)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-028
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "No combat, progression, economy, construction freedom, forced-script drop/cap, or win-state is implemented (hard never-do list G-1..G-11)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-029
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Berth is LOUD (one `U_LOUD` push at apply) and unberth QUIET; berth/unberth sit on DOCK_CONSOLE and are BUSY while carrying."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-030
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "The simulation must be drivable headlessly by a scripted harness with a Web Map stub implementing pod_hop as a body transfer, and golden schedules (REF_ZERO_DWELL, REF_GOLDEN) must be generated by running the owners' real code and read back from owner constants, never typed or reimplemented in tests."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-031
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Every hook, command, mutator, read-view and notification identifier must be published by its owner in a machine-readable list so a script can generate the allow-list the Boarding lints resolve against."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-032
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "The partial-cut progress ledger expires on global ticks, not on the dormant derelict body's ticks, so a pod hop away always forfeits a partial once PARTIAL_TTL_TICKS elapses; a hop aborts any open channel with ABORT(BODY)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-033
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Suit vitals, lamp-cell drain and other statuses must keep running at the pod leg's per-run cadence while the seat is IN_POD, and a seat reaching DOWNED during the hop applies the Controller's DOWNED rule (carry_ref cleared, solo restore from the newest autosave)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-034
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Autosave deferral is capped: a save deferred 7200 ticks is written flagged RISKY, and a death restore within DEATH_LOOP_WINDOW_TICKS of a RISKY generation, or with too little warning since the generation, steps back one generation; an absent Attention view defers the save and logs GATE_INPUT_ABSENT."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-035
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "A loose item stores a section id and a section-local position, so a dropped module moves with its section when that section is welded to, or cut away from, another body."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-036
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Interactable registration is by adjacency or proximity so the registered subject count never exceeds INTERACT_FIXTURE_BUDGET (120) on the worst loaded set S4 (144 authored subjects), and Boarding's contribution to the loose-item pool is capped at PLAYER_DROP_RESERVE (24)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-037
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "lit(ref) is false for a thrown glowstick on every tick up to and including its landing tick and reads true from the first exposure table committed after landing, with spawn_deployable called exactly once on the landing tick."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-038
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Spawning a deployable beyond MAX_DEPLOYABLES_LIVE (8) is never rejected: the lowest-id deployable of the same kind enters a visible evict-wane and is removed, and an emitter_deployable_evictions diagnostics counter increments by exactly one."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-039
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "A cut completing on a running machine is EXOGENOUS: the Graph re-solves the island on its next run, dependants go STARVE with no tell and no minimum-warning wait, and the cut's SEVERED descriptors open no Attention breach-window row."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-040
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Same-tick ordering of cut completion, channel cancel or stagger, the Attention integrator run, and abort versus breach must be deterministic: the yield and an open tell can both exist after the run that crosses the threshold, and a cancel on a stagger tick writes the ledger once and plays no abort cue."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-041
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "Cutting a store module routes its stock to discarded_* so the conservation invariant closes, and an uncapped stub leaks from the home network pool only while the seam valve is open, otherwise from the section's own stock only."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-042
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "The return pod_hop to home is never fuel-gated (accepted at any pool including 0); only the outbound hop is gated by HOP_FUEL_FLOOR_ML and debits HOP_FUEL_ML, and a hop out and back during a TELL does not reset the Attention level."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-043
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "While the BURDEN push is active Attention's decay is suspended (level does not fall with the instance held), burden is zero for home-ship modules, own kit, IN_POD, DOWNED and DEAD, and no grams term enters the push."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-boarding-044
  system: boarding
  gdd: design/gdd/boarding-and-salvage.md
  requirement: "The sanity ABOARD_EXPOSURE dwell is charged by locus from pod_settle to departure and not during the pod leg, preserving the ordering 300 s sortie, 315.8 s stage-1 point, 480 s, 1200 s across the Sanity, Web Map and Suit constants."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-001
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The system owns exactly six facts (roster records, `pod_at`, transit state + `leg_epoch`, berth state, leg/berth content data, ring reads) and is the only writer of them; it never writes fuel, dormancy mechanics, pose arithmetic, geometry, air, light or stimuli directly, only via owners' published mutators inside one atomic apply."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-002
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "One persisted SIM block `web.state` exists (persist true, scope WORLD, SHARED, repl_hint SHARED_SUMMARY, schema_version 1) with `restore_after: [layout.state, graph.state, body.state]` only (not `controller.state`); it registers one `state_hash` row with records in `mvp_world.json` order, fixed field order and no dictionary iteration."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-003
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "One step hook `transit.step` (divisor 1, offset 0, after `body.integrate` and `graph.propagate.failure`) runs every tick, writes no state and calls no Class A mutator; its only outputs are idempotent SYSTEM command submissions and its inputs are reads."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-004
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The block persists per record {derelict_id, template_id, kind, ring (1-based), world_slot (0..7, distinct), seed (0 at MVP), status UNSEEN/SEEN/BOARDED/ABSORBED/ORPHAN, unknown_seen (monotone), first_boarded_T, section_id, body_id} plus machine fields (transit_state, leg_epoch, t0, arrive_T, t_phase, target_id, origin_id, leg_dir, leg_reversed, active leg params {n,vx,vy,p0x,p0y}, berth_target_id, berth_epoch, berth_phase, berth path, pod_body_id, pod_section_id, pod_at); about 756 B canonical, record ceiling 8."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-005
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "`loaded(d)` and `berthed` are derived, never persisted: loaded = not `section(section_id).dormant` from the Graph, berthed = `berth_target_id != NONE` with machine IDLE, leg progress = `T - t0`; no second writer of dormancy exists."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-006
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The roster is read from content `assets/data/world/mvp_world.json` and legs from `assets/data/world/legs.json` (linted on load); star topology only (HOME to one derelict and back; no derelict-to-derelict edge, no steering, no route building)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-007
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The pod is one persistent Layout body built once at `init_world` from the `pod` template with an always-dormant section; no other body is ever added at MVP (lint `BODY_COUNT_MVP`), at most two bodies are live in any reachable state against `BODIES_LIVE_MAX` 4, and `room_at` on the pod answers `pod_cabin`, never NONE."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-008
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Body pose is set only via BM7 `set_body_pose` (rejects `abs(coord)` above `WORLD_COORD_LIMIT` 2^22) inside atomic applies (`init_world`, departure, `pod_arrive`, `pod_settle`, `berth`/`unberth`, each `berth_step`); re-origins are pure translations of all live bodies (lint `REORIGIN_IS_TRANSLATION`) and dormant bodies' poses are never read by the simulation."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-009
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "`init_world(world_seed)` runs in LOADING under one WriteScope in fixed order (LM1 `build_section` x4, Emitter E1, Interaction `place_loose`/`sync_section`, BM1 `place_actor`, BM7 poses, M19 dormancy for A/B/pod, E10 home dock glow, then records); any rejected call fails the build with `SL_NEW_GAME_NO_BASELINE`; nothing is built, discarded or re-instantiated after `init_world`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-010
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Commands registered: `pod_hop{target_id}`, `berth{derelict_id}`, `unberth` (PLAYER, OWNED_BY_ISSUER, actor_source `body.state`, coalesce NONE, max_age 120) and SYSTEM-only `pod_arrive{leg_epoch}`, `pod_settle{leg_epoch}`, `berth_step{berth_epoch,phase}`, `web_reconcile{record_ids}` (actor_binding NONE); a PLAYER attempt at a SYSTEM command is `ORIGIN_NOT_ALLOWED`; stale epoch/state is rejected (`STALE_EPOCH`/`NOT_IN_LEG`/`NOT_ARRIVING`), counted at DEBUG and never FAULTED."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-011
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "`pod_hop`, `berth` and `unberth` validate in the fixed reason orders given in WM-9 (first failing reason wins, none changes state); all reasons are closed sets and truth-only surfaces; `unberth` has no fuel path or floor."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-012
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The departure apply is one atomic Graph-then-Layout-then-Body apply (M16 fuel debit from HOME only, M19 dormancy of the origin derelict, BM5 transfer avatar to pod, BM7 poses, BM6 velocity, record update, E10 glow off, `POD_DEPARTED`); everything fallible is in validate (no rollback), HOME is never made dormant."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-013
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The leg is a deterministic script: pod velocity is whole pixels, `p1 = p0 + v*n` exactly, speed at most `VEL_MAX_PX_PER_TICK`, the same duration every time (`HOP_LEG_TICKS` 900 placeholder), with no input, hazard, random event or random delay."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-014
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Arrival is two SYSTEM commands: `pod_arrive` (applies at `t0+n`, pose to p1, velocity 0, state ARRIVING, status UNSEEN to SEEN, `unknown_seen` set iff lamp predicate lit) then `pod_settle` a fixed `ARRIVE_SETTLE_TICKS` (45 placeholder) later (re-check cell, clear target dormancy via M19, BM5 avatar to arrive cell, park pod, IDLE, `pod_at`, E10 glow on, BOARDED + `first_boarded_T`); `ARRIVING` has a fixed simulation length independent of frame rate."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-015
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Phase-boundary commands are pose-carrying and idempotent: the pose is derived from persisted parameters (payload carries epochs/phase only), and persisted boundary values (`arrive_T`, `t_phase`, `first_boarded_T`) are nominal ticks, never the apply tick, so a restore-dropped or queue-delayed command rejoins the uninterrupted trajectory; `LEG_POSE_MISMATCH` is raised iff the offset differs from `v*(T_apply-(t0+n))`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-016
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "`web.view.destination_ready` is a pure function of persisted state (`transit_state == IDLE`); the simulation never calls the Pipeline, never waits on the PROJECTOR (no submit path), and the Pipeline holds `TRANSIT_HOLD` until destination_ready and its own projector latch."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-017
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The arrival cell is the authored `arrive_*` cell, never searched; it is validated by Body `can_transfer` at departure (`ARRIVAL_BLOCKED`) and re-validated in `pod_settle`, where a failure takes a total recovery branch (one zero-fuel reversal with `leg_reversed`, then `ARRIVAL_FORCED` placement) and no `pod_settle` may reject."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-018
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Controller `IN_POD` is derived from body occupancy (avatar `body_of_actor` equals pod body), not from a hook call; `transit.step` only reconciles by read."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-019
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Fuel is the Graph's: hops pay `HOP_FUEL_ML` (400) from HOME-kind FUEL_TANK only (found by section `kind`, never by name `ft_main`) via M16 `withdraw_store` in mL, `berth` pays `BERTH_FUEL_ML` (800), both rejected `FUEL_LOW` when `pool - cost < HOP_FUEL_FLOOR_ML` (1500); the system keeps no fuel store, meter or counter, and a short grant still proceeds (never strand)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-020
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "`berth` is a PLAYER command only at HOME with pod at HOME and machine IDLE; it loads the derelict, then drives the home body through an authored piecewise-constant-velocity path (at most 3 phases, exact-sum lint, last phase slow crawl) via `berth_step` commands until `docked(home,B,frame_shift_px)` holds with `frame_shift_px` (696,384) and both velocities 0."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-021
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Loaded set is HOME (plus welded pieces) plus at most one unwelded derelict, reachable sets exactly S0 to S4; a departed derelict goes dormant in the departure apply, an arrived one goes live in `pod_settle`; every dormancy flip is gated in validate (skip if already equal, HOME-kind guard `WEB_DORMANCY_HOME`, avatar-present guard `WEB_DORMANCY_AVATAR` excluding the issuing traveller, then M19 checks)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-022
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Save/restore per state: the active leg params and active berth path are persisted; `post_restore` validates `p1 == p0 + v*n`, berth exact-sum, origin/target consistency, `leg_reversed`, epochs and loaded set, rejecting with named `WEB_RESTORE_*` reasons and never clamping or repairing; `post_restore` submits nothing and the first `transit.step` reconciles."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-023
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Events emitted in the P5 Notify batch: `POD_DEPARTED`, `POD_ARRIVED` (Save/Load autosave trigger), `DERELICT_LOADED`/`DERELICT_UNLOADED`, `BERTHED`/`UNBERTHED` (BERTHED is a Save/Load trigger), `FIRST_BOARDED`; the system owns no sound."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-024
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Dirty keys are explicit (`WEB/<derelict_id>`, `WEB/T`, `WEB/POD`), no write may rely on a packed-array setter to mark a key, and zero keys are marked per tick during a leg or berth (worst case 5 of 256 per apply)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-025
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Each departure, arrival and berth-boundary apply completes within `STEP_BUDGET_MS` 4 including called mutators, and `transit.step` costs at most 0.1 ms per tick (placeholder) on RM-DESKTOP and RM-DECK."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-026
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Restore-equivalence determinism: a run restored at every command boundary has an identical `state_hash` sequence to a second restored run, and equals the uninterrupted run exactly for web.state/body.state/layout.state at the first IDLE tick (other blocks 12 ticks later, three named bounded accruals excepted)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-027
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The system makes zero `push_stimulus` calls (lint `NO_PUSH_STIMULUS`); the single LOUD noise report per applied `berth` is Interaction's from the `berth` declaration; hops are always allowed during a TELL/BREACH."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-028
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Each dock room's DOCK_STATUS glow is switched via Emitter E10 `set_dock_status` inside the apply that writes `pod_at` (ON home at `init_world`, OFF at departure, ON at `pod_settle` including the reversed leg, no call at berth/unberth) so `switch_on(glow(d)) == (pod_at == record(d))` after every apply."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-029
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Truth-channel rule: `web.state`, `web.view`, `pod_at`, the leg exterior, `visible_unknown` and the residual-lamp point are never wrapped by the Perception Filter or Sanity; no meter, gauge, ETA, progress ring or percentage exists for the hop, berth or map; the lamp is lit iff lamp node state in {OK, DEGRADED} and battery stock > 0."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-030
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Death in the pod is the Controller's DEAD and rolls back with the last autosave (world block is WORLD scope); the roster is never destroyed (no destroy path at MVP); every mid-transit state is restorable."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-031
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Web Map & Transit scripts are integer-only and scene-tree-free: no float, random or wall-clock call, no Node or SceneTree reference, every division and modulo takes non-negative operands, the 8-byte seed is never stored as a GDScript int, and no rng_derive stream is registered."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-032
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The published `web.view` read model has a closed field list (nodes[], pod_at, transit_state, destination_ready, leg_target_id, leg_origin_id, leg_dir) with no time, position, progress, fuel, Attention or sanity datum; leg timing is a separate `web.leg_timing()` read, and the ring reads (`ring_of`, `body_is_home`, `locus_kind`) resolve without a hook."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-033
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "`transit.step` skips the per-record `body_id` reconcile compare in IDLE unless Assembly's `last_shape_change_T()` has changed, and submits no `web_reconcile` when no weld or cut occurred."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-034
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Timing constants derive from the kernel's published `queue_drain_ticks` (SLIP_MAX_TICKS = 2 x it - 1; IN_POD_SLACK_TICKS = 2 x SLIP_MAX_TICKS; ARRIVE_SETTLE_TICKS - 1 > SLIP_MAX_TICKS), recomputed by a blocking CI lint that fails the build when the kernel value changes without a GDD update."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-035
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Content and constant inequalities are enforced by blocking load-time lints on a tuple grid with a per-tuple oracle: slot pitch and coordinate budget against WORLD_COORD_LIMIT / 32, lamp view-ticks against field size and ladder step, settle ticks against tile build rate and MIN_FRAME_RATE, and leg and berth velocity and duration bounds."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-036
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The loaded set stays within fixed tile and subject ceilings (182/300/331/331/449 tiles for S0 to S4, 453 maximum with the pod, against TILES_WORLD_MVP 600 and INTERACT_FIXTURE_BUDGET 120 per neighbourhood), asserted against a real Layout build at S4."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-037
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The PROJECTOR builds the largest destination scene (331 tiles) within ceil(331/256) frames, inside the ARRIVE_SETTLE window; a late projector never delays the simulation, the destination stays frozen until settle, and `ARRIVE_SCENE_LATE` is logged."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-038
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The exterior layer renders pixel-identically at the largest canvas offset (WEB_COORD_BUDGET_PX plus field half-extent) as at the origin at every ladder step on RM-DESKTOP and RM-DECK, and Parallax2D behaviour under the integer-scale SubViewport is recorded; failure is cosmetic and never a simulation fault."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-039
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "During a leg the pod-local camera keeps a constant camera-to-pod offset in every frame at every ladder step and raises no camera-cut event; the exterior composition (filaments, target lamp, astern derelict) is a pure function of persisted data and is identical after a restore at any leg tick, with the kernel LOADING hold preceding the cut."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-040
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "The exterior layer contains no Light2D node: the departed body's emitters are not live during the leg, and the residual lamp is a presentation point, not a light, with colour and alpha independent of Attention level."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-041
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "A dormant section is frozen with no fast-forward on reload (Graph partition hash, node hp, taken salvage and horror entity records unchanged); lamp battery drain and endogenous derelict fault compression accrue on loaded ticks only, and a Suit top-up shortens the lamp clock."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-042
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Interaction subjects (pod console at every dock room, DOCK console at the home airlock) register or unregister in the same apply as the dormancy flip, eligible only when pod_at is that dock, the machine is IDLE and the subject is in reach and lit; no pick or selection value enters web.state, its hash or a save."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-043
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "While the seat is IN_POD no other system's clock is held or deferred: Suit breath reserve, thermal and cell drain, Sanity accrual and Attention TELL/BREACH clocks continue, the Graph reads no Web Map state and home faults may transition mid-leg, and Controller DOWNED/DEAD rules apply with no pod exemption."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-044
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Audio consumes only `web.view.transit_state` state edges (the berth bed keys on BERTHING with no t0 or n), and the audio listener context switches to the target body in the same apply as `pod_settle`, with the Tell bed uncut by the hop."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-045
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "Multi-seat configurations are rejected at MVP: a build with more than one seat fails lint `COOP_HOP_UNDEFINED`, and a missing pod-console anchor fails the content build `POD_CONSOLE_MISSING`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-webmap-046
  system: webmap
  gdd: design/gdd/web-map-and-transit.md
  requirement: "No command or input action shortens a LEG, ARRIVING or BERTHING (only pause and menu), and HOP_LEG_TICKS is the sole pacing lever, enforced by a lint over the command vocabulary and input map."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-001
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Attention is one scene-tree-free, integer-only (64-bit) SIM block `attention.state` (class SIM, persist, scope WORLD/SHARED, schema_version 1, `restore_after [graph.state, emitter.state]`) advanced only by hook `attention.step` (divisor 6, offset 0, `after [graph.propagate.power, emitter.place]`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-002
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "There is exactly one global attention level `L` in mAU (1 AU = one walking tick of noise), clamped to `[B, L_CEIL]` with `L_CEIL = ATT_THRESHOLD x L_CEIL_PM / 1000`; no per-section or per-player level exists."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-003
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Each run computes `L' = clamp(L + I_run - dec, B, L_CEIL)` with ceiling-step decay `dec = ceil(6(L-B)/TAU_ATT_TICKS)` so L reaches B exactly, and `dec = 0` on any run that drained a BURDEN push."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-004
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Noise enters only via Class B mutator `push_stimulus(kind, source_ref, class)` (class in QUIET/WALK/RUN/CARRY/TOOL/LOUD/BURDEN; kind NOISE only; unknown class is a counted no-op, clamp never reject), callable only inside a WriteScope by the Controller and Interaction (never Horror)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-005
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "A push adds `U[class] x 1000` mAU to `pending_noise_mAU` and, when the source resolves at push time to a loaded section (Ship Body `actor_section` / `section_of`), to `pending_ledger_mAU[section]`; the `source` PlayerId tag is transient and never stored."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-006
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "BURDEN is pushed by the Controller every tick a salvage carry is held, only while the holder's `actor_section` is in a non-home locus body and `loco_state != IN_POD`, keyed on carry state and never on `mass_g`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-007
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Light and power are ordered reads, not pushes: `emitters()` per loaded section (weights `W_L` per kind; BEACON always 0; FAULT_GLOW 0 in BREACH/SUBSIDING) and `power_use(section_id)` using non-lamp draw `nl_w = max(0, draw_w - lamps_lit_w)` plus Attention's own persisted five-run `nl_hist_w`; no `probe()` calls, no `lux_pm` reads, no double count of lamps."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-008
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Attention reads nothing from Lighting, Audio, Sanity, Horror, Perception Filter, HUD, Instruments, Failure & Trail, Camera or Save/Load, and no Graph/Controller/Suit/Interaction-data/camera/FT/ItemDB code may read an Attention symbol (lint both directions)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-009
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Baseline `B = B_table[ring_B]` where `ring_B` is the max ring over sections holding a living player (`loco_state != DEAD`; DOWNED counts living), with `held_ring` held while IN_POD; `B_table` is non-decreasing."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-010
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "A boot/data lint enforces the survivable-dark floor and abortability invariants (`abortability_invariant`, `abortability_play`, `survivable_dark_floor`, IR-1..IR-4, `event_defer_invariant`, theta upper bound) at every ring row, failing the data when violated."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-011
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Phase machine CALM -> TELL -> BREACH -> SUBSIDING -> CALM changes only inside `attention.step`; CALM->BREACH, TELL->SUBSIDING and BREACH->TELL do not exist; TELL entry requires `L >= theta`, `T >= refract_until_T`, `T >= rearm_until_T`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-012
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Tell length is drawn once at TELL entry as `rng_int(TELL_DRAW_LO, TELL_DRAW_HI)` from `rng_derive(world_seed, \"attention.tell\", rng_counter + RESTORE_KEY_STRIDE x restore_epoch)`; `tell_len >= TELL_MIN_TICKS` (= ticks_for_seconds(W_MIN_WARNING_S)) on every path and a persisted tell_len is never rerolled on restore."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-013
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "The tell draw is the only `rng_derive` use; beat jitter and all presentation randomness are a pure integer hash of `(tell_epoch, k, HASH_SEED)`; sim uses only tick `T`, never wall time; diagnostics are excluded from `state_hash`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-014
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Escalation keys on the behaviour-keyed escalation clock `esc_ticks` (advances 6 per run only while `L' >= theta_HOLD`, frozen otherwise, never keyed to `tell_len` or progress); every legal trajectory publishes >= `MIN_BEATS_IN_FLOOR` (4) beats in the first `TELL_MIN_TICKS`; one `tell_beat` counter drives both audio and visual."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-015
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "A tell aborts to CALM when `below_hold_runs x 6 >= ABORT_HOLD_TICKS`, or at the due run with `L < theta_HOLD`, or on the departure void (`locus_vacated`); abort deposits no STRESS, sets `tell_outcome = ABORTED` and `rearm_until_T`, with an item-keyed rearm cancel via `tell_carry_items`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-016
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "No path reaches BREACH before `tell_start_T + tell_len`; there is no instant-breach path; `attention_arm_tell {tell_len}` (SYSTEM origin only, CALM only, clamped to `[TELL_MIN_TICKS, TELL_MAX_TICKS]`) is the only arming seam."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-017
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "At BREACH entry Attention issues M17 `deposit_trace(STRESS, s, BREACH_PROPAGATION_MULT)` for every section of `locus_body` in ascending section_id, at most `STRESS_DEPOSITS_PER_RUN` (8) per run, re-armed in bursts (`STRESS_REFRESH_BURST_RUNS` every `STRESS_REFRESH_RUNS`, bounded by `STRESS_HOLD_STEPS`), and takes no first claim on `MAX_FOOTPRINTS_PER_STEP`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-018
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Locus is the section with highest `ledger_mAU` at TELL entry (ties to lowest section_id), fixed for the epoch with `locus_body = sections_of(body_of(locus))` recorded; the ledger decays with TAU_ATT_TICKS; dormant sections hold no ledger entry."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-019
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "BREACH ends at the first of BREACH_MAX_TICKS, `L < theta_HOLD` for `CLEAR_HOLD_TICKS` after `BREACH_MIN_TICKS`, last recorded occupant leaving a non-home locus, or X10 empty-locus case; SUBSIDING lasts `SUBSIDE_TICKS` then sets `refract_until_T`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-020
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Predicate `exogenous_permitted(section) = phase in {BREACH, SUBSIDING} AND section in locus_body` governs every web-originated exogenous harm (M17 RUPTURE/GOUGE/STRESS, M18 EXOGENOUS, horror lethal acts on crew); a `TellAudit` DIAGNOSTIC ledger and replay (`tell_window_contract`) must exist as a test fixture."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-021
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "`attention.view` is a SIM read view of integers (never PERCEPTION_OUT) with the fixed field set (`phase`, `breach_phase`, `tell_active`, `tell_remaining`, `tell_elapsed`, `tell_beat`, `tell_beat_T`, `tier`, `tell_outcome`, `tell_epoch`, `phase_enter_T`, `breach_enter_T`, `level_pm`, `locus_section_id`, `exogenous_permitted`); `tell_progress_pm` is never published; `tell_remaining` never reaches a PRESENTATION subscriber."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-022
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "The Perception Filter and Sanity can never remove, add, delay or alter any Attention publication or presentation (no phantom tell, no false calm); Attention reads no sanity or PERCEPTION_OUT value."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-023
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Persisted fields (level_mAU, phase, tell_epoch, tell_start_T, tell_len, breach_due_T, tell_beat, esc_ticks, timers, locus ids/body, occupant sets, occ_gone, tell_outcome, rng_counter, pending noise/burden/ledger, ledger, nl_hist_w, held_ring, stress cursor, beacon state) round-trip idempotently; section-keyed arrays stored sorted and bounded to loaded sections."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-024
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Restore is two-phase, returns `(ok, reason, detail)` with closed reasons `ATTENTION_RESTORE_{SCHEMA,RANGE,PHASE_INCOHERENT,SECTION_UNKNOWN,RNG_COUNTER}`, never clamps out-of-range values, and enforces `rng_counter <= tell_epoch`; `restore_epoch` is read from `kernel.clock` and never stored in the block."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-025
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "`post_restore` rebuilds caches only (no phase change, no command submitted); the beacon is reconciled in the first post-restore `attention.step` run by comparing persisted `beacon_commanded` with emitter state; presentation cues fire on transitions only, so loading a save triggers no onset/breach cue."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-026
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Mutators track dirty keys explicitly (`ATT/L`, `ATT/P`) because a packed-array element write does not call the property setter in Godot 4.7; presentation polls `attention.view` every frame rather than treating dirty notifications as events."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-027
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Save/Load event-defer invariant holds: `TELL_MAX_TICKS + BREACH_MAX_TICKS + SUBSIDE_TICKS + AUTOSAVE_RETRY_TICKS < AUTOSAVE_MAX_DEFER_TICKS`, with `REFRACT_TICKS` and `TELL_REARM_TICKS` each >= `AUTOSAVE_RETRY_TICKS`; `breach_phase` reports TELL as CALM so FAIR gate mode stays live."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-028
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "The beacon is switched via `set_beacon {emitter_id, on}` as a SYSTEM command at T+1 (max_age_ticks 120) on at every BREACH entry and off at SUBSIDING entry, with rejected commands retried once per run for `BEACON_RETRY_RUNS`; BEACON `gates_actions` is false; exactly one BEACON exists in world data (`BEACON_COUNT`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-029
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "A pod hop does not interrupt a TELL but voids the due-run breach (TELL -> CALM, ABORTED) when the locus body is non-home, `tell_occupants_at_entry` is non-empty and no living seat remains in it; the dormancy fallback is suppressed once `locus_vacated` holds; a home-ship locus is never voidable."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-030
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Pre-tell cues use a quantised ladder (`CUE_STEPS` 4 above `AMBIENT_CUE_FLOOR_PM`, hysteresis `CUE_HYST_PM`) that runs in CALM only, forced to 0 otherwise; no continuous mapping of `level_pm` to any visible or audible parameter may exist (calibration lint F-24)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-031
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "The Attention Presenter (PRESENTATION subscriber) draws rim filaments only inside the lit region of eligible player-controllable emitters (BEAM, FIXTURE, NODE_LANTERN, DEPLOYABLE; excluding BEACON, EMERGENCY cryo lamp, FAULT_GLOW, DOCK_STATUS) in the Y-sort layer plus a dust-direction change, and never alters camera, beam, ambient light or controls in any phase."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-032
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Audio is the guaranteed tell channel: beat 0 is published in the TELL-entry run, audio never starts later than visual, and the non-positional bed reaches every living player; audio dedupes on `(tell_epoch, tell_beat)` and keys on `phase`, never `breach_phase`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-033
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Reduced-motion turns filament motion into a density change; reduced-flashing (default ON) makes the beacon a static mark; no captions or caption field exist for tell beats; an opt-in (default off) haptic pulse fires exactly once per `(tell_epoch, tell_beat)` change on the same notification as the audio request."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-034
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "`attention.step` has a p99 CPU budget (proposal 0.05 ms, unratified, OQ-AT-18 / AC-AT-54b, measured on RM-DESKTOP and RM-DECK release exports) and `attention.state` snapshot size is bounded by at most one ledger/history entry per loaded section."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-035
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Co-op seams: one machine, one host, `repl_hint SHARED_SUMMARY`; the transient `source` PlayerId keeps VS per-player attribution a data change plus one persisted array and schema bump."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-036
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Every F-1, F-3, F-4 and F-5 intermediate stays below 2^62 under worst-case inputs (96 emitters, weights at cap, 64 LOUD pushes in one run, 10,000 W), with `pending_noise_mAU` and each `pending_ledger_mAU[s]` clamped to L_CEIL before the drain, verified against an arbitrary-precision test oracle."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-037
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Attention is testable headless without a scene tree: emitters(), power_use and the beat-jitter provider are injected dependencies (production uses the integer hash), so calibration traces and the floor proofs can run against stubs."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-038
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Attention's only outgoing calls are `deposit_trace(STRESS, ...)` and `set_beacon`; it never calls RUPTURE, GOUGE, apply_damage, or any lamp, Lighting or Graph-state write, enforced by source-lint with a negative fixture."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-039
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Attention tuning lives in seven data files under `assets/data/attention/` (intake, integrator, weights, baseline, tell, breach, presentation), and noise-per-tick values are read from the registry, so no gameplay literal appears in Attention code."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-040
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Horror's hook is ordered after `attention.step` and `emitter.place`, and Horror's per-run footprint budget is at most `MAX_FOOTPRINTS_PER_STEP - STRESS_DEPOSITS_PER_RUN`, so Attention's STRESS deposits cannot be starved; a dropped deposit is re-armed by the next burst."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-041
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Stimulus classes come from Interaction's verb data: cut completion, seam-cut DONE, vent apply and throw landing each push exactly one LOUD, sustained tool use pushes TOOL per tick, breaker and door verbs push nothing, and weld completion or Assembly pushes no LOUD."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-042
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "The Suit contract exposes only `tool_charge(player_id, tool_suppressant)`, `consume_charge(player_id, def_id) -> ok` and `OUT_OF_CHARGES`; no suppressant effect verb ships at MVP and `tool_suppressant` is in no MVP start kit."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-043
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Authoring lint `DERELICT_LOCUS_BODY_NO_FAULT` requires every body that can be a locus (each derelict alone and each welded to home) to contain at least one authored active Graph fault, so breach STRESS always has a subject; home and pod bodies are the only exemptions."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-044
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "A source-lint token scan forbids `level_pm`, `level_mAU`, `tell_remaining` and `attention_level` in UI and presentation roots and assets outside an allow-list (Debug Overlay, diagnostics, tests), and the overlay is excluded from release exports by file."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-045
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Presenter visual lead-in compensates measured audio output latency (`VISUAL_LEAD_IN_TICKS >= ceil(L_out_ms x 60 / 1000)`) so no visual change for a beat appears before its audible onset; the value stays 0 and the AC deferred until the latency spike exists."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-046
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "The Attention Presenter has a p99 frame cost of at most 0.25 ms (no frame over 1 ms) on RM-DESKTOP and RM-DECK release exports with 16 resolved strands in four lit regions, with strand caps of 9 per lit region and 16 on screen."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-attention-047
  system: attention
  gdd: design/gdd/attention-system.md
  requirement: "Presentation of a restored or hitched state shows the end state with no transition animation, and a multi-beat stall plays at most one beat without replay; `(tell_epoch, tell_beat)` is strictly increasing lexicographically across epochs."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-001
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Horror state lives in one scene-tree-free, integer-only SIM block `horror.state` (persist true, scope WORLD, SHARED, schema_version 1, restore_after [layout.state, graph.state, emitter.state, attention.state]) with at most `HORROR_MAX_MVP` 1 resident record of type `horror_t01`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-002
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "`horror.step` is registered as one kernel hook (divisor 5, offset 0, after [attention.step, emitter.place]); an unknown hook id fails boot."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-003
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Every Horror duration is an integer count of runs published as runs x 5 ticks; a SIM-clock duration that is not a multiple of 5 fails a data-load lint (L3_DUR_LO/HI exempt); the rig pose is stepped per run and presentation interpolates pos_prev to pos_curr over 5 ticks."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-004
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Behaviour (LURK/STALK/REACH/STRIKE/RETREAT/TRANSIT) and all harm gates are functions of `attention.view` fields only (phase, tell_epoch, tell_outcome, locus_section_id, exogenous_permitted, breach_enter_T, phase_enter_T); no stored threat/aggro/awareness value exists, persisted or derived."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-005
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Every web-originated harm call (apply_suit_damage, M17 RUPTURE, M17 GOUGE) is made only if `exogenous_permitted(section)` holds at the call tick, checked at REACH begin, STRIKE entry and each M17 call; bodily scope uses Body `actor_section`, and the `tell_window_contract` TellAudit replay has zero violations."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-006
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Per-type tuning (speeds, ranges, strike_bp, cooldowns, unfold bounds, L3 constants, asset ids) is loaded from a data row keyed by type_id; the data lint rejects fields named damage, accuracy, armour, dps, xp, unlock, health, hp, kill, loot, threat, aggro, hate."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-007
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Horror writes the world only via Class B path-(a) mutators `deposit_trace` (CHILL, hull-only GOUGE, hull-only RUPTURE; never STRESS/BURN) and `apply_suit_damage(player_id, STRIKE_BP, source_ref)`, plus its own published state; it submits no SYSTEM-origin command and never calls push_stimulus, set_beacon or any Attention writer."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-008
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Horror issues at most `HE_FOOTPRINT_BUDGET` 8 deposit_trace calls per Graph window (w = floor(T/6)) and `MAX_DEPOSITS_PER_RUN` 4 per run, priority RUPTURE > GOUGE > CHILL; excess writes are not attempted and counted `horror_footprints_withheld`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-009
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "A horror is a registered Emitter HORROR subject (E6 at arrival, E8 once per run, E7 at egress/unload; registered iff non-TRANSIT and body loaded, reconciled every run); it emits nothing, adds no LightOccluder2D or shadow, and never changes lux/lit/beam of any subject."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-010
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Target selection reads `lux(ref)` once per living candidate seat per run with a stateless `lux_pm >= LIT_ON_PM` (150) test (not the Emitter `lit` bit); highest lux_pm wins, ties lowest seat id; the target is never persisted and uses zero probe() calls."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-011
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Horror position is owned in `horror.state` (integer base px plus sub-pixel residue and last_octant), moved by Body's pure `LocomotionStep` bound to Layout `solid_in` with foot box 16x8; no CharacterBody2D, no Body AGENT row, no physics query."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-012
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Speeds satisfy V_CREEP_MPX 1000 < V_HUNT_MPX 1500 < V_WALK x 1000 so a walking seat always outpaces the horror; there is no lunge travel; the STRIKE resolves at the locked point."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-013
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Pathing is integer breadth-first over the Layout room_adjacency graph (passable-leaf edges only, ties lowest id, at most `PATH_EXPANSIONS_MAX` expansions per run), cached per (goal_room, layout_hash, version(section_id) of every body section) and rebuilt on any restore; NavigationServer2D/NavigationAgent2D are not used."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-014
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "REACH locks point P at begin (non-tracking), draws UNFOLD_TICKS = 5 x ceil_div(rng_int(UNFOLD_LO/5, UNFOLD_HI/5) x UNFOLD_SCALE_PCT, 100) once from `rng_derive_epoch(world_seed, \"horror.tell\", counter)`, and publishes state/locked_pt/reach_end_T; the strike resolves on the first run with T >= reach_end_T."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-015
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "STRIKE calls `apply_suit_damage` once per living seat with dist < R_SNAP_PX of P in the same room as P (strict same-room test using Layout room_at), only if the predicate holds, and lays one STRUCK mark if any call was made; REACH begin requires `connected()` via Layout `door_passage` and `linked()` governs standoff rules."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-016
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "All simulation randomness is the REACH length only, via the kernel's `rng_derive_epoch` (counter + RESTORE_KEY_STRIDE x restore_epoch, counter < 2^20); every other variation (mark seed, waypoint, L3 timing) uses the pure-integer `he_hash` with fixed salts and HE_HASH_SEED; no wall clock or global RNG; golden vectors pinned by AC-HE-139."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-017
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "`restore_epoch` is owned by Save/Load (u32 in slot_epoch.bin), exposed read-only in `kernel.clock`; Horror reads it only through rng_derive_epoch and never stores it in `horror.state`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-018
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "`horror.state` persists a closed manifest of fields (identity/place, timers, REACH/STRIKE, nav goal and counters, transit/ingress, travel accumulators, epoch ledgers, mark ring plus mark_id counter, \"horror.tell\" counter, fp_window/fp_count, disturbances and last_end_T map, lurk_dwell_index, unfold_scale_pct) and excludes target, path cache, restore_epoch and horror.view.debug."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-019
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Restore is two-phase with closed failure set HORROR_RESTORE_* (SCHEMA, RANGE, STATE_INCOHERENT, SECTION_UNKNOWN, RNG_COUNTER, MARK_RING); out-of-range values hard-fail and are never clamped; restore is idempotent, uses plain data only and explicit dirty keys, and a restore into REACH keeps the full remaining telegraph."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-020
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Same (save bytes, restore_epoch) pair replays identically (positions, marks, strike lengths, state_hash); the mark ring, counter and epoch ledgers are included in state_hash and `horror.view.debug` is non-hashed and never read by any SIM rule."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-021
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "The mark ring holds at most `MAX_MARKS` 32 persisted records {mark_id, kind, section_id, pos_px, seed, life_left_ticks} with per-kind quotas (RIME 7, HAIRLINES 3, STRUCK 3), oldest-of-kind eviction, at most `MARKS_PER_RUN_MAX` inserts per run, ageing only while the mark's section is loaded; marks are laid regardless of any viewer's hallucination state."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-022
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "A body-unloaded record is dormant (no step, no ageing, no fast-forward) except the TELL departure into TRANSIT, which is evaluated first on every run before dormancy; TRANSIT records are unregistered, have no position, and wait if the destination body is unloaded."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-023
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "On weld/cut the record re-bases all persisted body-frame points by delta = section_offset - offset_seen_px, re-derives body_id from body_of, and calls E8 in the same run; the path cache is recomputed on any layout.state change."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-024
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "L3 light disturbances are published state `horror.view.disturbances[]` {emitter_id, strength_pm, start_T, dur_ticks} on FIXTURE and NODE_LANTERN emitters only (never BEAM, BEACON, FAULT_GLOW, DEPLOYABLE, EMERGENCY or DOCK_STATUS), bounded by L3_MAX_ACTIVE and L3_MIN_GAP_TICKS, persisted, never a call into Lighting."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-025
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "`horror.view` publishes entity_id, type_id, state, pos_px, body_id, section_id, locked_pt, reach_end_T, strike_T and seats hit, transit_until_T, ingress/egress events, disturbances, mark ring and frozen `horror_*` diagnostic counters for Audio, Lighting, Sanity, Perception Filter and Debug Overlay; Horror owns no sound, mix or cue name."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-026
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Horror's truth-channel outputs (M17 writes, marks, disturbance state, suit damage, true horror.view positions) are bit-identical with and without a Perception Filter; Horror holds no sanity reference and reads no PERCEPTION_OUT block."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-027
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "`horror.step` meets `HORROR_STEP_BUDGET_MS` 0.15 ms P99 per run with at most 4 lux reads, 5 solid_in queries, PATH_EXPANSIONS_MAX expansions on cache miss, 0 probes, and at most one apply_suit_damage per seat."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-028
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "HORROR subjects accept no player verb (forced commands return INVALID_TARGET); no HP, kill state, loot, XP, hit feedback, threat bar or proximity indicator exists; the suppressant `repel` interface is data-dormant at MVP."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-029
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Horror reads seat state only via Body `actors_on`/`pos_curr`/`actor_section` and Controller `controller.state.loco_state` (DOWNED, DEAD, IN_POD, STAGGERED); DOWNED/DEAD seats are never candidates or hit, and Horror never moves or staggers a seat."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-030
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "The mark render subscriber draws within `HORROR_MARK_DRAW_GROUPS` of the shared `D_marks` budget in the floor-marks band, and the rig is Y-sorted at 12 fps with 15-degree segment rotation; presentation never writes the camera."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-031
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Horror reads Layout only through published queries with per-run read budgets (room_adjacency on cache miss only; room_at, anchor_geometry and solid_in at most 5 per run; hull_segments_near, version and emitters_near at most once per run), none per tick, and treats a NONE or UNKNOWN read as neither unlit nor open."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-032
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Door passability for pathing and REACH uses Layout's door_passage (open_extent_px, hinge-aware gap_rect) with one rule: passable iff open_extent_px >= 16 across an east-west run and >= 8 across a north-south run; standoff rules use linked, REACH begin uses connected."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-033
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Seat commands issued during tick t are applied by body.integrate in that tick and horror.step reads positions after body.integrate; this tick-indexing convention is pinned by a fixture, and a measured input-to-display latency above INPUT_LATENCY_TICKS 3 on RM-DESKTOP/RM-DECK release exports forces UNFOLD_LO to 100."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-034
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "The serialised horror.state with a full ring (32 marks), 4 L3 entries and 16 last_end_T entries is at most 16 KiB, per-tick dirty keys stay at or below MAX_DIRTY_KEYS 256, and every mutation declares explicit dirty keys (a missing key fails the save-equivalence test)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-035
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Horror step runs seven ordered transition guards with fixed precedence: restore first, then layout change, then the tell edge before dormancy, then phase edge; the 4-phase by 6-state matrix is exhaustively tested and a new tell_epoch seen mid-REACH fizzles it to RETREAT in the same run."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-036
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Per-epoch counters (strikes, gouges, ruptures, chill totals, gouged_seg_ids) reset lazily at the first run that sees a new tell_epoch, identically for a record whose body was unloaded and for a record restored from an older save."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-037
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Cross-parameter relations among Horror tuning values (R_SNAP < REACH_RANGE < LURK_STANDOFF, ingress delay plus stalk floor plus mark lead <= TELL_MIN_TICKS, STRIKE_BP versus suit patch cap, L3 flash rate, MAX_MARKS quotas versus smear retention) are arithmetic assertions at data load, with negative fixtures that fail boot."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-038
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "The source_ref passed to apply_suit_damage is classed EXOGENOUS once at record creation (boot or ingress arrival), persisted with the record, valid across restore independently of Emitter registration, and an unclassed ref is a build-failing programmer error."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-039
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Emitter registration is idempotent across restore and body load (post_restore E6 on an already-registered ref returns false and is not a defect; registered at stored pos_px before any other act on load), and HORROR_SUBJECTS_MAX 2 plus A_max stays within MAX_MOVING_SUBJECTS 16, a failed first-registration E6 being a budget defect."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-040
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Accessibility settings (reduced motion, reduced flashing) change presentation only: Lighting caps the read L3 strength at L3_STRENGTH_RM_CAP_PM, pose-tag sequence and stage lengths are identical to the setting-off run, and the SIM strength_pm and state_hash are unchanged by the setting."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-041
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "Rig pose tag and mark rendering are pure functions of published horror.view state (state, state_enter_T, now) so the first frame after a restore needs no transition, sprites are drawn at alpha 0 or 255 only, and nothing is drawn at 0 percent ambient with no light in range."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-042
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "The Horror test harness injects every neighbour read (attention.view, Layout, Emitter, Suit, Graph, Body) through stubs with a stub-or-real switch per read, and a replay runner returns state_hash every 600 ticks for a (world_seed, restore_epoch, script) triple; no Horror story starts before it."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-horror-043
  system: horror
  gdd: design/gdd/horror-entities.md
  requirement: "A headless 864000-tick soak of repeated breach cycles leaves horror.state structurally stable: key set equals the committed manifest, every list stays at its cap from the first full-ring cycle (at most cycle 20), mark_id strictly increases, and all withheld and wedged counters stay 0."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-001
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Sanity registers exactly three state blocks (`sanity.state` SIM/WORLD/SHARED_SUMMARY, `sanity.ledger` SIM/WORLD/HOST_ONLY, `sanity.perception` PERCEPTION_OUT/non-persisted/OWNER_PRIVATE), all PER_PLAYER, each with schema_version 1, explicit dirty keys, restore-idempotence, default_state, post_restore and a two-phase restore returning (ok, reason, detail)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-002
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Sanity is scene-tree-free and integer-only; level is an int mSU in [0, SAN_MAX=100000] per PlayerId (never peer_id), starting at SAN_MAX on first bind, and an unbound seat does not drift while keeping state."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-003
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "A single hook `sanity.drift` (divisor 12, offset 0, 5 Hz) runs per bound seat in ascending PlayerId through the fixed 7-step order, with `after:` edges on graph.propagate.failure and suit.vitals (tolerates_stale), attention.step, emitter.place, body.integrate, interaction.step and horror.step."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-004
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "The run clock is absolute (`run = T div 12` from kernel.clock); every stored stamp (start_run, active_run, end_run, last_onset_run, debounce, until_run) is an absolute run, while stage_dwell and harm_below_runs are executed-run counters that freeze when unbound."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-005
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Level changes only through D.1: net loss per run is clamp(E - R + draw, -REC_MAX, +DRIFT_MAX_PER_RUN=36); one-shots go via `pending` (PENDING_MAX 3000) and drain only into cap headroom; only debug force_level/force_stage may bypass."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-006
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Exposure is a closed list of four true SIM inputs (E1 ring/aboard, E2 Attention phase/tier, E3 horror distance only, E4 dormant); darkness, Suit vitals, player noise, any PERCEPTION_OUT/Perception/Lighting/Audio value and player action counts must never feed level (enforced by a source-scan lint of the D.1 path)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-007
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Sanity reads Attention only via attention.view fields phase, tier, tell_outcome, tell_epoch (never level_pm) and never writes Attention."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-008
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Stage is a pure function stage_of(level, prev_stage, stage_dwell) with entry thresholds 70000/55000/25000, exit = entry + STAGE_HYST 2000, a 25-run dwell, and no stage 4; a stage change never ends a live lie."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-009
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "harm_eligible is one SIM bit (sets after 150 consecutive runs below SAN_HARM_ENTER 15000, clears at once above SAN_HARM_EXIT 20000), exposed via `actor_sanity_below_harm_threshold(player_id) -> bool`, and the class-(c) render level is that bit with no PERCEPTION_OUT copy."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-010
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Boot assertions D.4 (i)-(v) lead invariants, ambient-floor invariants, THRESHOLD_ORDER, HOME_REFUGE and related SANITY_BOOT_* checks must refuse boot with a named reason on any retune that breaks them."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-011
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "`record_falsification` and `record_harm_event(actor, victim, tick)` are Class B (clamp-never-reject) mutators called from Interaction's interaction.step hook; an unknown id or unresolvable ref is a no-op with one log line, never a fault or exception."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-012
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "`record_harm_event` appends only {tick, actor, victim, attributed_to: WEB} to an `incidents` ring (INCIDENTS_MAX 16) and changes nothing else (no reward, no recovery, no level change)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-013
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "`sanity.ledger` is HOST_ONLY and PER_PLAYER and no symbol of it or of `sanity.perception` may be read outside `sanity/` except the Debug Overlay (DIAGNOSTIC) and the Perception Filter / replication adapter respectively (lint)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-014
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Every lie must pass the shared guard rails SN-15 (corruptible module-body channel only, live consequence-channel witness, second instrument, leak always present, uniform immunity after a check), applied by effective direction (COMFORT/ALARM) and re-checked every run, with failure INVALIDATING the lie."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-015
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Onset is triggered only by a lit-entry event (first illumination of a subject per seat per visit, via cid(P) != persisted last_cid), with a 10-run batch window, a 20 s per-subject debounce stamp, and a fixed gate evaluation order."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-016
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "RNG draws use only kernel `rng_derive(world_seed, \"sanity.<stream>/<PlayerId>[/<stable_id>]\", counter)` / `rng_int` with persisted counters; draw count is fixed at 0, 1 or 4 per event (0 when sum_W < 1), and counters advance only on gated player-driven events."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-017
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Determinism: replay is bit-exact for identical actions, no content depends on restore_reason or restore_epoch, snapshot/state_hash iterate sorted keys, and get_instance_id, hash(), shuffle, pick_random, unstable sort_custom and unsorted Dictionary iteration are lint-banned."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-018
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "`sanity.perception` is rebuilt in full every run and in post_restore as a closed-schema, slot-ordered list (int/bool/String fields only; no float/Vector/Node/Callable) listing every ACTIVE entry with an `away` flag; PENDING entries are never listed."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-019
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "post_restore must not prune or mutate persisted state: a well-formed but dead subject_ref restores successfully, is projected as-is, and is INVALIDATED and pruned by the next hook run so state_hash matches the uninterrupted run at every tick."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-020
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Restore validates strictly (out-of-range or wrong-shape values are hard failures, never clamped); JSON-parsed integer-valued floats are accepted and re-cast to int, while fractional/NaN/inf values fail SHAPE; values stay below 2^53."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-021
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "`last_onset_run` (init -1) and `last_cid`, `evented[]`, `batch_end_run`, `entry_pending`, `debounce[]`, `next_lie_id` and per-subject visit counters are persisted ledger state (not rebuilt caches) and per-subject visit counters are pruned at the first hook run after subject destruction."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-022
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Sanity must never touch body state/positions, geometry, trails, consequence-channel items, Attention outputs, prompts/durations, save/pause surfaces, camera/controller values, the human channel, emitters or Suit damage logic (identical input at stages 0-3 gives byte-identical pos/facing/aim_angle)."
