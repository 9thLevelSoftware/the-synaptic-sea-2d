- id: TR-section-001
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Layout registers exactly one kernel state block `layout.state` (class SIM, persist true, persist_scope WORLD, scope SHARED, schema_version 1, `restore_after: []`, one hook `layout.doors`) with callbacks snapshot/restore/default_state/post_restore/read_view."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-002
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "The Layout data module is scene-tree free and integer-only: a headless test must assert it references no `Node` and no float exists in any Layout value."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-003
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Templates (rooms, tiles, rect table, doors, sockets, hardpoints, slots, anchors) are immutable data loaded at start-up, before the kernel's BOOTING (ADR-0007 § 1.7), from a committed `assets/data/sections/manifest.json` in sorted `template_id` order (never a DirAccess scan), never appear in a snapshot, and every JSON number is int-cast and bound-checked."
  created: 2026-10-28
  revised: 2026-10-28
  status: active

- id: TR-section-004
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`layout.state` stores instances by reference to templates (bodies table, 13-int section-instance rows, sparse non-FREE socket table, `welds[]`, counters `next_section_id`/`next_body_id`/`next_room_id`); derived caches (broadphase grid, leaf rects, version counters, `opening_leaves`, `graph_ref` maps) are never persisted."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-005
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Ids (`section_id`, `body_id`, `room_id`) are allocated by Layout from persisted counters in template order, never reused or renumbered; a discarded section remains a tombstone row; `graph_ref_base {node_base, edge_base, comp_base}` is persisted per instance."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-006
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Snapshot encoding uses dense parallel packed arrays in ascending id order (no int-keyed Dictionary, no Vector2i/Rect2/Resource), 64-bit values (`welded_at_T`, `cut_at_T`) as two 32-bit halves, and `snapshot()` returns deep copies."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-007
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`restore()` swaps whole tables from scratch only on success, rejects unsupported stored_version, unknown `template_id`, structural template change, or geometry_hash change on an instance with history; `rot_q != 0` is rejected (`LAYOUT_ROT_UNSUPPORTED`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-008
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Static queries (room_at, V, exposed_tiles, section_offset, body_of, socket_plan, static rects) are valid immediately after `restore()`; leaf-dependent queries are valid only after Layout's `post_restore()` (derive_doors pass) and report template-default closed leaves with a `stale_leaf` diagnostic before it."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-009
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`post_restore()` performs cross-block verification only (graph_ref_base resolves, def_ids resolve, weld seam_ids resolve in Graph) and rebuilds `opening_leaves`, bumping version/leaf_version for sections with open leaves."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-010
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Geometry is expressed as half-open integer rects `[x0,x1)x[y0,y1)` in base px with a flags byte (SOLID, OCCLUDES_LIGHT, DOOR_LEAF, PROP, MACHINE, HULL) on a 24-px grid (TILE_PX 48, WALL_FOOTPRINT_DEPTH 24); px-to-tile conversion uses floor division, and transforms are integer translation only (no rotation, mirror or zoom value)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-011
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "One rect set serves collision (Body `solid_in`), light occlusion (Emitter/Lighting `rects_in`) and drawing, with no \"perceived\" or phantom variant of any query; the avatar has no engine physics body and no engine tile collision or navigation mesh is created."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-012
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`layout.doors` hook (divisor 1, `after: []`) runs in P3, re-derives each door/hatch leaf rect from the Graph's `opening(edge_id) -> {area, area_max, door_state}` with `leaf_w = width_px - floor(width_px*area/area_max)`, and bumps leaf_version/version once per changed section; `body.integrate` is `after: [controller.step, layout.doors]`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-013
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Layout never stores, mirrors or writes `area` or `door_state`; every template-door/hatch `area` write must occur in P2 via command (never M13 from a P3 hook), and the door leaf sprite extent must equal the leaf rect (no tween)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-014
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`leaf_would_overlap(opening_ref=Graph edge_id, area, foot_boxes[])` and `leaf_obstruction` are pure queries evaluating every leaf of the opening (both sections of a mated hatch); foot boxes are caller-supplied arguments and Layout reads nothing from `body.state`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-015
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Hot-path `rects_in(aabb, out)` / `solid_in(body_id, aabb, out)` fill a caller-owned QueryBuffer (PackedInt64Array keys `section_id*RECT_KEY_STRIDE+idx`, PackedInt32Array occupied spans `(x0,y0,x1-1,y1-1)`, PackedByteArray flags) in ascending key order and allocate nothing in steady state (0 bytes growth over 9,000 calls)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-016
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "A per-body derived uniform-grid broadphase (BROADPHASE_CELL_PX 48, never persisted, rebuilt at build/attach/detach/restore) answers `solid_in` at P99 <= 0.05 ms per actor with a 2,000-rect body (aggregate 8 actors <= 0.6 ms; Emitter 288x288 query <= 0.3 ms) on RM-DESKTOP/RM-DECK release export."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-017
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Per-section `version`, `static_version`, `leaf_version` are monotone, non-persisted, reset to 1 on restore, and bumped for every section whose rect set can change (both sections of a weld/cut including the unmoved host, and every moved section); `changed_region(section_id) -> ALL | REGION | FRAME` is valid only for the current tick."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-018
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Sockets are pre-declared attachment sites with states FREE -> WELDED(seam_id) -> CAPPED or CUT_OPEN, which never return to FREE in MVP; sockets change state only inside LM2/LM3 (no `install_cap_plate` or `set_socket_state` mutator)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-019
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`can_attach` applies a fixed first-failure-wins reason order (SOCKET_UNKNOWN, SOCKET_NOT_FREE, SAME_BODY, FACING_MISMATCH, WIDTH_MISMATCH, CLASS_MISMATCH, LANE_MISMATCH, GEOM_OVERLAP) with GEOM_OVERLAP tested over static footprints and tile cells, memoised on (socket_a, socket_b, static_version_a, static_version_b), <= 2 ms uncached."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-020
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Layout has exactly four Class A (validate-then-apply, infallible apply) mutators: LM1 `build_section`, LM2 `attach_section`, LM3 `detach_section`, LM4 `discard_section_geometry`; no Class B mutator; each has a pure `can_*` validate; LM2/LM3 run inside Assembly's single atomic apply after the Graph's `weld_join`/`cut_detach`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-021
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Weld offsets are `offset_b = offset_a + pos_a - pos_b` on the survivor body (lower `body_id`), argument-order independent, with `welds[]` canonicalised so reversed calls produce a byte-identical block; every built section starts on its own body so the weld relation is a forest and a cut splits exactly two components; detach allocates the new `body_id` from Layout's counter and re-bases to the min-id section."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-022
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Dirty tracking is explicit inside each mutator (not via packed-array property setters, due to the Godot 4.7 packed-array element-write change); dirty keys are ints `(KIND<<32) | id` (SEC 1, BODY 2, SEAM 3), batched to the PROJECTOR subscriber, collapsing to ALL past MAX_DIRTY_KEYS 256."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-023
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "World construction runs only at `init_world` inside one WriteScope in the fixed order Layout `build_section` -> Emitter E1 `instantiate_section_emitters` -> Interaction `sync_section` -> PROJECTOR notification; Layout calls no Emitter or Interaction mutator; MVP world is four sections on four bodies (453 tiles)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-024
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "The PROJECTOR is a separate subscriber that builds engine-side derived objects (TileMapLayer/sprites) from `layout.state`, never writes blocks, never creates Light2D/LightOccluder2D, builds 453 tiles at BUILD_TILES_PER_FRAME 256 in <= 3 frames, and assigns each sprite a Layout-namespaced int64 `entity_id = (LAYOUT_ID_NS<<56) | (section_id<<24) | (kind_ordinal<<16) | template_local_idx` for the Pipeline Y-sort key."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-025
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "The PROJECTOR scene shape (no-reparent option B vs per-body reparent option A) must be decided by spike SP-YSORT-1 and recorded in ADR-LAY-03 before the PROJECTOR story starts; weld frame costs at most one frame over the P99 ceiling (16.6 ms desktop, 33.3 ms Deck)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-026
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Determinism: `layout_hash` is the kernel `block_hash` of `layout.state` (derived caches and door state excluded), all iteration is over dense arrays in ascending id order, Layout draws no RNG, and `welded_at_T` is the only stored time value (seam age = `T - welded_at_T >= SEAM_OLD_AFTER_TICKS` 36,000, derived)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-027
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Layout owns room identity, tile sets, `V`, `exposed_tiles`; both `V` and `exposed_tiles` never change while a room exists; the Graph caches them as derived fields rebuilt in its `post_restore` (`graph.state restore_after: [layout.state]`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-028
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Layout owns no loose-item table (Interaction's `interaction.state` holds it), no `visited` bit (WORLD-scoped block rolls back), no pose/velocity, no atmosphere; item positions are `(section_id, section-local px)`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-029
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "A structural lint (ERROR/WARN/INFO ids such as RECT_OVERLAP, GRID_24, ROOM_SHAPE, V_RANGE, CONTAINMENT_LEAK, HATCH_ALIGN, HARDPOINT_NO_COMPATIBLE, CAPACITY_*) runs at template load and rejects out-of-range or malformed templates; content lint is Derelict Authoring's."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-030
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Capacity ceilings are enforced by `can_build`/`can_detach` (MAX_FOOTPRINT_RECTS_PER_BODY 2000, MAX_DOORS_LOADED 48, MAX_DOORS_PER_SECTION 24, MAX_SECTIONS/BODIES, `next_section_id <= 2^20-1`); snapshot size estimate raises a one-shot diagnostic at LAYOUT_BLOCK_SOFT_BYTES 65,536 and stays under MAX_BLOCK_BYTES 32 MiB."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-031
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`layout_hash()` is memoised and recomputed only after LM1-LM4 or restore; a tick containing only door changes performs no `layout.state` encode or `block_hash` call, and `geometry_hash` and `visual_hash` are computed once per template load."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-032
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Template `geometry_hash` and `visual_hash` persisted through `PackedInt32Array` are compared after `& 0xFFFFFFFF` normalisation so values at or above 2^31 never spuriously fail restore; `mutation_count` is never persisted, and the only hash is the kernel H64 through `HashingContext` (a lint bans the built-in `hash()` and hand-rolled byte-accumulator loops)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-033
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Every Layout-owned tuning knob is loaded from the default-config file with no literal in module source; each is validated at its range minimum and maximum, and an out-of-range value is rejected loudly with the knob's name and never clamped."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-034
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "When `attach_section` applies in P2, the new hatch LEAF cache is seeded closed, so reads between the P2 apply and the P3 `layout.doors` hook see a solid span, raise no `stale_leaf`, and do not bump `leaf_version` unless the P3 area read differs."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-035
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "When `layout.doors` reads an unknown `opening(edge_id)`, the leaf stays closed at the template default, `area` is never invented, `leaf_version` is not bumped, and `opening_unknown` is raised once per edge; an `area` above `area_max` is clamped with a diagnostic, and the same fault found in `post_restore` is `LAYOUT_RESTORE_DANGLING`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-036
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "A failing `can_*` changes no state, marks no dirty key and consumes no id; reason sets are closed per validator (including `CAPACITY` for build and detach), surface as `VALIDATION_FAILED(layout.<REASON>)`, never include door-close tokens, and a fault inside an apply sends the kernel to `FAULTED`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-037
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`next_body_id` and `next_room_id` are capped at 2^31-1 (the int32 limit of their packed columns), `can_build` and `can_detach` return `CAPACITY` before consuming an id or calling the Graph, and no counter ever wraps."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-038
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "LM2 returns `{surviving_body_id, absorbed_body_id, moved_sections[], frame_shift_px}` and LM3's record carries `rects[]` equal to `detach_preview(seam_id).rects[]`, so Body rebases from the record; `detach_section` places the cap plate without reading any actor or foot-box state, and an actor-in-cap rejection belongs to Body and Assembly."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-039
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "LY-28 read views return records with fixed field names and deterministic ordering: `anchor_geometry` and `room_surface` match the Failure and Trail contract, `door_passage` equals the D.5 table, `room_adjacency` is ordered `(room_a, via_id)`, `wall_face_rows` is at most 16, and every read is idempotent and identical after restore."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-040
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "The start-up template loader (before the kernel's BOOTING, ADR-0007 § 1.7) and the offline authoring tool run one lint implementation with an identical set of lint ids and severities, matching the single authoritative LY-30 table; any ERROR rejects the whole template and aborts boot."
  created: 2026-10-28
  revised: 2026-10-28
  status: active

- id: TR-section-041
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "In a Godot 4.7.2 release export the manifest-listed template and world JSON paths are included by export filters, load in sorted `template_id` order, and yield `geometry_hash` and `visual_hash` equal to the editor run; no directory scan is used."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-042
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`layout.doors` with MAX_DOORS_LOADED (48) animating doors costs at most 0.2 ms on a release export (5% of STEP_BUDGET_MS 4), bumps `leaf_version` at most once per section per tick, and never bumps `static_version`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-043
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "Engine behaviours Layout depends on are probed by spike SP-ENG-1 on a 4.7.2 release export before dependent ADRs are accepted: JSON number types, packed-array element-write setter semantics, `var_to_bytes` determinism, negative integer `/` and `%`, SHA-256 and `>>` behaviour, and `PackedInt32Array` round-trips of values at or above 2^31."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-044
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "`template_id` and each template's `room_key`s are pinned by an append-only ledger `assets/data/sections/ids.lock.json` (ADR-LAY-04, ADR-0007 § 3.2); its nesting is the Layout GDD's schema to choose."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-section-045
  system: section
  gdd: design/gdd/ship-section-and-layout-data-model.md
  requirement: "The release export filter `assets/data/*.json` covers every template and world JSON file; CI checks every manifest path against it (`EXPORT_FILTER_MISSES_MANIFEST`); `geometry_hash` and `visual_hash` are computed at load from the post-cast template and never stored in the file (ADR-0007 § 3.5)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-001
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "No Godot physics server or physics node (RigidBody2D, CharacterBody2D, Area2D, PhysicsServer2D, move_and_slide, test_move, engine tile collision, nav mesh) is used on any simulation path; a lint over the whole Body and Layout directories finds zero matches."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-002
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "All Body-frame state (actor position, foot box, sweep) is integer-only; the Body and Layout directories promote GDScript typing warnings (UNTYPED_DECLARATION, INFERRED_DECLARATION, UNSAFE_*, NARROWING_CONVERSION, INTEGER_DIVISION, INFERENCE_ON_VARIANT) to errors, with exactly one annotated integer `/` site inside `trunc_div`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-003
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Each welded set is exactly one body keyed by Layout's `body_id`; Body stores only pose (`world_x`, `world_y`), velocity (`vel_x`, `vel_y`), reserved `heading_q` (always 0) and actor rows, and never allocates, retires or edits `body_id`, membership, offsets, rectangles, sockets or hatch states."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-004
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Nothing keyed on a body-frame coordinate reads `world_*` or `vel_*`; a body with non-zero `vel` run 600 ticks yields a byte-identical `canonical_encode(payload[\"actors\"])` to a body at rest."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-005
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`body.state` is registered as one SHARED SIM block: persist true, scope WORLD/SHARED, schema_version 1, supported_versions [1], `restore_after: [layout.state]`, exactly one hook (`body.integrate`) and exactly one PROJECTOR subscriber (`body.projector`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-006
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "The persisted schema v1 is per-actor `{actor_id, kind, seat, body_id, pos_curr, sub, last_octant, odometer}`, sparse per-body `{body_id, world_x, world_y, vel_x, vel_y, heading_q}`, and scalar `next_actor_id`; `pos_prev`, `blocked` and all diagnostics are derived and never persisted or hashed."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-007
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`odometer` is a 64-bit integer carried in the snapshot as an exact integer (2^53+7 round-trips) and is never stored in a Vector2i or as a JSON number."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-008
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`snapshot()` returns a plain Dictionary with exactly five keys (`next_actor_id`, `n_bodies`, `n_actors`, `bodies` n*6 ints, `actors` n*10 ints; plain Arrays, rows sorted by id, no floats, no `pos_prev`), and canonical bytes are the kernel's D.12 TLV encoding of it; Body ships no byte writer and never uses `var_to_bytes` for hashed bytes."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-009
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`restore(data, version)` validates in order (type, count, per-row fields, order and canonicity, Layout liveness), rejects the whole block with a named BDY_RESTORE_* reason on the first failure leaving live state untouched, never clamps, and `snapshot(restore(snapshot()))` is byte-identical for `body.state`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-010
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`post_restore` sets `pos_prev := pos_curr`, preserves `sub`, runs the trapped-actor probe, and does not rebuild the kernel seat binding; a foot box overlapping a SOLID rectangle after restore is counted, never a load failure."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-011
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`body.integrate` runs at divisor 1, offset 0, `after: [controller.step, layout.doors]` (partial order), and `emitter.place` runs after it; every hook id named must be registered by its owner or boot fails."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-012
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Within `body.integrate`, bodies integrate pose first in ascending `body_id` (`world += vel`, with `world_prev := world` set beforehand), then actors step in ascending `actor_id`; a stationary actor issues no Layout query."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-013
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "The hook is total: data defects (orphan body, invalid octant, v_eff outside 0..3, unbound SEAT, world+vel beyond +/-WORLD_COORD_LIMIT) are absorbed deterministically and counted (BDY_ORPHAN_ACTOR, BDY_OCTANT_INVALID, BDY_VEFF_INVALID, BDY_SEAT_UNBOUND, BDY_WORLD_LIMIT) and never FAULT."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-014
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "The hook is allocation-free per tick: id-sorted struct-of-arrays (PackedInt32Array / PackedInt64Array), a caller-owned scratch record, and `solid_in_into` filling a preallocated PackedInt32Array; `step_into` and the value-returning `step` return identical results."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-015
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`LocomotionStep` is a pure scene-tree-free RefCounted function `step(state, intent, collide)` usable headlessly and by Horror Entities; it uses `trunc` for the sub-pixel residue (1/256 fixed point, UNIT 256/181) and FLOOR division only for px-to-tile conversion."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-016
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Body reads only `octant` and `v_eff` from `controller.state[seat]` and derives no gait, speed, facing or loco_state; the sub-pixel residue resets only when the move octant differs from Body's own persisted `last_octant`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-017
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "The foot box is `[pos.x-8, pos.x+8) x [pos.y, pos.y+8)` (FOOT_BOX_W 16, FOOT_BOX_H 8, half-open, origin at top-centre), and collision is against Layout's `solid_in(body_id, aabb)` rectangles exactly (24 px wall footprint), with no inflated margin and no second rectangle set."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-018
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "One `solid_in` query per moving actor per tick (swept box at most 19x11 cells) is swept analytically; the analytic clamp is the shipped baseline and the literal 1-px stepper is the test oracle, proven result-identical by property test."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-019
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "An actor whose foot box starts inside SOLID rectangles may only take sub-steps that do not increase per-rectangle overlap and whose destination foot origin lies in a section of its own body; the body is never pushed, shoved, snapped or displaced, and actors do not collide with one another."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-020
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Every mutator BM1-BM7 is Class A, called only from Assembly's or Transit's single `apply` after the Layout mutator, check-then-write (a faulting call writes nothing), returns OK or a negative FAULT_CODE (BM1 returns actor_id >= 1 or a negative code), uses no `assert()`, and reports defects through an injectable `plan_mismatch_sink` counting BDY_PLAN_MISMATCH."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-021
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Each mutator has a pure `can_*` precondition read (`can_place`, `can_remove`, `can_rebase_attach`, `can_rebase_detach(old_body_id, frame_shift_px)`, `can_transfer`, `can_set_velocity`, `can_set_pose`) that the caller's `validate` invokes before any mutator runs."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-022
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Dirty keys use Layout's encoding `(KIND << 32) | id` (BODY 2, ACT 4) and every mutator marks dirty keys explicitly, because 4.7 packed-array element writes no longer call the property setter; per-block per-tick keys stay under MAX_DIRTY_KEYS 256."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-023
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "BM3 (weld) shifts only actors on the absorbed body by `+frame_shift_px` (frame_shift_px on Layout's 24-px grid), keeps `sub` and `last_octant`, deletes the absorbed pose row, and for every moved actor `(actor_section, actor_local_px)` is unchanged before and after."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-024
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "BM4 (cut) assigns actors by the section containing their foot origin evaluated against reconstructed pre-cut geometry (`offset_pre = section_offset + frame_shift_px` for moved sections), shifts `C_new` actors by `-frame_shift_px` with `sub` zeroed, creates the new pose row, and refuses with `-BDY_REBASE_ACTOR_IN_CAP` if `actors_overlapping(old_body_id, cap_rects)` is non-empty; an out-of-range new pose row saturates and returns OK."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-025
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Weld legality takes no pose input (Layout `can_attach` plus Graph `can_join` only); `docked(a, b, frame_shift_px)` is a pure read that gates nothing inside Body, and a PLAYER-origin weld is offered only when `docked` holds (Assembly and Transit must repeat this)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-026
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "World pose and velocity are integers in whole base px (` | world | <= 2^22`, ` | vel | <= 16` per tick, `heading_q` must be 0); lowering either bound or MAX_ACTORS after saves exist requires a schema_version bump with migration, and `DETACH_DRIFT_PX_PER_TICK` is locked at 0 (non-zero fails a boot lint)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-027
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Ship motion applies no force, push, tilt, knockback or drift to any actor; docking and separation are published only as P5 events `BODY_DOCK_CONTACT`, `BODY_HULL_SEPARATION` and `BODY_TRANSFER{weld | detach | pod}` (payload `{tick, actor_id, seat, old_body, new_body, frame_delta_px}`) carrying no simulation state."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-028
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`actor_section(actor_id)` equals Layout's `section_at(body_of(actor), pos_curr)`, derived on demand and never stored or cached across a mutator; `actor_local_px = pos_curr - section_offset`; a foot origin in no section is a defect-only state counted as BDY_TRANSFER_NO_SECTION."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-029
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`body.state` is SIM and never PERCEPTION_OUT; its read view (`pos_curr`, `pos_prev`, `body_id`, `kind`, `seat`, `foot_box`, `bodies[*].{world, vel, world_prev}`) may be read by PRESENTATION subscribers, with no per-player variant, and `blocked` is readable only by PRESENTATION and DIAGNOSTIC subscribers (never by a SIM hook; lint)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-030
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Body publishes `seat_bindings() -> [(seat, actor_id)]` (ascending seat, SEAT rows only, derived per call) as a binding source registered at BOOTING; the kernel's LOADING step (CR-7, KRN-BIND-01) rebuilds PlayerId bindings from it, and AC-BDY-6 / AC-BDY-138 are Body's epic closure gate against the real kernel and Save/Load."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-031
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Determinism: no RNG, wall clock, float state or unordered-container iteration in the block or hook, and Body is correct for 1..MAX_TICKS_PER_FRAME (4) `body.integrate` runs per rendered frame."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-032
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`body.projector` is the only Body script that may name Node2D/Camera2D/Viewport; it owns one per-body root Node2D (translation only, rotation 0), one `y_sort_enabled` actor/props layer per body root, the loaded body's `Camera2D.limit_*`, and reparents Presenter nodes on `BODY_TRANSFER` via `attach_presenter(actor_id, node)` without using global-transform-preserving `Node.reparent`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-033
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "The canvas offset of a non-avatar body is one floored integer per body per frame, `floor(off_prev + (off_curr - off_prev) * tick_alpha)` with both offsets taken relative to the current avatar body, and `physics_interpolation` is off for all presentation (`tick_alpha` is the one interpolator)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-034
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Hook cost is budgeted as a whole (pose + all actors + commit + diagnostics), pending spike S1 on RM-DESKTOP and RM-DECK in a release export: P99 <= 90% of the frame ceiling, per-actor sweep logged above SWEEP_COST_LOG_MS 0.05 ms, 8 actors cited at 0.4 ms of the 2 ms P3 target."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-035
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Body owns the diagnostics `PC_FOOTPRINT_OVERLAP`, `BDY_TRAPPED_ACTOR`, `BDY_REBASE_ACTOR_IN_CAP` and the other BDY_* defect counters, which live in the hook's diagnostics channel (never in the block or hashed set) and must read 0 at the end of every clean-build CI scenario."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-036
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Layout's `solid_in(body_id, aabb)` must return unique rectangles in ascending key order, and the sweep must tolerate empty, duplicate or unordered results with identical output plus a debug-only `diag.solid_in_unordered` signal; the rectangle set read in `body.integrate` is the post-cut, post-leaf set of that tick."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-037
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "The coupling `BROADPHASE_CELL_PX >= FOOT_BOX_W + 3` is a boot-checked constraint so that a swept foot box touches at most 4 broadphase cells (2 per axis); a configuration violating it must fail the bound test."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-038
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Integer-semantics assumptions (`posmod`, GDScript integer-division truncation, float32 exactness of canvas offsets to 2^23, the `Performance.OBJECT_COUNT` monitor, directory-scoped warning levels) are unverified on 4.7.2 and gated by spike S2; a failure replaces the expression with a sign-split form or lowers `WORLD_COORD_LIMIT`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-039
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Hatch-cap safety is enforced by Assembly: a player-origin cut is rejected and a system-origin cut deferred while `actors_overlapping(cap_rects)` is non-empty, with no cut path bypassing that check; a forced direct detach followed by a refused BM4 ends the kernel in FAULTED with the actor unmoved."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-040
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "After every mutator call, including each that returned a FAULT_CODE or saturated, the block is consistent: `restore(snapshot())` accepts it, actor ids are unique and below `next_actor_id`, and every `body_id` in either table is live in Layout."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-041
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "`body.state` is excluded from Save/Load's `REBASE_BLOCKS` registry because its round trip is idempotent."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-042
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "A SIM hook may read Body's `moved` or `pos_prev` only if registered `after: [body.integrate]`; a lint rejects any other SIM reader, so the Controller's `controller.noise` sees the same tick's `moved`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-043
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Neighbour read contracts: Suit calls Layout `room_at(section_id, actor_local_px)` with section-local pixels and treats a NONE or plate-cell result as exterior exposure; Interaction reads `foot_boxes(body_id)` unfiltered and ascending including unbound seats; Emitter and Lighting anchor on floored `pos_curr`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-044
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Body state is independent of render zoom: identical streams at different ladder steps give identical `body.state` bytes, and `zoom`, `k_auto` and `field_h` appear only in the Presenter or projector directory."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-045
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "The projector's weld frame completes within a working threshold of 8 ms P99 over 100 repeated welds on RM-DESKTOP and RM-DECK release exports, with no frame in the window exceeding the machine ceiling (16.6 ms and 33.3 ms) and no orphaned body root nodes."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-046
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "CI performance gates for the hook are deterministic counts from instrumented `collide` and `section_at` wrappers (at most one `solid_in` query per moving actor, bounded rectangle tests, bounded `section_at` calls); wall-clock P99 is a nightly benchmark failing at +25% over the S1 baseline per machine."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-047
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "In MIRROR mode, host snapshots carry `pos_curr`, `body_id`, `seat`, `kind`, `odometer`, `last_octant` and `sub` but not `blocked`, `moved`, `actor_section` or diagnostics, and `body.integrate` does not run on MIRROR (deferred to Vertical Slice)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-048
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Transfers (BM3, BM4, BM5) change only `body_id`, `pos_curr`, `pos_prev` and `sub` of an actor row, and leave `controller.state` bytes (carry_ref, DEAD state) identical; a same-tick Controller write after a pod hop must not displace the arrival cell."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-049
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "The Pipeline treats `BODY_TRANSFER{weld | detach}` carrying `frame_delta_px` as a camera rebase (shifting follow state and history), not a cut, so the avatar's screen delta on a weld or cut tick is 0 px unless new-body camera limits clamp, in which case it is a cut, never a pan."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-shipbody-050
  system: shipbody
  gdd: design/gdd/ship-body-and-interior-physics.md
  requirement: "Restore-time motion continuity requires the Controller Adapter's input resync to land in P2 of the first post-restore tick; a later resync resets `sub` once (at most 255/256 px loss), and restore with no key held resets `sub` as a stop does."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-001
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Assembly registers exactly five command types (`begin_weld`, `begin_seam_cut`, `weld`, `seam_cut`, `install_module`) and no others (`remove_module` stays unregistered)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-002
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "`weld` and `seam_cut` are SYSTEM-origin only (allowed_origins = SYSTEM) with payload exactly `{actor, target, cause}` (no `q`, plan or mode), and their `max_age_ticks` equals `PENDING_TTL_TICKS` (8-119, default 12)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-003
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "A weld/cut is two-phase: `begin_*` opens an Interaction channel and mutates no ship state; `assembly.step` hands off on DONE and submits the completion; the completion applies in P2 of the next tick (e.g. begin 437039 -> apply 437400 for D=360)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-004
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "The same predicate body and reason order is evaluated at three sites (begin validate, handoff pre-check, completion validate), and the completion `validate` is the only authoritative site; declared skips are only those in T2a (e.g. `BUSY`, `NOT_DOCKED`, `CUT_STRANDS`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-005
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Every completion `apply` is atomic and no-rollback: it calls published mutators in fixed order (weld: Graph M2 -> Layout LM2 -> Body BM3 -> Interaction `sync_section` x2 -> `assembly.state`; cut: M3 -> LM3 -> BM4 -> `sync_section` x2 -> state), emits one P5 notification batch, and Body mutators never precede their Layout mutator (`BDY_PLAN_MISMATCH`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-006
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Assembly writes exactly one block (`assembly.state`); every other state change goes through a mutator published by the owning system (Graph, Layout, Body, Suit, Controller, Interaction)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-007
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Every Class A mutator Assembly calls returns a status (`OK` or `FAULT_CODE`); `apply` checks it after every call, calls `ctx.fault(code, detail)` and returns `ctx.complete()` on first non-OK, and never relies on throw/assert (GDScript has none; assert is stripped in release)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-008
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "All kernel-invoked Assembly callables (`validate`, `apply`, `assembly.step`, `snapshot`, `restore`, `post_restore`, `default_state`, `read_view`) take the kernel `ctx` and have `return ctx.complete()` as their only return statement."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-009
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "A read-only cross-block verifier checks INV-1..INV-7 and INV-10: all eight hard in `post_restore` (restore fails to FAULTED on violation; INV-6 `BODIES_LIVE_MAX` half warn-only), and INV-1/2/4/5/7 after each weld/cut apply in release builds."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-010
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "`assembly.step` is a hook (divisor 1, offset 0, after `interaction.step`) that reads only `assembly.state` and `channel_view`, iterates seats in ascending PlayerId, submits at most one SYSTEM command per seat per tick, and uses no wall-clock, RNG or dictionary-order dependence."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-011
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "`assembly.state` is a SIM block (`persist true`, scope WORLD, SHARED keyed by PlayerId, `SHARED_SUMMARY`, schema_version 1, `restore_after [layout.state, graph.state, interaction.state, body.state]`) holding per-seat `pending` and `last_result` plus the reserved CASCADE deferral record, and no channel progress or world history."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-012
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "`snapshot()` writes every seat's `pending` as NONE (restore-idempotent, byte-identical re-snapshot) and `last_result` is runtime-only (outside snapshot, hashes and Save/Load payload); a save taken in the `pending` window (up to ~13 ticks) loses the in-flight completion, which is never replayed."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-013
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "64-bit tick values (`T`, `submit_T`, `welded_at_T`) are stored as two 32-bit ints or strings and never as JSON numbers; the block uses no packed-array fields and dirty keys are marked explicitly in every mutator (Godot 4.7 packed-array element setter change)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-014
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Assembly publishes the pure read `last_shape_change_T()` (max of Layout `welds[].welded_at_T/cut_at_T`) for Save/Load to poll, event names `ASSEMBLY_WELD` / `ASSEMBLY_CUT`, and never calls Save/Load."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-015
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Assembly publishes pure read `ragged_breach_open()` (keep-side venting or uncapped ports within `RAGGED_WITHHOLD_MAX_TICKS` 2400 of a RAGGED cut); the `ASSEMBLY_CUT` event autosave is withheld while it is true, and the interval save is soft-gated, bounded by `AUTOSAVE_MAX_DEFER_TICKS` 7200."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-016
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Weld apply is integer arithmetic only: no RNG and no wall-clock inside any Assembly apply or hook (replay and MIRROR identity)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-017
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Weld/cut channels live in `interaction.state` as IA-14 records with `owner_system = ASSEMBLY`; Assembly runs no clock of its own; durations are `WELD_CHANNEL_TICKS` 360 and `SECTION_CUT_CHANNEL_TICKS` 240 (data-driven, multiples of `GRAPH_STEP_TICKS` 6, range 240-480)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-018
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "No PLAYER-origin `validate` (`begin_weld`, `begin_seam_cut`, `install_module`) may read node/edge `hp`, `state`, `forced_mode`, `served_pm`, or call full `can_join` / `check_install_module`; only `can_join_static` is allowed (P4 truth-oracle lint); `weld_offer` additionally calls no `can_join*` or node accessor."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-019
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "DEFERRED reasons (`PORT_ABSENT`, `SLOT_OCCUPIED`) are evaluated only in the SYSTEM-side apply (step A0 / `check_install_module`); on failure `apply` writes `BLOCKED`, clears `pending`, mutates nothing else, and is an Applied command, not a fault."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-020
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Weld quality `q = WELD_Q_DEFAULT` (850) is a data constant clamped to [`Q_MIN`, 990] (diagnostic `MSA_Q_CLAMPED`), is never an input and never reaches any player-visible string or UI path."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-021
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Cut mode (SEALED / RAGGED) is derived at apply from true seam positions via Graph `seam_view` (openings area 0, valves closed, breakers open), never chosen by payload, and passed identically to M3 and LM3."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-022
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "`MSA.CUT_BLOCKED` rejects a CHANNEL cut (at begin, handoff, completion) when Body `actors_overlapping` over the seam's two hatch rectangles is non-empty, and a CASCADE cut defers/abandons; the cutter's stance must lie outside the rectangles."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-023
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "The cut offer exists only when the seat's foot-origin section lies in the component that keeps its `body_id`, computed via Layout `detach_preview`; the detached piece persists as its own body, translates without rotation (`heading_q` 0) and Assembly never calls M4/LM4 (discard)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-024
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "`weld_offer` is a pure, cached-static-half, O(1)-`docked` hot-path read (per-call budget `MSA_WELD_OFFER_BUDGET_US`, 5 us `[UNV]`) gated on Body `docked(a, b, frame_shift_px)`; host/mate selection puts the HOME-kind section first."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-025
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Sockets are terminal: FREE -> WELDED -> CAPPED / CUT_OPEN, never back to FREE, changed only inside LM2/LM3; MVP supports exactly one weld-then-cut cycle."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-026
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Install is a TAP command whose apply order is Graph `check_install_module` -> M5 `install_module(slot_node_id, def_id, hp_start, hp_cap, patched_at_step)` -> Suit `release_carried` -> Controller `clear_carry_ref` -> `sync_section` -> state; it requires the Controller/Interaction carry carve-out for HARDPOINT subjects."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-027
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Assembly pushes nothing to the Attention web (Interaction pushes all TOOL/LOUD noise) and reads no `PERCEPTION_OUT` block (seam geometry, bead, cap plate, `CUT_BLOCKED` are truth channel)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-028
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Post-channel non-DONE outcomes show one cue per verb family with no reason text; presenter plays a cue only for the local seat, deduped by `(PlayerId, T)` within `OUTCOME_CUE_WINDOW_TICKS` 60, `last_seen` initialised on join/restore."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-029
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Performance budgets (Release, spike-measured): weld apply <= 0.5 ms, cut apply <= 0.5 ms, install apply <= 0.2 ms, `assembly.step` idle <= 0.02 ms, weld-frame P5 subscribers <= 8 ms, no frame > 33 ms; weld/cut assets preloaded and warm-up drawn at scene load; measured on a release export."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-030
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "The PROJECTOR / Emitter rebuild / Lighting / Trail rebuilds run as P5 subscribers after commit with writes disabled and coalesce to the latest committed state across catch-up ticks (`MAX_TICKS_PER_FRAME` 4)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-031
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Live body count is bounded by construction (`N(t) <= N0`); `body_count <= MAX_BODIES` 8 is hard, `<= BODIES_LIVE_MAX` 4 is warn-only (`MSA_BODIES_LIVE_WARN`); MVP worst case is exactly 4 (zero margin)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-032
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Per-seat state is a map keyed by PlayerId (never transport peer id), iterated ascending; multi-seat contention rules (`BUSY`, second completion -> `NOT_TAKEN`) are `[VS-B]` and out of the MVP gate, but the data shape is built in MVP."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-033
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Each weld, cut and install apply marks explicit dirty keys within a fixed per-block footprint (graph at most 4 keys, body at most 3, assembly at most 1 per changed seat), stays below MAX_DIRTY_KEYS 256 and never collapses any block to ALL."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-034
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "A weld or cut applied in P2 becomes visible to Graph hooks only at the next Graph hook after its topology refresh (propagate.power, atmo or failure by T mod 6), with no observable half-state."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-035
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "A weld that pushes the loaded Interaction subject count above MAX_EXPOSURE_SUBJECTS 192 counts IA_SUBJECT_OVERFLOW and reports a content lint defect but stays applied and never faults the kernel."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-036
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Divergence between the validate verdict and the apply-time re-check (MSA_VERDICT_DRIFT) or between predicted and returned frame_shift_px, moved sections or rects (MSA_SHIFT_DRIFT) is release-fatal and faults the kernel in every build."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-037
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "After an Assembly fault, restore returns a world hash-equal to the last written save and writes no save while FAULTED; maximum lost play is AUTOSAVE_INTERVAL_TICKS + AUTOSAVE_MAX_DEFER_TICKS - 1 (17999 ticks)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-038
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Load has two separate failure layers: a pre-check refuses an out-of-range assembly.state schema_version without touching the kernel, while a block restore() failure sends the kernel LOADING to FAULTED and makes no claim that pre-restore state survives."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-039
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "begin_weld and begin_seam_cut apply calls Interaction open_channel once and Controller set_channel_ref(actor, ASSEMBLY, channel_id, face_octant) once, with face_octant derived from the anchor offset, and change no graph, layout or body hash."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-040
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Weld and cut conserve every actor's integer absolute position, use frame shifts that are multiples of 24 px, and keep the canonical state_hash identical at every tick regardless of camera zoom level k, seat count or MIRROR role."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-041
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "A generated weld/cut property test runs 1,000 sequences from a committed fixed seed list with the verifier after every operation, asserting zero invariant violations, no id reuse, body count at most N0 and node/edge conservation; it is a gating nightly run."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-042
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "Boot verifies the _process-driven TickDriver runs at TICK_RATE 60 with a catch-up bound of MAX_TICKS_PER_FRAME 4 and refuses to start otherwise, because every Assembly duration assumes it."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-043
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "A toggle-hold input setting lets one interact press run a weld or cut channel to DONE with identical duration, noise and abort set to the held form; a second press or movement cancels with the same cause as releasing the key."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-044
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "A single headless lint harness (tools/lint/msa_lint.gd with allow-list files) runs in CI before the gdUnit4 suite, emits one LINT-MSA-n line per finding, exits non-zero on any finding, and covers source and data under assets/data/."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-045
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
  requirement: "The fresh weld bead, jambs and leaf appear in the first rendered frame whose committed tick is at least the apply tick with zero frames of delay, and no bead is drawn while welds[] has no row."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-assembly-046
  system: assembly
  gdd: design/gdd/modular-ship-assembly.md
