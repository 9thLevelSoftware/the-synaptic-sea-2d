  revised: ""
  status: active

- id: TR-lsg-009
  system: lsg
  gdd: design/gdd/life-support-graph.md
  requirement: "The step runs 12 fixed phases in order (power 0-3, atmo 4-7, failure 8-11); cascades queue in phase 10 and apply in phase 0 of the next run (one-hop latency), bounded by MAX_SPREAD_PER_STEP 32."
