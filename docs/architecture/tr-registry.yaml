  revised: ""
  status: active

- id: TR-lsg-007
  system: lsg
  gdd: design/gdd/life-support-graph.md
  requirement: "Iteration is by ascending slot over dense append-only arrays (tombstones, no compaction in MVP); sim code never iterates a Dictionary; each loop uses one Jacobi pass from a double-buffered start-of-phase snapshot, with no iterative solver and no catch-up."
