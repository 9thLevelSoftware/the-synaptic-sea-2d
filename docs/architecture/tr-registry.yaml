- id: TR-light-011
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "SOFT pools must be drawn to the latch-release radius `r_off` (published `r_off_px`) +/-1 px and never smaller than `r_lit_px`, so prompts appear exactly where the light visibly ends."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-012
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Drawn energy = `LIGHT_ENERGY_PER_PM x KIND_GAIN[kind] x output_pm`, then modifier chain, then governor; it must never exceed the first term (a lamp never renders brighter than the power served)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-013
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "At most `SHADOW_SLOTS_MAX` (6) shadow-casting lights; slots 1-4 are beam seats, 5 is the beacon, 6 by fixed eligibility rank; vacant seat slots are lent (`SHADOW_LEND_SPARE`, `LEND_SLOTS_MAX` 3) to wall-near lights."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-014
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "The occluder builder (PROJECTOR-class duty) builds LightOccluder2D from Layout `OccluderSource` rects with `version(section_id)` change detection (unconditional rebuild on restore), bounded by `OCCLUDER_POLYS_VIEW_MAX` 120, `OCCLUDER_VERTS_MAX` 12, `OCCLUDER_SYNC_BUDGET_US` 400."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-015
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Shadow origin must match the simulation's segment origin (foot, via `body.state` pos_curr / `occ_origin`) versus chest apex, with a spike-decided mechanism (preference B, A, D; C rejected)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-016
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Non-shadow lights are capped at `NONSHADOW_LIGHTS_MAX` 24 (lanterns a subset, `LANTERN_LIGHTS_MAX` 8); over-budget lights are demoted deterministically (priority, distance, emitter id) to an emissive stand-in drawn to the same edge, never dropped; emitters at output_pm 0 are outside the budget."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-017
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "A non-shadow light must not draw where the simulation's segment test calls a compartment dark; containment (mechanism C0 via lent slots, C1 fallback) bounds pools by OCCLUDES_LIGHT rects, with `PD1_EXCEPTION_MAX_PX` 24."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-018
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Light LOD tiers are pure functions of the committed field and window (`rho_field`, `rho_px`), never of measured frame time, so renders are reproducible; zoom rungs are never removed, only quality tiered."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-019
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Zoom is implemented via world viewport logical size, never `Camera2D.zoom`; all Light2D length members are in base px, independent of `k_z` under both passes; Lighting has no zoom handler."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-020
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Modifier contract is an ordered multiplicative permille chain (L0 base, L1 recipes, L2 Attention tell, L3 Horror disturbance, then governor last), fed by state that Attention/Horror publish and Lighting reads; submitters never call Lighting and no layer may change reach, `lit`, colour of the real edge."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-021
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Decoys are unlit additive/mix overlays on a dedicated mask bit, never shadow-casting, never lights or emitters, bounded by `decoy_budget` (`DECOY_MAX_CH` 0.85); no real light may read PERCEPTION_OUT for enabled/energy/color/scale/offset/pose (isolation lint)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-022
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Flash governor limits flashes (>=10% relative luminance pair) to `FLASH_MAX_PER_S` 3 per rolling 1 s per light, per region and on the frame mean, computed from modelled decisions, not GPU readback."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-023
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "`reduce_flashing` (default on for a fresh profile) makes deployables steady and arcs held glow while the beacon keeps its sweep; HR-15 low-vision raise is applied renderer-side per client."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-024
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Light-mask bit allocation (20 bits) covers per-body bits (`BODIES_LIVE_MAX` 4), colour/stand-in/decoy bits and z-bands; cross-body light degrades via `OTHER_BODY` stand-in."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-025
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "A single shared HullSurface ShaderMaterial carries the floor `out = max(albedo x ambient_eff, floor)` and total ShaderMaterial shaders must be at most five; ambient is delivered per section via indirection (ring/home table)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-026
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Emission glow uses the unshaded additive Emissive layer with `GLOW_HDR_THRESHOLD` (placeholder 1.3, must stay inside the D.8 interval); depends on `use_hdr_2d` and a world-viewport glow Environment (pre-tonemap glow since 4.6)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-027
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Light textures are greyscale 8-bit PNG, linear filter, with authored hard-edge bands and sidecar-measured edge radius; texture memory budget 5.8 MiB (pass A) / 19.4-25.9 MiB (pass B)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-028
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Light-system CPU cost must stay at or below `LIGHT_CPU_BUDGET_US` (1000 us P99 steady, 3000 us event frame) with node pools pre-allocated (`LIGHT_NODE_POOL` 53, `OCCLUDER_NODE_POOL` 240, `STANDIN_POOL` 90), measured on RM-DESKTOP and RM-DECK."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-029
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Startup assertions must fail boot with a named error for: invalid glow threshold interval, missing `use_hdr_2d` or glow Environment, NEAREST light-texture filter, more than five ShaderMaterial shaders, bad texture layout."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-030
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Darkness is never a gameplay cost or meter: no light meter, vignette, fog mask, darkness debuff or gamma/brightness slider is permitted."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-031
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Lighting is split into a pure, engine-free plan step and an apply step, so the plan can be run headless against a stub with an injectable clock and a recorded frame-time trace, and an incremental pass must equal a full reconcile (including the `ALL` collapse above `MAX_DIRTY_KEYS` 256)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-032
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Cosmetic randomness (gutter gaps and lengths, flicker) is a pure hash function of (emitter id, epoch) with no global generator and no `rng_derive` stream, so the sequence is reproducible after restore without being persisted."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-033
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "The Emitter State commit path must itself enforce flash spacing (`SWITCH_MIN_SPACING_TICKS` 12) and count a defect when committed switches would breach the 3 flashes per second limit, because a command-level spacing guard alone is proven insufficient under arming-latency jitter."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-034
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Ambient is computed per section from `mean_fixture_pm` over Graph-served fixtures only: self-powered fixtures (EMERGENCY lamp, dock status glow) are excluded from the mean, an empty section reads 20 permille, and the slew is bounded by `AMBIENT_SLEW_FRAMES`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-035
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Door occluders are derived continuously from Layout door `area`/`area_max` (leaf width `width_px` x (1 - area/area_max), no open-threshold constant), only Layout `OCCLUDES_LIGHT` rectangles produce occluders (never actors or horrors), and occluders must not be implemented as a TileSet layer."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-036
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Every drawable class must darken correctly at zero lights: the HullSurface `character` variant and LIGHT_ONLY sprites go near-black or undrawn, and a default-material sprite is forbidden because it would render full albedo in a dark room; the carrier choice is fixed by the combine probe."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-037
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Repeated LOADING, build, body swap, restore and LOADING cycles (100 in the test) must leave node, orphan-node and render-texture counts equal to cycle 1, and the light and occluder pools are rebuilt without leaking."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-038
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "All shader variants in the warm-up matrix are compiled during LOADING or TRANSIT_HOLD behind the hold quad so no variant compiles on first use in play; the Shader Baker effect is measured and recorded."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-039
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "GPU ms and VRAM ceilings (including the `hdr_2d` target at 8 bytes per pixel, the shadow atlas and glow buffers, per target and per pass) are recorded from RM-DESKTOP and RM-DECK measurement into the `project.yaml` performance block before epics are created."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-040
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Unverified engine capabilities (light-texture `offset`, per-item light cap, 20 canvas mask bits, `Light2D` under `size_2d_override`, `CanvasModulate` with unshaded items, engine light and shadow limits) are probed in the lighting spike and read back at startup; `LIGHT_NODE_POOL` above the read-back limit fails boot."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-041
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Content lints run per push and fail the build: non-shadow placements must pass the containment (C3) lint with spill at most 24 px, no view chunk may be overlapped by more than `LIGHTS_PER_ITEM_MAX` 12 lights, no compartment may share a view with more than 4 fault glows, and three lights over one emissive stamp fail the glow interval."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-042
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Containment mechanism is selected by config key `lighting.containment_mechanism` (`C0` default, `C1` fallback); any other value fails the run, and residual leak bounds are logged per build through `diag.contain_leak` counters that gate the build."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-light-043
  system: light
  gdd: design/gdd/2d-lighting-and-occlusion.md
  requirement: "Lighting exposes named `DIAGNOSTIC` counters (`contain_leak`, `decoy_overflow`, `occluder_overflow`, `cap_exceeded_by_protected`, `max_item_overlap`, `demotions`, `k_z`) read by the debug overlay, and every pooled light node carries an `emitter_id` meta resolving to exactly one read-view row; all diagnostic draws are excluded from release builds."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-001
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The system is split into three parts: Input Adapter (presentation, submits PLAYER-origin commands as peer 1, writes no block), Controller Sim (owns `controller.state`), Avatar Presenter (PRESENTATION, never submits); a lint verifies the Adapter writes no block."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-002
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "`controller.state` is registered as SIM, `persist=true`, `persist_scope=WORLD`, `scope=PER_PLAYER` keyed by PlayerId, `repl_hint=SHARED_SUMMARY`, holding intent, gait, committed aim, facing, loco_state, carry/channel refs, channel_face, chest point and hand point."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-003
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Ship Body owns ship-local integer position (`pos`, `sub`, `odometer`, `LocomotionStep`); Controller Sim owns intent/gait/aim/facing/loco_state/carry/channel (PC-14, pending TD ratification)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-004
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Adapter samples gameplay intents in its own `_process` (before the TickDriver, by process priority, not in the physics callback) so an intent submitted in frame N is applied in P2 and integrated in P3 of the same tick (one tick latency, never two)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-005
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Hook order is `suit.vitals` -> `controller.step` (divisor 1) -> `layout.doors` -> `body.integrate` -> `controller.noise` and `emitter.place`; Attention (divisor 6) integrates pushed noise; the order is asserted from the hook registry."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-006
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "`set_move_intent {octant 0..7|8=NONE, run}` and `set_aim {aim_angle int 1/4096 turn, live}` are intents with `coalesce=LATEST_PER_ACTOR_PER_TICK`, `max_age_ticks=30`; all other commands use `coalesce=NONE`, `max_age_ticks=120`; all use `actor_binding=OWNED_BY_ISSUER` with `actor_source`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-007
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Adapter sends `set_move_intent` only on change (8 octants, `MOVE_DEADZONE`=0.25, `OCTANT_HYSTERESIS_DEG`=5), submits it before any command in the same frame, and sends `set_aim` at most once per `AIM_SEND_INTERVAL`=3 ticks (<=26 commands/s total)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-008
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "No input buffering: `ACTION_BUFFER_TICKS`=0; a press during a channel is submitted and answered honestly (`BUSY`/`MOVING`), nothing is queued."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-009
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Adapter keeps `last_acked` per intent and resends its current value once, bypassing the change filter, on the five resync triggers (STALE reject, leaving PAUSED, LOADING->RUNNING, focus/gamepad return, body TRANSFER); focus or gamepad loss sends `set_move_intent {NONE}` and `cancel_channel`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-010
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Exactly one input context is active (`gameplay`, `chart_table`, `inspect_card`, `chat`); the context x action matrix governs which actions are live, and STAGGERED/DOWNED/DEAD/IN_POD force a return to `gameplay`; `chart_table` entry and `chat` entry cancel channels, `inspect_card` does not."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-011
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Game code reads named rebindable actions (StringName), never raw keys or `device == 0`; devices are identified by event type; per-context conflict checking applies."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-012
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Adapter publishes a presentation-local MenuInput event stream (NAV_DOWN/UP, ACCEPT, BACK, CLOSE, FOCUS_IN/OUT, DEVICE_CHANGED, POINTER) sampled on render frames with echo suppression, deadzone hysteresis, cardinal-axis rule and latch-until-released."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-013
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Movement is hand-rolled integer kinematics (`LocomotionStep`, pure RefCounted, 1/256-px fixed point, axis-separated 1-px AABB sweeps, diagonal 181/256) with no physics body and no CharacterBody2D; avatar position is a pure function of command stream and layout (deterministic for replay G3/G4)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-014
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Speeds are whole base px per tick: `v_walk`=2, `v_run`=3, `v_carry`=1; `v_max`=`v_run` must satisfy build invariants I1 (`LAG_CUT` > v_max*tau) and I2 (`v_run*TICK_RATE*FOLLOW_TAU + L_MAX <= 0.30*field_h`); the loader refuses data violating any of the 19 invariants, naming exactly the violated set."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-015
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Tick-expressed knobs (units `ticks` or `px/tick`) are invalidated by a `TICK_RATE` change, detected data-driven from the unit column."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-016
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Facing is recomputed every tick from committed state with a 2-quanta (1/128 turn) hysteresis and the six-level priority order (frozen / channel_face / running / aim-live / aim-idle moving / hold); a MIRROR client never recomputes facing or channel_face from aim."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-017
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Controller Sim publishes a SIM read view (`octant`, `run`, `gait_effective`, `aim_angle`, `aim_live`, `facing`, `loco_state`, `carry_ref`, `salvage_carry`, `channel_ref`, chest point, hand point); Attention and Horror read only `loco_state` and never other Controller state."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-018
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Four Class B mutators (`set_channel_ref(actor, owner_system, channel_id, face_octant)`, `clear_channel_ref`, `set_carry_ref`, `clear_carry_ref`) are the only cross-block write path; they take the shared `WriteScope`, report via `scope.fault`, reject `face_octant` outside 0..8, and callers propagate the status."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-019
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Every kernel-invoked Controller callable (`validate`, `apply`, `controller.step`, `controller.noise`, `snapshot`, `restore`, `post_restore`, `read_view`) receives `ctx` and ends in `return ctx.complete()`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-020
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "`snapshot()` normalises transient fields (`octant=NONE`, `run=false`, `channel_ref/channel_face=none`, moving loco_states written as IDLE) while `restore()` is a whole-block replace, so `snapshot(restore(snapshot()))` is canonical-byte identical; `controller.state` is not in `REBASE_BLOCKS` and restore verification is EXACT; integer vectors persist as ints or packed arrays, never `Vector2i`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-021
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The persisted payload contains no Adapter-local state (`last_acked`, hold timers, run latch, device, context, pre-play tokens)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-022
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "DEAD hand-off: the death stub makes exactly one `request_restore`, honoured only after Save/Load's epoch staging reports `EPOCH_DURABLE`; `loco_state` stays DEAD with no further transition and the seat accepts no commands."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-023
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "`give_up {actor}` (PLAYER origin, `coalesce=NONE`, `max_age_ticks=120`) is valid only in DOWNED solo (else `NOT_DOWNED`) and sets `death_tick := min(death_tick, T)`; `stagger {actor}` is SYSTEM-origin only, rejected `NOT_STAGGERABLE` in DOWNED/DEAD/IN_POD, and does not extend the lock."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-024
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Command authority: a command with `issuer_peer` not owning the actor is `Rejected(ACTOR_NOT_OWNED)` at P2 with no state change; no shared or assisted control exists; the Adapter attaches an opaque integer `correlation` and keys pre-play tokens by it; pre-play is body/sound only, never the effect or beam light."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-025
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Adapter never reads Sanity, Attention or PERCEPTION_OUT views (input mapping, deadzones, aim source are HR-6 anchors); the Controller's Suit read is `locomotion_cap` only; Sanity may never alter bindings, aim or movement."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-026
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Avatar Presenter writes only `frame`, `flip_h`, integer `position`, overlay `visible` and the Light2D `position`/`rotation`; never scale, rotation, skew, modulate or tweens on them; position is `floor(lerp(prev, curr, tick_alpha))` with zero fractional part; it contains no HOST/MIRROR branch."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-027
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Controller and body sources contain no forbidden time/RNG calls (`Time.get_ticks_*`, `get_process_delta_time`, `randi`, `randf`, `RandomNumberGenerator`) except allow-listed render-time timers in Adapter/Presenter."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-028
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Under co-op, `controller.state` and `body.state` replicate as `SHARED_SUMMARY`; the replicated `aim_angle` quantum may not exceed `FACING_HYSTERESIS` (64 units) or boot faults with `REPL_QUANTUM_TOO_COARSE{aim_angle}`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-029
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Per-component CPU sub-budgets (advisory, RM-DESKTOP and RM-DECK release export): Adapter <=0.1 ms/frame, `LocomotionStep` <=0.05 ms/actor/tick (2,000 rects), `controller.step` <=0.02 ms/actor/tick, Presenter <=0.1 ms/avatar/frame, diagnostics <=0.01 ms/tick."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-030
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Dev-only artifacts (`PC_*` diagnostics, `debug_overlay_*` actions, input logger) are absent from release exports, except Ship Body's `PC_FOOTPRINT_OVERLAP`; the ten `debug_overlay_*` actions are registered only under the dev feature tag and never appear in Settings or rebinding."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-031
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Raw mouse aim is computed once per frame from the render pipeline's published follow position `f_q` and screen-to-picture mapping (never `pose_q`), rounded once to 1/4096-turn units with `posmod`, so camera look-ahead cannot feed back into aim; the Adapter warps the OS cursor on zoom edges and aim-source handover to keep the aim unchanged."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-032
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "All `Input.*`, `InputMap`, `InputEvent`, `_input` and `_unhandled_input` use lives only in the Adapter's registered files (MenuInput publisher included); the Adapter hands cursor position and zoom edges to the pipeline root, which makes no Input read of its own, and a lint enforces this."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-033
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Key bindings use `physical_keycode` so non-QWERTY layouts keep WASD positions, multiple wheel events in one rendered frame coalesce to at most one `zoom_in`/`zoom_out` edge, and the OS cursor is hidden and confined in `gameplay` and released in `chart_table`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-034
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Every channel-owner hook registers `after: [controller.step]`; an interrupt (move intent, cap change, stagger, target invalidation, body transfer, restore) reaches the owner only as the Controller clearing `channel_ref` through state, never as a command result, and the owner aborts before accruing progress on that tick."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-035
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "`controller.step` detects a change of `body_of_actor` reported by Ship Body (pod hop, section detach) and on that tick clears `channel_ref`, `channel_face` and `channel_body`, sets `pos_prev == pos_curr` and resets `sub`; a weld that leaves the actor's body id unchanged keeps the channel."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-036
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "`controller.noise` pushes exactly one `push_stimulus(NOISE, actor, class)` per tick with class chosen by `loco_state` (WALK, RUN, CARRY) and none when Body's derived `moved` is zero, in non-locomotion states or from `controller.step`; BURDEN is pushed every tick while `salvage_carry` is set, at a data-driven `U_BURDEN`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-037
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The registered `controller.state` schema, its published read view and its snapshot payload must agree field by field (incl. `cap_seen`, `ramp_ticks`, `walk_ticks`, `last_octant`, `decel_k`, `stagger_end_tick`, `death_tick`, `channel_body`); `cap_seen` persists so a restore never re-fires the cap falling-edge stagger."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-038
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Render-time confirm-bar and tap-window timers advance by frame delta clamped to `CONFIRM_DT_MAX_S`, are frozen (effective delta zero) while the kernel is PAUSED, and resume where they stopped; idle animation frames advance from sim tick `T`, not wall time."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-039
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Controller and Presenter outputs (sim blocks, `set_move_intent`/`set_aim` submission logs, Presenter frame/position/light logs) are byte-identical across render cadences of 30, 60, 120 and 144 fps, across calm/tell/breach/sanity-stage fixtures, and with `aim_indicator` on or off; a recorded input-trace replay format is required."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-040
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Presenter writes only beam pose (`Light2D` position and rotation); 2D Lighting writes `enabled`, `energy`, `texture` and `color` from `emitter.state`, and the Presenter's pose write must precede Lighting's apply in the same render callback; a beam toggle press never changes light state before committed state does."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-041
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "`emitter.place` reads the beam origin from `chest_sim` in the Controller's SIM read view, unchanged by a Perception Filter substituting a horror rig for the local body; Presenter light origin, rotation and sprite position are likewise unchanged by substitution."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-042
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Adapter chooses the command for `interact` solely from Interaction's per-object declaration (`command_type`, mode TAP/HOLD_CONFIRM/CHANNEL) with no verb branch keyed on object class; candidates need reach, arc and Emitter exposure above threshold, and `ACTOR_SELF` verbs are submitted with own PlayerId as target through an `act_gate` exempt row."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-043
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Adapter publishes per-seat `confirm_view(seat)` and `glyph_view(seat, action)` read views that HUD plates (including the give-up plate) are driven by alone; the Adapter publishes no `input_ignored_view`, and ignored or rejected presses cause no HUD change or camera jolt."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-044
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The Adapter submits no intents or commands while the kernel is PAUSED and holds timers and channel progress unchanged; solo `chart_table` issues `request_pause` through the menu path while co-op opens an overlay with the kernel RUNNING."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-045
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "The automated suite needs a gdUnit4 headless harness where exit 101 (leaked orphan Nodes) counts as failure, seeded fixture vector files committed under `tests/fixtures/controller/`, and recorded contract fixtures under `tests/fixtures/contracts/` that every stub of Interaction, Emitter, Suit, Transit, HUD or Attention must pass."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-pc-046
  system: pc
  gdd: design/gdd/player-controller-input.md
  requirement: "Sprite sheet import fails, naming sheet, row and frame, when a `CHEST_POINT` entry has `|x| > 2`, a `HAND_POINT` entry has `|x| > 12`, or an avatar frame paints opaque pixels over the lamp-plate mask; the Presenter carries no runtime clamp."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-001
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Interaction registers one command type per verb (begin_patch, begin_cut, begin_cap, begin_crank, cancel_channel, set_breaker, set_valve, top_up, set_opening, pickup, drop, throw_glowstick, field_check, begin_harm, begin_revive), each with its own validate, reason subset, max_age_ticks 120, coalesce NONE, actor_binding OWNED_BY_ISSUER with actor_source body.state, allowed_origins {PLAYER} and not allowed_when_paused; `interact` is an input action, never a command type."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-002
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Command payloads are primitives only (a registered subject ref, a PlayerId, or aim_angle for throw_glowstick and the closed check_kind {SCAN}); a payload never carries a believed state, direction, verb choice or kind."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-003
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Only set_opening admits SYSTEM origin (failure-cascade door close); all other Interaction commands are PLAYER origin."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-004
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "The verb declaration table is data, one row per (object class, tool requirement) under assets/data/interaction/verbs/, and takes no sanity, Attention, rhythm, breach or device input (data-load lint); adding a verb is one data row, one handler and one registration line with an empty Adapter diff."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-005
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "select_verb is a pure function of (object classes, tool in hand, eligible predicate) and never of hp, state, forced mode or served power."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-006
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Every non-exempt PLAYER command validates act_gate(o) = in_reach(o) AND lit(o) against the exposure table committed at tick T-1; exemptions are exactly drop, toggle_beam, the inspect card of an already-lit instrument (plus actor verbs throw_glowstick and the ACTOR_SELF self-patch); an unregistered ref answers exactly as an unlit one."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-007
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "A reason depending on module body state (hp, state, forced mode, served power) is never returned at press time: the command is Applied, the full channel runs, and only then resolves to an outcome (NOTHING_TO_REPAIR, NOT_REPAIRABLE, STILL_HOT); immediate reasons are limited to geometry, light, the actor's own stock/state and the consequence channel."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-008
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "A channel is one record per seat in interaction.state, created by the verb's apply in P2 together with the Controller's set_channel_ref and advanced only by hook interaction.step, accruing from e=1 to D, with D mod GRAPH_STEP_TICKS(6) == 0 for every *_CHANNEL_TICKS (lint) and seats processed in ascending PlayerId."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-009
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "interaction.step runs `after: emitter.place` (reads tick T's exposure table) and re-checks lit and in_reach every LIT_RECHECK_TICKS (legal values 1,2,3,6; GRAPH_STEP_TICKS mod LIT_RECHECK_TICKS == 0) so no step is credited on an unlit or out-of-reach block end."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-010
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Every Interaction predicate and formula is integer-only, uses no RNG and no wall-clock, reads body.state.pos and the Emitter State table, and no physics query (Godot Physics 2D) is permitted anywhere in the system; throws use an integer direction table with no runtime trigonometry."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-011
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Interaction holds no scene-tree reference and never draws, subscribes to results or calls presentation; it exposes only the read views focus_view and channel_view."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-012
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "One in-progress job per (subject_ref, verb class) with classes REPAIR, SALVAGE, CAP, CRANK, CHECK, WELD, ACTOR_ACT; a second begin gets immediate BUSY, nothing queues, and a FULL step on a subject already at hp = hp_cap = HP_FULL resolves PRECONDITION(NOTHING_TO_REPAIR) consuming no part."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-013
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "cancel_channel cancels whatever controller.state.channel_ref names as (owner_system, channel_id); all channel records live in interaction.state regardless of owner, and owner-registered verbs (Assembly begin_weld/begin_seam_cut) create theirs via Class B open_channel(seat, owner_system, verb_id, target_ref, duration_ticks)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-014
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "interaction.state is a SIM block, persist true, persist_scope WORLD, scope SHARED with per-seat records keyed by PlayerId (never transport peer id), repl_hint SHARED_SUMMARY, schema_version 1, restore_after [layout.state, controller.state, graph.state, body.state, emitter.state]."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-015
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "The block persists the partial-progress ledger (MAX_PARTIAL_ENTRIES 16, PARTIAL_TTL_TICKS 600), FULL-job part records with grace entries (MAX_GRACE_ENTRIES 8, FULL_JOB_GRACE_S 60), throws[], loose[] (item instances), stubs[], last_salvage_T and id counters, plus per-seat last_result/prev_result."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-016
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "post_restore drops all in-progress channels (ABORT(RESTORE)), door attempts and last_result, resolves a RESERVED FULL-job part from the persisted blocks_done/t_last_block (released if 0, consumed if >=1), keeps ledgers/throws/loose/stubs, and re-registers all subjects idempotently before the first emitter.place."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-017
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Each loose[].inst is decoded in post_restore with Item DB from_array(a, graph_step_no); a wrong length, element type or failed validate_instance fails the restore with the closed reason INTERACTION_RESTORE_LOOSE_INSTANCE, leaving live state untouched and never clamping."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-018
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Interaction never touches carry_ref or suit.state.carried_id on restore, and writes interaction.state only through its own mutators, calling the Controller-published set_channel_ref/clear_channel_ref/set_carry_ref/clear_carry_ref (CR-9)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-019
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "focus_view(seat) and channel_view(seat) are pure, integer, enum/key-only (no strings, no node refs) read views computed after the tick commits and keyed by PlayerId; progress_pm and duration_class derive from declared duration and the player's own elapsed ticks, never from hp."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-020
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "channel_view.state is restricted to IDLE, CONFIRMED, PROGRESS; terminal results (DONE, ABORT, OUTCOME) are read only from last_result/prev_result (depth 2), edge-detected via monotone transition_seq/result_seq; the Assembly DONE handoff is a separate one-tick field."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-021
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "The HUD reads exactly four sources (focus_view, channel_view, Controller's input_view, local result-event record with no reason) and never interaction.state, node()/edge() or any PERCEPTION_OUT block; hold-to-confirm progress is Adapter-local, never in a simulation view."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-022
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Subjects register with Emitter State (E6) only while inside the registration window W (rooms within SUBJECT_WINDOW_HOPS of a bound body's room, one-hop hysteresis), recomputed at most once per tick in room-id order and on restore/instantiate/discard/dormancy; sync_section maintains the candidate table and dormant sections must unregister."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-023
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Subject budget: INTERACT_FIXTURE_BUDGET 120 + PLAYER_DROP_RESERVE 24 <= 144 (75% of MAX_EXPOSURE_SUBJECTS 192), lint-checked per window W_int(p) at every authored body position; runtime overflow is a content defect counted IA_SUBJECT_OVERFLOW; drop/begin_cut refuse OBSTRUCTED when subject_headroom() is insufficient."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-024
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "TOOL-class verbs call Attention push_stimulus(NOISE, source_ref, class) once per accrued channel tick (none on a non-accrued tick) and LOUD one-shots at cut completion, seam-cut DONE, vent apply, throw landing and berth apply, with relations 2<=U_TOOL<=6, U_LOUD>=30*U_TOOL and PARTIAL_TTL_TICKS <= 2*TAU_ATT_TICKS."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-025
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Class A Graph mutators M6-M9 and M11-M13 (and Class B M16 for top_up) are called only through their check_* validate counterparts, with physical result codes; module-body truth is read only inside the hook via node()/edge()."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-026
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Door set_opening validate uses Layout leaf_would_overlap and Ship Body foot_boxes(body_id) (unfiltered) for OBSTRUCTED/CLOSING_BLOCKED; PLAYER close pending times out at CLOSING_BLOCKED_TIMEOUT_TICKS, SYSTEM close has no timeout; TAP_REARM_TICKS >= door travel time."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-027
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Throw landing and drop placement use Layout integer geometry (clip_to_footprints, floor_tile_at, loose_slots) and spawn_deployable (E3); THROW_RANGE_TILES > GLOWSTICK_RADIUS_TILES and THROW_ARC_TICKS < ticks(GLOWSTICK_LIFE_S)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-028
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "The friendly-harm act is gated by Sanity's actor_sanity_below_harm_threshold eligible predicate, calls Suit apply_suit_damage with HARM_BP_PER_STEP per block against HARM_TOTAL_BP, and is live only with stub actors at MVP (begin_harm/begin_revive Vertical Slice B); HORROR subjects take no verb."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-029
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Pause stops the tick: no diegetic verb is admitted (PAUSED, never queued), channels do not advance and ledger TTLs do not age; stagger clears the channel, downed clears channel and carry, pod_hop aborts ABORT(BODY)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-030
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "A gameplay value (all tuning knobs) lives in data under assets/data/interaction/ as tick counts (never hardcoded; changing TICK_RATE invalidates them), and Interaction refuses stats, reason strings on screen, damage numbers beyond HARM_TOTAL_BP, cooldowns and rewards."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-031
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "The fifteen Interaction command types are registered at boot with coalesce NONE, actor_binding OWNED_BY_ISSUER, actor_source body.state, max_age_ticks 120 and not allowed_when_paused; none is named interact or use_item, and the Interaction public surface is exactly sync_section, place_loose and open_channel plus focus_view, channel_view and last_salvage_T (boot-registry test)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-032
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "interaction.step is registered with divisor 1, offset 0 and after [controller.step, emitter.place] using verbatim hook ids; it runs Class A mutators M6, M7, M11, M12 in P3 inside a kernel WriteScope, M13 only in P2 from set_opening, and the Graph reads a Class A change at the next multiple of 6 (lag 1 to 6 ticks)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-033
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Every write to interaction.state packed arrays marks its dirty key, and snapshot-restore-snapshot with all tables populated is byte-identical; replaying a command log twice yields identical state_hash on every tick."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-034
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "The FULL-repair part uses the Suit reserve_stowed / release_stowed / consume_reserved contract with a commit rule independent of module truth: released if cancelled before the first credited block, consumed after it; stock, cue_load and reserved bucket are identical across healthy and damaged runs at every tick, and no RESERVED record exists without a running channel."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-035
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "An item instance moves losslessly between Suit (release_carried, replace_tool), salvage yield, seeded placement (fresh_instance) and loose[] via place_loose(inst, section_id, pos_px), equal element for element to the Item DB item_instance_to_array form; loose positions are section-local and unchanged by weld or detach."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-036
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "World build order is build_section, Graph M1, Emitter E1, then Interaction sync_section; discarding a section unregisters all its subjects and drops its loose[], and a save with a throw in flight lands the stick on the same absolute tick with the same life_ticks, spawning the deployable at land_tick so the first lit table is land_tick + 1."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-037
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "SYSTEM set_opening retry for a blocked door is capped: a foot box held in a leaf for 300 ticks yields at most 2 SYSTEM commands per door and a 10-door cascade at most 20 in 300 ticks, with identical replay hashes; a door attempt window is 30 ticks and attempts[] and rearm[] are not persisted."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-038
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "The Interaction hook meets a release-export budget on RM-DESKTOP and RM-DECK under a worst-case load (4 seats, full ledgers, 16 throws, 12 attempts, a window recompute every 30 ticks, 10 SYSTEM door resubmits per tick): mean at most 0.10 ms, p99 at most 0.50 ms, max below STEP_BUDGET_MS, zero MAX_PROBES_PER_TICK use (lit() is a table lookup)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-039
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "No PERCEPTION_OUT block is reachable from any simulation validate, apply or hook, and no Perception Filter code path calls register_subject or submits a command; validate is verified with a Graph spy that fails on any node(), edge(), opening() or switch-position read."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-040
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Interaction exposes IA_* diagnostic counters (IA_REJECT, IA_CHANNEL_ABORT, IA_RESERVE_COMMIT, IA_SUBJECT_OVERFLOW, and others; IA_PHANTOM_PROBE development builds only) registered under the diag_panel_contract naming convention, each incrementing once per triggering edge, none readable by the HUD, none present in release builds."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-041
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "A field_check SCAN calls Sanity record_falsification zero times on every tick of the channel including the begin tick, exactly once on the terminal tick, and zero on abort, cancel or restore; interaction.state stores no result, and the call site lives only in interaction.step's completion branch."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-042
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Simulation outcomes are independent of presentation settings: changing zoom step or HUD scale mid-channel leaves state_hash equal to a control run, REACH_PX is evaluated in base pixels, and keyboard-mouse, gamepad and toggle-versus-hold policies yield identical command streams and channel_view series."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-interact-043
  system: interact
  gdd: design/gdd/interaction-system.md
  requirement: "Two commands applied on one tick (two throws, two seats on one subject) are processed in seq order with the second validate seeing the first apply; a press during a channel or a rejected press queues nothing (ACTION_BUFFER_TICKS 0), and a cancel_channel wins over a same-tick abort cause."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-001
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "The system registers no state block, no step hook and no command; the only members persisting across a Graph step are pooled scene-node refs, the last read_view poll cache and `diag_latch`; the whole trail set rebuilds bit-identically from one `ALL` plus `present_time`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-002
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Every trail visual property is a pure function of read_view fields (`failures()`, `compartment()`, `node()`, `edge()`), Layout geometry and `present_time`; no timer, fade, Tween, spawn stamp or smoothing accumulator exists."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-003
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "All trail nodes carry the TRUTH_PX PerceptionTag grade, read `SIM` only (never `PERCEPTION_OUT`), never call `true_value()`, and render bit-identically with the Perception Filter pass on or off."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-004
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Every drawn element corresponds to a Graph descriptor (key `(subject_kind, subject_id, mode, medium, anchor)`); no descriptor means no element, and no ambient or decorative mist/decal not backed by a fault may be drawn."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-005
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "All draw decisions (state, size_idx, chain, extent, reveal threshold, density, cover16, dull_step, glow_step, hue, band, anim frame, in-field test) are computed by one pure headless `RefCounted` resolver `resolve(descriptor, ctx) -> TrailSpec` with a `prepare_feed(descriptors, ctx)` pre-pass; the scene layer is a thin applier that decides nothing."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-006
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "The resolver's inputs are injectable seams (descriptor feed, geometry provider, present_time, settings, knob table in a data file, world_seed, logger sink, `hash_fn` defaulting to kernel `rng_derive`) and it references no autoload, clock or random function."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-007
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Notification handler only stores/unions key sets and returns; reads and draws happen in the next render callback; a union exceeding `MAX_DIRTY_KEYS` 256 or containing `ALL` is treated as `ALL`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-008
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "read_view is polled once per Graph step (detected by changed `step_no`, `GRAPH_STEP_TICKS` 6) into a per-step poll cache; extent, dullness and animation phase are read from the cache every frame because age fields and continuous flow/T dirty no key."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-009
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "On `ALL` (restore, derelict instantiation, >256 keys) the system performs one full re-read reconciled against the node pool within the same render frame, with logging thresholds (not cut-offs) `TRAIL_RESTORE_BUDGET_MS` 8 ms and `TRAIL_RECONCILE_BUDGET_MS` 4 ms."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-010
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "An idle render frame (no new step_no, no keys, no anim_frame change, no camera-field change) performs zero scene writes and zero resolver calls; pixel-neutral reducers (changed-property-only writes, retained draw lists, per-room batching) precede any degradation."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-011
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Trail extent is `min(edge length, GROW_PX_PER_STEP[sev] x grow_steps, [FREEZE only] frost_reach)` floored to integer base px, never below `MIN_EXTENT_PX`; `grow_steps` (frozen at isolation) and `mode_steps` come from the Graph's GA-T onset triple (`mode_since_step`, `mode_key`, `isolated_at_step`); all arithmetic integer."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-012
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "`GROW_PX_PER_STEP` must be integer, monotone non-decreasing, with [1] >= 1 and `V_WALK` 12 px/step < [4] <= `V_RUN` 18 px/step (placeholder 2/3/6/15)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-013
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Size is a function of `sev` only (s 48 px at sev 1-2, m 96 at 3, l 144 at 4, sev 0 nothing; PUDDLE follows volume tier) via distinct drawings, never sprite scaling, with chain taper by `TAPER_STAMPS`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-014
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Pixel integrity: nearest sampling, integer `floor` positions, no scale animation, rotation 0, binary alpha (0/255) on every sprite including mist, palette lock, hairlines/seams as sprites (never runtime line draws), minimum feature 2x2 px (1 px hairline composite excepted)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-015
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Static marks are stamps from three-size sheets chained as cap/run/tip/corner/terminal with the last piece revealed by integer threshold; density is a world-anchored 2x2-px dither (no partial alpha) so every client draws identical pixels."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-016
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Moving media are pooled stepped sprite frames at `TRAIL_ANIM_FPS` 12 indexed from `present_time` (never wall clock or tick); GPUParticles2D permitted only for BREACH/AIRFLOW venting after spike S1 proves floor-to-grid positions and binary alpha."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-017
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Draw bands: floor trails z+1 never Y-sorted; wall trails in the single Y-sorted wall layer z+10 at host-face sort origin; moving media in dust/particles z+30; no trail uses z 0 or +20, and all marks sit under the hull-floor material."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-018
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Trails are lit albedo marks with emissive layer only on scorch/arc/ember; the system writes no Light2D, registers no emitter or exposure, and supplies a descriptor-to-glow data table (`GLOW_BASE_PM[key]`, `SEV_GLOW_PM[0..4]`) consumed by Emitter State."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-019
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "No on-screen consequence-channel element (descriptor with medium != NONE, sev >= 1) is ever culled: the in-field test uses the polyline bounding box padded by one head cell, no distance or darkness culling is permitted, and cost pressure degrades moving media only (frame count, density, anim fps, far-hold), never stamps."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-020
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Budgets hold at every zoom ladder step k in [1, k_auto+2] and at 1080p/1440p/2160p: `D_FT` <= 38 draws (60 if Filter mask renders trails twice), `stamps_world` <= `TRAIL_MAX_STAMPS` 704 (log-only, node pool pre-sized to it), `TRAIL_OVERDRAW_MAX` 4; conditional on spike S2 (per-instance data route to CanvasItem shaders)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-021
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Per-instance reveal threshold, dull step, coverage rank and clock must reach the shader via a route proven by spike S2 (per-trail `_draw`, MultiMesh custom data or Sprite2D pool; fallback packs into instance COLOR/`_msk` G), and S2's result is recorded in an ADR before the first render story."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-022
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Variation (stamp variant, drip phase, fan flip) derives only from `rng_derive(world_seed, \"trail.vis\", (subject_id<<20) | stamp_index)` so all clients and restores draw identical trails; engine global random functions and RNG instances are lint-forbidden."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-023
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Trail visuals are deterministic across restore: nothing persists in this system (extent/dullness derive from the Graph-persisted onset fields), so a restored world appears already grown with no start-up animation."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-024
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "A gas leak (`1 LEAK/GAS`, `8 SEVERED/GAS`) at `intensity_pm` 0 and `27 PATCH_WEEP/GAS` draw zero pixels; the HISS acoustic channel is the tell and is not suppressed."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-025
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Trails are never drawn on a machine body sprite, gauge, inspect card or crewmate; scorch/shimmer/glow anchor to the descriptor's fitting or port and floor/wall marks (module-body channel is corruptible, trail channel is not)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-026
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "LIVE vs STILL is `intensity_pm` > 0 (or per-row LIVE predicate on node()/edge() true values for ids 2 and 3); rows 4/7/9/27 are DRAWN_STATIC; dullness (D.5 ramp of `mode_steps`) applies to static stamps only, live descriptors are capped at `DULL_STEPS`-2 (rows 7, 27 held there; 4, 9 uncapped), with `DRIED_AFTER_STEPS` >= 7500."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-027
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Non-dominant descriptors per subject (dominance by highest sev, ties to lowest mode) draw head stamp only at `MIN_EXTENT_PX` (except the seam weep, which uses `since_steps`); dominance is computed statelessly in the feed pre-pass and a MIRROR client derives it from summary `(mode, sev)` pairs."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-028
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Arc/ember flicker uses one shared world phase at `ARC_FLICKER_PER_S` <= `FLASH_MAX_PER_S` 3 with regional amplitude scaling by world-fixed arc count; \"reduce flashing\" (default ON) holds glow at `ARC_HELD_GLOW_PM` with four static spark-tip pixels; reduced motion holds each moving medium on frame 0 and never suppresses a trail."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-029
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "The two accessibility toggles are read-only through the `SettingsStore` seam (CT-18/CT-19) and the system owns no setting."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-030
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Anchor geometry (`anchor_geometry`, `room_surface`, corridor clearance) is taken from Layout (LY-8, LY-23, polyline axis-aligned, wall part first) in base px; a corridor narrower than the head cell is a Layout content error, never a runtime clip/clamp; the 144 px clearance is a free interval normal to the run."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-031
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Diagnostics are edge-triggered: each `(log_id, subject_id)` latches in `diag_latch` on the rising edge, writes one line, re-arms when cleared, and no draw/reconcile/selection path reads the latch."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-032
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Co-op MIRROR (VS-B, not MVP) consumes `SHARED_SUMMARY` descriptors `(id, mode, sev, alarm_eligible, intensity bucket, since_steps, mode_steps, grow_steps)` to produce identical presentation to HOST; MVP path is exercised via the descriptor-feed seam against a mocked summary."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-033
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Tests: resolver unit tests run headless under tests/unit/failure_and_trail/ against data-file fixtures (fx_cryo, fx_tell, fx_row_oracle, fx_steady, fx_mvp_worst, fx_design_max, fx_seam); rendered criteria run on a windowed `ft-render` job on RM-DESKTOP and RM-DECK."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-034
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Per-frame-class CPU budgets on RM-DESKTOP and RM-DECK release exports, nearest-rank p99 over at least 100 samples per class: idle 0.25 ms, pan 0.5 ms, animation flip 0.75 ms (0.25 ms if S2 makes the frame index shader-driven), step frame 1.5 ms, measured under a scripted V_WALK run of at least 600 Graph steps."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-035
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "All materials and shader variants of the table of record are instantiated by a load-time warm-up draw and the stamp node pool is pre-sized before the first descriptor resolves, so the first leak of a session costs at most 1.5x the median frame time (every one of 10 cold launches) and logs no compile event."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-036
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Every Graph descriptor id has a row in the table of record, enforced by a build-time lint; at run time an unknown id draws nothing and a record missing mode_steps or grow_steps draws the head stamp only, each writing one diagnostic per (log_id, subject_id) rising edge."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-037
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "The knob and constant tables are validated at data load or by lint, which refuse and never clamp: knob invariants, derived read-only values such as ARC_FLICKER_PER_S, A_HOLE_MAX and hole-threshold desync, and every registry constant cited by the GDD must equal design/registry/entities.yaml."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-038
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "The Graph must preserve a seeded onset triple (mode_since_step with matching mode_key) through phase 9, advance both onsets across a dormant interval (M19), and restart them on re-weld; the fixture loader rejects a mode_since_step seeded without mode_key."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-039
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "When the kernel is PAUSED, extent, animation frame index and all trail animation stay unchanged because every animated quantity derives from present_time, which must hold still while paused."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-040
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "All dirty keys of one Graph step (for example N/ with B/, or a LEAK despawn with its PATCH_WEEP spawn) are applied in a single render callback, so no frame shows new size with old reach or both or neither of a handover pair."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-041
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Emitter State derives FAULT_GLOW records from the trail glow table on the Graph tick of the descriptor and never later, capped at MAX_FAULT_GLOW 10 keeping highest sev with ties by ascending descriptor id; the trail emissive layer adds nothing to the exposure query."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-042
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "The system creates no audio node and waits on no audio; a trail's acoustic class is anchored at the same Layout-derived source position as its trail."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-043
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "No trail material may read the screen texture or displace UVs, keeping trail pixels independent of the Perception Filter and any screen-space pass."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-ftrail-044
  system: ftrail
  gdd: design/gdd/failure-and-trail-system.md
  requirement: "Mapping a 64-bit rng_derive result to variant, phase and flip indices must yield non-negative indices for every bit pattern, including all-ones and the sign bit alone, using the signed 64-bit semantics of GDScript."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-001
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "Suit registers exactly one state block `suit.state` (class SIM, persist true, persist_scope WORLD, scope PER_PLAYER keyed by PlayerId, schema_version 1, restore_after []) and exactly one step hook `suit.vitals`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-002
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "`suit.vitals` runs at divisor 6, offset 2, `after: [graph.propagate.atmo]` only (never after `emitter.place`), and the chain `suit.vitals` -> `controller.step` -> `body.integrate` -> `emitter.place` holds; boot fails on an unknown `after` id or a cycle."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-003
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "Per-seat data is keyed only by PlayerId (int) and item `def_id`; no peer_id, node path or engine object appears in the block."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-004
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "Each hook run processes bound seats in ascending PlayerId in the fixed order of SE-39 (skip unbound/DEAD, resolve room + pressure window, reconcile ledger, breath source, leak debit, cell drain, thermal, SCORCH/arc, ladders, derive outputs and dirty keys)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-005
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "Suit uses no RNG, no wall clock and no `delta`; all block fields are int32-safe integers or plain-data dictionaries (no floats), so drain, ladder and cue thresholds are deterministic and replayable."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-006
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "Suit's hook, mutators and block contain no `Node`; the system is scene-tree-free."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-007
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "The block persists reserve_mgu, breath_src, breath_src_change_seq, pending_draw_mgu, breath_starved, pending_extra_mgu, cell_ticks, thermal_load, integrity_bp, three rungs, hold counters, exo_pending, rf_warmth, p_age0/1, beam_shape, equipped_slot, tools, stowed, reserved, carried_id/carried, last_section_id/last_room_ref, and block-level data_rev; `prev_*` edge copies are not persisted and are rebuilt in `post_restore`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-008
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "Derived values (`locomotion_cap`, `vitals_state`, cue levels, `held_mass_g`, `stowed_mass_g`, `cue_load`, breath source) are computed on read and never saved."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-009
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "Save/Load contract per SL-15: plain-data `snapshot()` (no Vector2i, StringName keys, typed containers), two-phase `restore` returning `(ok, reason, detail)`, `default_state()`, restore-idempotent (`snapshot(restore(snapshot()))` byte-equal), hard failure never clamp."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-010
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "Restore failures use the closed reason set (`SUIT_RESTORE_SCHEMA_UNSUPPORTED`, `_FIELD_RANGE`, `_STOWED_OVERFLOW`, `_UNKNOWN_DEF`, `_BEAM_SHAPE`, `_CARRY_MISMATCH`, `_SEAT_UNBOUND`, `_DATA_REV_UNKNOWN`, `_INSTANCE_FORM`)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-011
  system: suit
  gdd: design/gdd/suit-and-equipment.md
  requirement: "A saved `data_rev` older than current and present in `assets/data/suit/rev_history.json` is rescaled (felt-fraction floor rescale of reserve/cell, reduced thermal/holds) with `suit_restore_rescaled`, not failed; newer or unknown fails `SUIT_RESTORE_DATA_REV_UNKNOWN`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-suit-012
  system: suit
  gdd: design/gdd/suit-and-equipment.md
