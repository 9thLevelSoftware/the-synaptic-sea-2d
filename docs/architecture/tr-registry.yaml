  revised: ""
  status: active

- id: TR-emitter-019
  system: emitter
  gdd: design/gdd/emitter-state-and-light-exposure-query.md
  requirement: "Illumination is a saturating integer sum `lux_pm = min(1000, sum c)` over SOFT/HARD curve classes with no ambient term; `act_lux_pm` sums only gates_actions emitters (beacon excluded); `lit(ref)` is hysteresis on act_lux_pm with LIT_ON_PM 150 / LIT_OFF_PM 120 and no dwell; emitter publishes r_lit_px and r_off_px."
