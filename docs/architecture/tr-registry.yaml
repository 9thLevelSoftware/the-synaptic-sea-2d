  revised: ""
  status: active

- id: TR-sanity-026
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Runtime data files under `assets/data/sanity/` must be listed in the export preset include_filter so the exported (template_release) build passes the same boot assertions as the editor."
