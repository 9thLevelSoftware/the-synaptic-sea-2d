  revised: ""
  status: active

- id: TR-sanity-027
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Debug force_stage/force_level live under `src/debug/`, are excluded from Release by file, registered only via runtime `load()` guarded by `OS.has_feature(<gate tag>)` with no static reference from shipped code, and no such symbol/path may appear in the Release PCK (CI scan)."
