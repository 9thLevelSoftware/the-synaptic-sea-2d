# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every GDD technical requirement.
# Prevents TR-ID renumbering across /architecture-review runs, which would
# break story references.
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a GDD requirement is reworded (same intent): update `requirement`
#     text and add a `revised` date. The ID stays the same.
#   - When a requirement is removed from the GDD: set status: deprecated.
#   - When a requirement is split or replaced: set
#     status: "superseded-by: TR-[system]-NNN" with the new TR-ID(s), quoted:
#     unquoted, the second colon makes the file invalid YAML.
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories (embed IDs in stories)
#             /dev-story (current requirement text before implementing)
#             /story-done (look up current requirement text at review time)
#             /story-readiness (validate TR-ID exists and is active)
#             /create-epics (trace requirements to ADR coverage)
#             /test-helpers (map requirements to tested systems)
#             /adopt (brownfield audit: is the registry there)
#             /create-architecture (reuses registered IDs in its baseline)
#
# ID FORMAT: TR-[system]-[NNN]
#   [system] = a short lowercase slug for the system. It is an alias: the
#   system's key (system_overrides and the like) is its GDD filename stem
#   NNN = three-digit zero-padded sequence per system, starting at 001
#
# STATUS VALUES: active | deprecated | "superseded-by: TR-[system]-NNN"
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. requirements: holds
#   a block list, or [] while it is empty. Each entry starts "- id: TR-..." with
#   the dash at column 0, as in the examples (or 2, the same for every entry);
#   its fields sit two columns past the dash. Quote a value that holds ": ". A
#   line in any other shape is reported as unsupported layout, with its number.

version: 2
last_updated: "2026-10-28"

requirements:
- id: TR-cmd-001
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "The simulation advances only in fixed steps of 1/TICK_RATE (TICK_RATE = 60 Hz, set-once) simulated seconds; all durations are integer ticks and the kernel never reads wall-clock time or `delta`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-002
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "A `TickDriver` (RefCounted, no scene tree) owns an integer accumulator in microseconds x TICK_RATE (TICK_UNITS = 1,000,000 per tick), is driven from exactly one PROCESS_MODE_ALWAYS node's `_process`, and runs at most MAX_TICKS_PER_FRAME (4) ticks per frame; the physics step is never the clock."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-003
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Lost time is dropped at end of frame and never fast-forwarded (LAG_FORGIVE_TICKS = 0); the accumulator is cleared on every transition into RUNNING and re-reads kernel state after each `step()`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-004
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Per-frame order is fixed by process priority: input adapter (0), TickDriver (1: boundary service, tick loop, forgiveness, result flush, paused service), presentation nodes (2), with a lint on process_priority values."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-005
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Kernel, driver, and every owner callable run on the main thread only; no Thread, WorkerThreadPool, or call_deferred into kernel code (lint-enforced)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-006
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Each tick executes phases P0 Begin, P1 Intake, P2 Dispatch, P3 Step, P4 Commit, P5 Notify, P6 Boundary services in order with no interleaving; subscribers see only post-P4 state."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-007
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Step hooks register (hook_id, owner, divisor, offset, after[]); the kernel topologically sorts them (ties by registration order then hook_id), a cycle or unknown id fails boot, and an `after` edge across non-coinciding hooks must declare `tolerates_stale`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-008
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Every state change enters as a plain-data command with kernel-stamped `issuer_peer`, `origin` (PLAYER/SYSTEM), `seq`, `submission_id`; these are never payload-borne and no constructor without `issuer_peer` exists."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-009
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "`submit()` is fire-and-forget (returns nothing, calls nothing); each command yields exactly one terminal result record (Applied/Rejected/Dropped/Faulted/Superseded) buffered and flushed at P5 and once per rendered frame in every kernel state; results carry reason codes, never display strings."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-010
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Command payloads pass a recursive Variant.Type whitelist (finite floats, depth <= 8, uniform dict key type, no Object/Callable/NodePath/RID) and `var_to_bytes(payload).size()` <= MAX_PAYLOAD (4 KiB) or are rejected MALFORMED."
  created: 2026-10-28
  revised: 2026-10-28
  status: active

- id: TR-cmd-011
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Block, command-type, hook, diagnostics-channel, and binding-source registration is legal only in BOOTING and frozen after; duplicate IDs, missing mandatory fields (allowed_origins, actor_binding, coalesce, max_age_ticks, class, gameplay, repl_hint, persist), hook cycles, and ACTOR_SOURCE_INVALID fail boot in every build."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-012
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "The kernel authority-checks every command at P2: origin allowed for type, and for `actor_binding = OWNED_BY_ISSUER` that (actor_source, actor) is in the binding table half_b of the issuer's PlayerId; single-player is host peer 1 -> PlayerId 1 with the same checks."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-013
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "The kernel rebuilds binding-table half (b) (PlayerId -> {(source block_id, entity_id)}) itself as the last step of every LOADING pass from registered binding sources in ascending block_id order; half (b) is never saved and conflicts fault LOADING."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-014
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Each state block has a single owner and registers schema_version, class (SIM/PERCEPTION_OUT), persist and persist_scope (WORLD/PROFILE), scope (SHARED/PER_PLAYER by PlayerId), gameplay, interpolated, repl_hint, and snapshot/restore/default_state/post_restore/read_view callables; persistent per-player state is keyed by PlayerId, not peer_id."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-015
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Entity IDs are allocated by the owning block's own counter and are unique only within the block; cross-block references are keyed (block_id, entity_id) and the kernel allocates none."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-016
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Snapshot payloads are deep copies of canonical state in deterministic order with no derived caches; restore copies in, replaces the whole block, migrates from stored_version, and never retains a reference to input data."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-017
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Snapshots are taken only at a tick boundary (P6), synchronously in memory in SAVING (atomic within one boundary service, never spanning a frame), cover all persist WORLD blocks at the same T, and restore replaces WORLD blocks atomically while leaving PROFILE blocks untouched."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-018
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "`kernel.clock` (T, world_seed) is the kernel's only registered block (SIM, persist, WORLD, never dirty); `restore_epoch` is owned and persisted by Save/Load (`slot_epoch.bin`), passed into `request_restore`/`request_new_game`, held read-only, exposed in the clock read view, and excluded from the snapshot header and all hashes."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-019
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "RNG is never global: each system draws from a named stream (counter in its block) via the kernel's pure `rng_derive(world_seed, stream_name, counter)` (and `rng_derive_epoch` for threat draws) using SplitMix64 mix64, pinned by golden vectors."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-020
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "State hash `state_hash(PERSIST, T)` uses H64 = first 8 bytes of SHA-256 via HashingContext over canonical_encode bytes (Packed arrays hashed as raw bytes), with a published `block_hash(block_id)` read; hash prefix is T |  | world_seed."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-021
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Blocks are written only by owner mutators inside a kernel-issued WriteScope during P2 apply or P3 step; writes elsewhere are refused in every build and counted WRITE_OUTSIDE_SCOPE; apply is validate-then-apply with no rollback and a reported fault moves the kernel to FAULTED."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-022
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Every kernel-invoked owner callable receives a `ctx`, reports results only via ctx (ok/reject/put/fault) and returns only `ctx.complete()`'s identity-compared CompletionToken (never `-> void`); a missing token is fault(INCOMPLETE), and the kernel never relies on exceptions or `assert` for control flow."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-023
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Change notifications are emitted once per tick at P5 as (block_id, tick, change_keys) with no state payload (collapsing to ALL past MAX_DIRTY_KEYS = 256); subscribers fetch via read views and are classed PRESENTATION / INPUT_SURFACE / PROJECTOR / REPLICATION / DIAGNOSTIC; an object owning a block or hook never subscribes."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-024
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Presentation, PROJECTOR, and DIAGNOSTIC batches in a multi-tick frame are merged and delivered once after the frame's last tick (union of change_keys), while INPUT_SURFACE and REPLICATION get every tick's batch; P5 iterates a pre-P5 snapshot of the subscriber list and prunes freed subscribers."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-025
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "PERCEPTION_OUT blocks are write-only to simulation: any sim-side read returns an empty view, increments PERCEPTION_READ_BLOCKED, and reports a violation; presentation holds no submit handle and sim never calls presentation."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-026
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Read views are getter-only facades or deep copies, never live containers; under STRICT_DEBUG a SIM_WRITE_TRIPWIRE hashes SIM blocks per dispatch batch and around P5 (TRIPWIRE_BUDGET_MS 1.0 ms, full sweep every 60 ticks)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-027
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Commands apply in ascending (queued_tick, host_order) with apply_tick >= queued_tick + 1 while running; from an initial snapshot, same PLAYER command stream plus control-plane request log and same (save bytes, restore_epoch) yields identical canonical hash at tick N on the same build and platform."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-028
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Control plane (`request_pause`, `request_resume`, `request_snapshot`, `request_restore`, `request_new_game`, `request_shutdown`) is a host-local API served at the next boundary in arrival order; `request_restore` may carry `expected_state_hash` and the kernel reports {T, computed_hash, match} without faulting on mismatch."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-029
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Kernel states BOOTING/LOADING/RUNNING/PAUSED/SAVING/FAULTED/SHUTTING_DOWN govern admission; LOADING and SAVING are atomic within one boundary service, submit in LOADING/SAVING/BOOTING is rejected NOT_ACCEPTING, and FAULTED never writes or autosaves over an existing save."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-030
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Pause is single-player only; while PAUSED only `allowed_when_paused` types (non-diegetic, writing only gameplay=false blocks named in `writes_blocks`) are dispatched via a paused service cycle (P1,P2,P4,P5,P6; no P3; T frozen), and all others are rejected PAUSED without queuing."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-031
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Queue bounds are boot assertions: MAX_CMDS_PER_TICK 128, QUEUE_CAPACITY 1024, PER_ISSUER_CAPACITY 256, `max_age_ticks(t) >= ceil(QUEUE_CAPACITY / MAX_CMDS_PER_TICK)`, and QUEUE_CAPACITY*(MAX_PAYLOAD+200B)+COMMAND_LOG_CAPACITY*(MAX_PAYLOAD+100B) <= COMMAND_MEMORY_BUDGET (16 MiB); overflow is QUEUE_FULL, never silent drop."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-032
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Performance: a quiet tick performs 0 canonical encodes and 0 kernel container allocations, a tick dirtying k blocks performs k encodes, P3 <= 2.0 ms P99 (STEP_BUDGET_MS 4 ms alarm), frame sim <= 4.0 ms (1 tick) / 6.0 ms (4 ticks) P99, and a 32-block snapshot captures in <= 16.7 ms, measured on release export on RM-DESKTOP and RM-DECK."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-033
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "The kernel is scene-tree independent (headless-testable, `Kernel.step()` synchronous), with KernelProfile (STRICT_DEBUG / LENIENT_RELEASE) injected at construction and never read from `OS.is_debug_build()`; no networking code at MVP (host-only ingress is local input)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-034
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Mode HOST ticks and applies authoritatively while MIRROR applies nothing, with an identical public API; blocks declare `repl_hint` (HOST_ONLY/SHARED_SUMMARY/OWNER_PRIVATE) now though unused until VS-B."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-035
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Blocks declare `restore_after`; a cycle or unknown id fails boot, `restore()` runs in DAG order, every `post_restore()` runs after every `restore()`, a `post_restore` failure faults LOADING without reverting, and registering more than MAX_BLOCKS (128) blocks fails boot."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-036
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Restore runs pre-checks before any `restore()` call and faults LOADING with pre-restore state intact on: unknown block_id (RESTORE_UNKNOWN_BLOCK), header TICK_RATE mismatch, restore_epoch >= 2^32, or a stored schema_version newer than code or older without migration; a missing persist block is set to `default_state()`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-037
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "A new game runs, inside LOADING and a WriteScope, every `default_state()`, then each owner's `init_world(world_seed)` in `restore_after` order, then `post_restore()`, then the binding rebuild; `init_world` never runs on a load from save."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-038
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Snapshots round-trip losslessly through `var_to_bytes`/`bytes_to_var`, and any JSON interchange form writes every 64-bit value (T, u64 hashes, seeds) as a `hex64` string, never a JSON number."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-039
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Canonical TLV encoding is injective after normalisation: dictionary key order is irrelevant, -0.0 equals +0.0, all NaN patterns are equal, StringName equals String, and INT and FLOAT differ; `state_hash(PERSIST)` covers WORLD-scoped persist blocks only while `ALL_SIM` covers every SIM block."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-040
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Block hashes are cached and invalidated only by `mark_dirty`; every verification path (G3/G4 tests, snapshot hash, diagnostics diff) uses uncached encoding; `block_hash(id, uncached)` returns `ok=false` with BLOCK_HASH_IN_WRITE during a WriteScope or BLOCK_HASH_UNKNOWN for unknown or non-persist ids."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-041
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "PERCEPTION_OUT blocks default to persist=false and are excluded from both `state_hash(PERSIST)` and `state_hash(ALL_SIM)`."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-042
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "The pending queue supports coalescing: `LATEST_PER_ACTOR_PER_TICK` keys on (type, actor, issuer_peer), a superseded entry is tombstoned and compacted at P0, a batch never holds two commands of one key, a rejected newer intent supersedes nothing, and a coalescing type allowing both origins fails boot COALESCE_DUAL_ORIGIN."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-043
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Sequence numbers are kernel-stamped per (issuer_peer, origin) space with `host_order` global and monotonic; only a test or remote ingress supplies `seq` (DUPLICATE_SEQ on repeat); `correlation` is echoed in results but excluded from canonical bytes and hashes; T, seq and host_order are 64-bit and never wrap, asserted at boot."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-044
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Admission evaluates terms in a fixed order and reports the first failing reason deterministically; remote issuers are rate-limited by a tick-based window (REMOTE_RATE_LIMIT per RATE_WINDOW_TICKS) that does not slide while PAUSED, the local issuer is never limited, and SYSTEM_RESERVE slots are reserved for SYSTEM commands."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-045
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Binding-table changes requested during tick T take effect at T+1 (every authority check in T uses the pre-change table), an unbound PlayerId's pending OWNED_BY_ISSUER commands are Rejected ACTOR_NOT_OWNED rather than dropped, and recreating a binding resets that issuer's seq counters while host_order continues."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-046
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Blocks flagged `interpolated` expose previous and current values for `tick_alpha` lerp; `commit_baseline` rolls only a derived cache outside snapshot and hash; resume, load and new-game call `snap_baseline` so previous equals current and tick_alpha reads 1.0 while PAUSED."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-047
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Input-to-first-visible-response latency on a 60 Hz tick and 60 fps release export must have median `L_first` <= 33.3 ms, p95 <= 50 ms, median `L_full` <= 50 ms and p95 <= 66.7 ms, with the acknowledgement visible in the press frame (provisional pending RM-DESKTOP spike)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-048
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "The command log is a bounded ring of COMMAND_LOG_CAPACITY (1024) entries holding command, result and tick, evicting oldest first with exactly one entry per result_id; replay uses the command log plus the control-plane request log."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-049
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "The DIAGNOSTIC class exposes read-only T, kernel state, queue depths, command log, resolved hook order and timings, rejection counters, lag counter and a state hash refreshed at DIAG_HASH_CADENCE_TICKS with hash_T and hash_algo; the Debug Overlay scene and DIAGNOSTIC entry point are excluded from release exports."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-050
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Test seams (`TestIngress.submit_raw`, `debug_set_counters`, stubbed diagnostics timer, `set_knob`) are excluded from release exports and verified by an export file-list symbol scan; runtime knob changes apply from the next tick."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-051
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Kernel structure is lint-enforced in blocking gdUnit4 tests under `tests/unit/kernel/lint/`: a Kernel member allow-list, no per-verb command classes, no kernel-registered domain types, no networking symbols (MultiplayerAPI, ENet, rpc), and no presentation references from sim code."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-052
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "Multiple Kernel instances coexist in one process with independent state, a block object bound to two kernels fails boot BLOCK_ALREADY_BOUND, and `Kernel.dispose()` is idempotent, empties the registries and leaves zero leaked RefCounted instances or orphan Nodes."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-cmd-053
  system: cmd
  gdd: design/gdd/command-simulation-layer.md
  requirement: "STRICT_DEBUG and LENIENT_RELEASE kernels fed the same command stream produce identical result records, final state and `state_hash(ALL_SIM)`; strict-only checks (command round-trip copy, SIM write tripwire) change only diagnostic counters."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-lsg-001
  system: lsg
  gdd: design/gdd/life-support-graph.md
  requirement: "The Graph is exactly one SIM state block `graph.state` (persist true, scope WORLD, SHARED, repl_hint SHARED_SUMMARY, schema_version 1, restore_after [layout.state]) registered during BOOTING."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-lsg-002
  system: lsg
  gdd: design/gdd/life-support-graph.md
  requirement: "Graph state is a struct-of-arrays `GraphState extends RefCounted` using PackedInt64/Int32/ByteArray only, with no Node, no Resource, no per-node objects, and underscore-prefixed fields written only by graph_mutators.gd, graph_propagate.gd, graph_restore.gd and graph_derived.gd (lint-enforced)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-lsg-003
  system: lsg
  gdd: design/gdd/life-support-graph.md
