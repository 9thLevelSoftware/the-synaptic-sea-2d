  revised: ""
  status: active

- id: TR-sanity-033
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "The SHARED_SUMMARY replication projection of sanity.state, and the sanity_view query, expose exactly {stage, tell_on, harm_eligible} with no raw level or counter; sanity.ledger and sanity.perception contribute no key to the replication adapter."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-034
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Sanity publishes read-only accessors ledger_listed(player, lie_id) and reach_lie_active, which must always agree with sanity.perception membership (including the away flag and after restore) and must not alter any SHAPE key set or the state hash."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-035
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "A WriteScope audit hook must show every write made by the hook, record_falsification, record_harm_event and the debug controls targets a block id beginning with `sanity.`, and no other registry entry (command, input surface, PLAYER-origin) is written."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-036
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "A mutator called on a tick not aligned to the 5 Hz hook (T mod 12 not 0) stamps absolute runs as T div 12 + 1, writes its ledger effect immediately so state_hash matches a control at every tick, and updates sanity.perception only at the next hook run (at most 11 ticks later)."
