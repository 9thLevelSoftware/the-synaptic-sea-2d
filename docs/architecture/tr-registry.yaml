  revised: ""
  status: active

- id: TR-sanity-028
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Perf: on RM-DESKTOP and RM-DECK release export with 4 seats and 14 eligible subjects per compartment, the Sanity step median is <= 0.5 ms and max <= 2 ms (ratcheting), with zero Performance.OBJECT_COUNT and static memory growth."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-029
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Snapshot dirty keys per run stay under MAX_DIRTY_KEYS 256 and snapshot size is bounded over a 60-minute 4-seat soak (visit map bounded by the number of registered lie-capable subjects, at most 196 per seat in the MVP slice)."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-030
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "CLASSES_ENABLED is a data bitmask (a=1, b=2, c=4, d=8) with MVP = {b}; classes a/c/d are implemented and testable with stubs but disabled, and turning class (b) off lets live lies expire normally with no snapshot format change."
  created: 2026-10-28
  revised: ""
  status: active

- id: TR-sanity-031
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Sanity reads upstream systems only through published views and queries, and the lit-entry lookup may call exactly actor_section, actor_local_px, room_at, compartment_of_room or compartment_at, nodes_in and lit; a write-spy on Attention, Graph and Emitter must record zero writes."
