  revised: ""
  status: active

- id: TR-sanity-023
  system: sanity
  gdd: design/gdd/sanity-and-hallucination-rules.md
  requirement: "Sanity registers no command, no INPUT_SURFACE and no player-origin anything, and submits no SYSTEM command."
