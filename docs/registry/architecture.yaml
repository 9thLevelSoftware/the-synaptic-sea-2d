# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: kernel_autoload_or_global
    status: active
    description: "No autoload, static variable or group lookup exposes the kernel, a block or a read view. The composition root injects the narrowest facet each module needs through setup()."
    why: "Hidden dependencies, shared state between headless tests, and no second kernel for MIRROR or replay comparison."
    adr: docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
    referenced_by:
      - docs/architecture/adr-0006-save-container-generations-versioning-and-restore-epoch.md
      - docs/architecture/adr-0009-presentation-subscriber-contract.md
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: physics_callback_tick_source
    status: active
    description: "No kernel, simulation or presentation script defines _physics_process or _integrate_forces, and nothing is coupled to physics_jitter_fix or max_physics_steps_per_frame."
    why: "Two accumulators drift; the simulation has no physics body; the kernel GDD rejected it."
    adr: docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
    referenced_by:
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: cosmetic_phase_from_tick_counter
    status: active
    description: "Cosmetic animation phase uses present_time, never the tick counter; simulation-computed values use the committed tick."
    why: "Keeps pause, reduced motion and render rate from changing simulation-visible values."
    adr: docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
    referenced_by:
      - docs/architecture/adr-0009-presentation-subscriber-contract.md
    added: 2026-10-28
  - pattern: await_process_frame_in_sim_or_presentation
    status: active
    description: "src/sim and src/presentation code does not await get_tree().process_frame; waiting is expressed in ticks or present_time."
    why: "That signal fires outside the per-node process_priority ordering (UNVERIFIED), outside the adapter-driver-presentation order."
    adr: docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
    referenced_by:
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: command_constructed_outside_kernel
    status: active
    description: "Command.new() is called only inside src/kernel/ (_admit); issuer_peer, origin, seq and submission_id are never read from or written to payload data."
    why: "The stamped fields are the authority boundary; GDScript has no private constructors, so a run-time seal and a CI check enforce it."
    adr: docs/architecture/adr-0002-authority-model-and-command-pipeline.md
    referenced_by:
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: presentation_submit_without_handle
    status: active
    description: "Only the objects named at handle issue hold a SurfaceHandle or ControlHandle; subscribing as INPUT_SURFACE does not confer submit rights; SYSTEM commands are submitted only through ctx.submit_system inside a tick phase."
    why: "Presentation never writes the simulation (kernel H4); co-op must add ingress without changing owners."
    adr: docs/architecture/adr-0002-authority-model-and-command-pipeline.md
    referenced_by:
      - docs/architecture/adr-0004-change-notification-and-dirty-keys.md
      - docs/architecture/adr-0009-presentation-subscriber-contract.md
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: peer_id_keyed_persistent_state
    status: active
    description: "Persistent per-player state and ownership are keyed by PlayerId; the peer id appears only in the ingress stamp and binding table half (a). Ownership is never derived from scene-tree node authority."
    why: "Peer ids change on reconnect and host change; a copied save or re-join must keep its characters."
    adr: docs/architecture/adr-0002-authority-model-and-command-pipeline.md
    added: 2026-10-28
  - pattern: write_outside_writescope_or_setter_dirty
    status: active
    description: "No block is written outside a kernel WriteScope (APPLY, PAUSED_APPLY, HOOK, INIT, RESTORE); every mutator begins with scope.open_for; dirty keys are marked only through scope.mark_dirty, never from a property setter."
    why: "Kernel CR-9 write discipline; 4.7 packed-array element writes no longer call setters, so setter-based dirty tracking silently misses changes."
    adr: docs/architecture/adr-0003-state-block-registry-and-owner-contract.md
    referenced_by:
      - docs/architecture/adr-0004-change-notification-and-dirty-keys.md
      - docs/architecture/adr-0005-determinism-keyed-rng-canonical-encoding-and-hashing.md
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: void_or_value_returning_owner_callable
    status: active
    description: "No kernel-invoked owner callable is declared -> void or returns a domain value; each is -> CompletionToken with return ctx.complete() as its last statement; outcomes go through ctx."
    why: "An aborted GDScript function returns a default the caller cannot tell from a result; the completion sentinel is the only release-build abort guard."
    adr: docs/architecture/adr-0003-state-block-registry-and-owner-contract.md
    referenced_by:
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: block_as_resource_or_node
    status: active
    description: "State blocks are RefCounted plain data held by their owner, never a Resource or Node; restore copies into the existing block object."
    why: "Save-file trust (a .tres can embed scripts), canonical serialisation, scene-tree independence (H10), and long-lived read-view facades."
    adr: docs/architecture/adr-0003-state-block-registry-and-owner-contract.md
    referenced_by:
      - docs/architecture/adr-0006-save-container-generations-versioning-and-restore-epoch.md
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: content_directory_scan
    status: active
    description: "Game code never enumerates res://assets/data with DirAccess; every data file is read by an explicit path from a committed, sorted manifest whose case matches the file on disk."
    why: "Listing order and names differ between editor and export; a stray file would load silently; Windows is case-insensitive, the package and the Deck are not."
    adr: docs/architecture/adr-0007-static-content-data-pipeline-and-stable-type-ids.md
    referenced_by:
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: mutable_or_resource_catalog
    status: active
    description: "No content catalog is a Resource, Node, autoload or static singleton, and none hands out a mutable container: arrays are read-only typed Array[T] stored once; packed arrays and per-call duplicate() are never returned."
    why: "Catalogs are shared by validate, P3 and presentation; packed arrays pass by reference and cannot be made read-only; duplicate() allocates (AC-69); many catalogs must coexist for tests and MIRROR."
    adr: docs/architecture/adr-0007-static-content-data-pipeline-and-stable-type-ids.md
    referenced_by:
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: position_derived_persisted_id
    status: active
    description: "No id that reaches a save, snapshot, hash or replicated record is an array index, file or manifest position, Dictionary order, path hash or ResourceUID; item type_id never reaches one; ledgers are append-only and retired ids are never reused."
    why: "Ids must keep their meaning across builds; a renumber would silently load the wrong def from an old save."
    adr: docs/architecture/adr-0007-static-content-data-pipeline-and-stable-type-ids.md
    added: 2026-10-28
  - pattern: loader_side_effect_or_foreign_boot_code
    status: active
    description: "Content loaders return Array[BootError] with domain-2 codes from ContentFaults; they never call assert, push_error or quit, and never raise a content boot error from an owner system's own *_faults.gd."
    why: "assert is stripped in release, push_error trips gdUnit4, quit is untestable; one domain keeps src/data free of imports from Core and Feature fault files (ADR-0003 domain 2)."
    adr: docs/architecture/adr-0007-static-content-data-pipeline-and-stable-type-ids.md
    referenced_by:
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: kernel_signal_notification
    status: active           # ADR-0004 is Proposed
    description: "No engine signal carries kernel-to-subscriber change notification: src/kernel declares no signal for it, nothing connect()s to a kernel object, and subscribers register only through the class-bound NotifyFacet (presentation: PresentationFacet.subscribe). Engine signals remain legal inside presentation."
    why: "A signal returns nothing (no completion token, no per-subscriber INCOMPLETE), has no class cadence or block filter, and hides dead subscribers; OQ-4 decided on semantics."
    adr: docs/architecture/adr-0004-change-notification-and-dirty-keys.md
    added: 2026-10-28
  - pattern: lambda_or_retained_batch_subscriber
    status: active           # ADR-0004 is Proposed
    description: "A subscriber handler is a standard method Callable on a long-lived object with the signature (batch: ChangeBatch, ctx: NotifyContext) -> CompletionToken; never a lambda or .bind() result, and never retains a ChangeBatch, a kernel key buffer or an event object past the handler call (copy into a DirtyAccumulator)."
    why: "Probed 2026-10-28: lambdas and bind results are custom Callables (a non-capturing lambda reports the script as get_object(), a self-capturing one the creator, and it keeps self alive); the batch is a reused facade re-armed every delivery."
    adr: docs/architecture/adr-0004-change-notification-and-dirty-keys.md
    added: 2026-10-28
  - pattern: await_in_subscriber_handler
    status: active           # ADR-0004 is Proposed; lint is ADR-0010's PRES rule
    description: "A subscriber handler, and anything it calls, never awaits; it returns the armed CompletionToken synchronously."
    why: "A handler containing await returns a coroutine state object, not the token (recorded INCOMPLETE); the continuation resumes after P5 holding a poisoned ChangeBatch and a re-armed NotifyContext."
    adr: docs/architecture/adr-0004-change-notification-and-dirty-keys.md
    added: 2026-10-28
  - pattern: non_integer_or_undeclared_dirty_key
    status: active           # ADR-0004 is Proposed
    description: "A dirty key is an int (KIND << 32) | id built from integers, KIND declared in the block's KeySpaceDescriptor; never a String, StringName, float or Variant, never an id above 32 bits, never key 0 or NO_KEY; events carry only ints and never state."
    why: "No String is built per key per run (Graph LS-20, ADR-LSG-06); NO_KEY is the buffer sentinel; notifications carry no state (CR-10)."
    adr: docs/architecture/adr-0004-change-notification-and-dirty-keys.md
    added: 2026-10-28
  - pattern: perception_out_subscribe_without_access
    status: active           # ADR-0004 is Proposed
    description: "A subscription to a block whose read class is PERCEPTION_OUT is refused (SUBSCRIBE_REFUSED) unless the issuing facet carries perception_access = true (only the Perception Filter's PresentationFacet and DIAGNOSTIC facets)."
    why: "Dirty-key ids leak the timing and identity of perception changes even when the read is blocked."
    adr: docs/architecture/adr-0004-change-notification-and-dirty-keys.md
    added: 2026-10-28
  - pattern: owner_canonical_byte_writer
    status: active           # ADR-0005 is Proposed
    description: "Canonical byte writers (encode_s64, encode_u32, encode_double, to_byte_array) and hashing of a var_to_bytes result are forbidden in src/kernel/, src/sim/ and block owners; owners deliver a plain Dictionary/Array/packed-array payload through snapshot(ctx) and the CanonicalEncoder encodes it. They are allowed in src/shared/det/ and tests; src/save/ may use them for container byte layout, slot_epoch.bin and integrity hashes (payload_sha256, trailer) whose output never feeds H64 or state_hash."
    why: "One injectivity argument, one set of golden vectors, one diff tool; per-owner layouts diverge on float, string and tombstone handling. Container layout and integrity hashing are not state hashing."
    adr: docs/architecture/adr-0005-determinism-keyed-rng-canonical-encoding-and-hashing.md
    added: 2026-10-28
  - pattern: stringname_sort_for_canonical_order
    status: active           # ADR-0005 is Proposed
    description: "StringName is never passed to Array.sort() or compared for order in simulation, kernel or hashing code; convert with String(k) first. sort_custom, and any sort over keys that can tie, is banned in sim: pack the key and a stable id into one int and sort the ints."
    why: "StringName.sort() is not lexical and not a function of text (probed 2026-10-28: [&b,&a,&c,&aa,&B] sorted to [&c,&a,&b,&B,&aa]; intern-order based, may change between runs); the sort is not stable."
    adr: docs/architecture/adr-0005-determinism-keyed-rng-canonical-encoding-and-hashing.md
    added: 2026-10-28
  - pattern: global_rng_or_engine_hash_in_sim
    status: active           # ADR-0005 is Proposed; the token list itself is ADR-0010 SIM-02 and the DET rules
    description: "No global RNG token (randi, randf, randf_range, randi_range, randomize, seed(, RandomNumberGenerator, shuffle, pick_random), hash(), get_instance_id() or ResourceUID in src/sim, src/kernel or any presentation file whose output a save or test can observe; randomness is RngFacet streams, variation is Ihash. Iterating a Dictionary without sorted keys is banned."
    why: "Global generators and engine hashes are not a stable contract and depend on call order; unsorted iteration depends on insertion history."
    adr: docs/architecture/adr-0005-determinism-keyed-rng-canonical-encoding-and-hashing.md
    added: 2026-10-28
  - pattern: restore_epoch_outside_draw_epoch
    status: active           # ADR-0005 is Proposed
    description: "restore_epoch (owned by Save/Load, ADR-0006; a read-only non-persisted non-hashed copy sits in kernel.clock) is read only inside RngFacet.draw_epoch; no block stores it, no canonical byte string or hash includes it, and no owner computes rng_counter + RESTORE_KEY_STRIDE * restore_epoch. The Graph's draws and every persisted counter use plain draw."
    why: "Keeps G4 defined on (save bytes, restore_epoch), makes the threat re-keying impossible to misapply (OQ-6), and keeps quit and death from rerolling physical outcomes."
    adr: docs/architecture/adr-0005-determinism-keyed-rng-canonical-encoding-and-hashing.md
    added: 2026-10-28
  - pattern: presentation_calls_det_rng_derive
    status: active           # ADR-0005 is Proposed; amends ADR-0009 line 137 (TD-28)
    description: "Presentation never calls DetRng.derive or any rng_derive form. A truth-channel visual that must be reproducible (the Failure & Trail trail.vis variant, phase and flip) uses Ihash keyed by world_seed and a fixed per-system seed; other presentation variation uses Ihash or Ihash.h32 with a fixed non-zero seed."
    why: "The simulation never draws the trail.vis stream, so Ihash reproduces it exactly without opening the sim RNG API to presentation; a lint row allowing .vis names was rejected."
    adr: docs/architecture/adr-0005-determinism-keyed-rng-canonical-encoding-and-hashing.md
    added: 2026-10-28
  - pattern: utility_function_names_and_variant_cast
    status: active           # ADR-0005 is Proposed; enforced by engine SHADOWED_* and UNSAFE_CAST at error (ADR-0010 5.1)
    description: "No member, parameter or local is named after a GlobalScope or GDScript utility function (seed, hash, min, max, floor, round, sign, range, len, str, type) or after a sibling member or function; no 'as' cast of a Variant (unpack with typeof plus a typed assignment, Array[T].assign(d.keys()), only in the allow-listed canonical_encoder.gd)."
    why: "SHADOWED_VARIABLE, SHADOWED_VARIABLE_BASE_CLASS, SHADOWED_GLOBAL_IDENTIFIER and UNSAFE_CAST make these load errors under the project warning gate (probed 2026-10-28)."
    adr: docs/architecture/adr-0005-determinism-keyed-rng-canonical-encoding-and-hashing.md
    added: 2026-10-28
  - pattern: object_or_resource_in_save_payload
    status: active           # ADR-0006 is Proposed
    description: "No save, snapshot, profile or staged payload contains an Object, Resource, StringName, Vector2i or other vector/rect, Callable, Signal, RID, NodePath or non-finite float; the type walk enforces it at write (VERIFYING) and at load; var_to_bytes_with_objects, bytes_to_var_with_objects and Resource-based saves are never used."
    why: "var_to_bytes silently encodes an Object as EncodedObjectAsID (probed 2026-10-28), so the encoder is not a defence; a .tres can embed scripts."
    adr: docs/architecture/adr-0006-save-container-generations-versioning-and-restore-epoch.md
    added: 2026-10-28
  - pattern: join_live_save_thread_or_workerthreadpool
    status: active           # ADR-0006 is Proposed
    description: "Nothing calls wait_to_finish on a Thread that is still alive, uses WorkerThreadPool for the save writer, drops a live WriteJob, or blocks the main thread on save I/O; Thread is legal only inside src/save/, one per WriteJob."
    why: "The join takes no timeout; a hung write would hang the frame at DEAD or at quit (CR-1a, exactly one thread boundary); a freed live Thread orphans its worker."
    adr: docs/architecture/adr-0006-save-container-generations-versioning-and-restore-epoch.md
    added: 2026-10-28
  - pattern: alias_after_save_handoff
    status: active           # ADR-0006 is Proposed
    description: "After a buffer is handed to the save worker the main thread keeps no alias to it, or hands over .duplicate() / .duplicate(true); neither side appends to, resizes or mutates a handed-over object."
    why: "Packed arrays, Arrays and Dictionaries are reference-shared across threads in GDScript (probed 2026-10-28); there is no copy-on-write protection."
    adr: docs/architecture/adr-0006-save-container-generations-versioning-and-restore-epoch.md
    added: 2026-10-28
  - pattern: hex_to_int_on_64bit_field
    status: active           # ADR-0006 is Proposed
    description: "No 64-bit header or hash field is parsed with String.hex_to_int, int() or to_int(), or read from a JSON number; decode with ADR-0005 Hex64.decode after its exact-width lowercase pre-check."
    why: "hex_to_int saturates at INT64_MAX with an engine error, hex_decode accepts uppercase, and JSON numbers are floats that corrupt values from 2^53 up (probed 2026-10-28)."
    adr: docs/architecture/adr-0006-save-container-generations-versioning-and-restore-epoch.md
    added: 2026-10-28
  - pattern: restore_epoch_in_hash_or_snapshot
    status: active           # ADR-0006 is Proposed
    description: "restore_epoch is never inside a block snapshot payload, a state_hash or block hash input, or a rewritten generation file; request_restore is called only after EPOCH_DURABLE (or the logged SL_EPOCH_NOT_DURABLE failure path); a step-back, demotion, quarantine or lost manifest never lowers it."
    why: "Keeps every generation immutable after VERIFYING so REBASED baselines hold, and keeps quit and death from being a reroll oracle (R13/R14)."
    adr: docs/architecture/adr-0006-save-container-generations-versioning-and-restore-epoch.md
    added: 2026-10-28
  - pattern: wall_clock_in_save_ordering
    status: active           # ADR-0006 is Proposed
    description: "created_unix and the SaveInfo time (WallClock port) are display metadata only; no ordering, gate, hash or sim input reads them; every millisecond timeout reads the injected Clock port."
    why: "The generation number is the only order; wall time is banned in src/ outside the SIM-02 allow-list (ADR-0010, TD-11)."
    adr: docs/architecture/adr-0006-save-container-generations-versioning-and-restore-epoch.md
    added: 2026-10-28
  - pattern: viewport_geometry_written_outside_pipeline_root
    status: active           # ADR-0008 is Proposed
    description: "Only PipelineRoot and ViewportWiring (src/presentation/pipeline/viewport_wiring.gd) write SubViewport.size and size_2d_override*, the world container's position, scale, stretch_shrink and material, any CanvasLayer scale, offset or transform, and HudRoot.size; only the CameraHost frame_pre_draw handler writes the world canvas_transform and the parallax offsets; no subscriber, the Filter, Lighting, HUD or Chart Table writes a viewport or camera property; no code but RenderLayout.derive computes k, H, world_to_hud or the cursor mapping."
    why: "Two writers or a re-derived projection produce fractional transforms and disagreeing HUD anchors (TR-pxl-003, TR-pxl-019); the pixel-integrity promise needs one source."
    adr: docs/architecture/adr-0008-render-pipeline-wiring-and-integer-scaling.md
    added: 2026-10-28
  - pattern: root_stretch_or_camera2d_zoom_for_scale
    status: active           # ADR-0008 is Proposed
    description: "No root canvas_items or integer stretch to obtain k, H or k_z; no Camera2D.zoom, no tweened or non-integer scale, no Control.scale on HUD nodes, no scale animation anywhere in the world or HUD."
    why: "Root stretch is exact only when H equals k at the default zoom (probed), so it cannot host the Deck's world 2x and HUD 3x; non-integer scale is the failure the pipeline exists to prevent."
    adr: docs/architecture/adr-0008-render-pipeline-wiring-and-integer-scaling.md
    added: 2026-10-28
  - pattern: control_or_reading_text_under_world_or_scaled_layer
    status: active           # ADR-0008 is Proposed
    description: "No Control and no node in group hud under the world SubViewport; no reading-face (vector) text under an integer-scaled CanvasLayer or the world container; reading-face text lives on a scale (1,1) layer (MenuReadingLayer, layer 4) with sizes in screen px; HUD text uses bitmap faces or configured oversampling."
    why: "A Control under the world receives world light and the Filter (HR-1); text under an integer scale is bitmap-stretched and blurs."
    adr: docs/architecture/adr-0008-render-pipeline-wiring-and-integer-scaling.md
    added: 2026-10-28
  - pattern: render_mode_branch_outside_viewport_wiring
    status: active           # ADR-0008 is Proposed
    description: "ViewportWiring.Mode (pass A or B) is a constructor argument read only inside ViewportWiring; no other class branches on it, and no rule, formula or dependent may assume which pass is live."
    why: "A and B must be identical in coordinate space, sort contract, camera contract and HUD (PR-7); a leak of the mode makes the spike result a rewrite."
    adr: docs/architecture/adr-0008-render-pipeline-wiring-and-integer-scaling.md
    added: 2026-10-28
  - pattern: camera_solve_inside_frame_pre_draw
    status: active           # ADR-0008 is Proposed
    description: "CameraSolver.solve is called only from the CAMERA_SOLVE stage inside PipelineRoot._process; the frame_pre_draw handler performs the two canvas writes from already-solved values and never solves; no presenter defines its own _process; PipelineRoot is the only PresentationHost."
    why: "frame_pre_draw fires after every _process (probed), so a solve in it leaves world_to_hud, the beam pose and the aim mapping one frame behind the world (PR-6 C11, TR-pxl-019)."
    adr: docs/architecture/adr-0008-render-pipeline-wiring-and-integer-scaling.md
    added: 2026-10-28
  - pattern: silent_renderer_or_driver_fallback
    status: active           # ADR-0008 is Proposed
    description: "project.godot must set rendering_device/fallback_to_opengl3 = false and fallback_to_d3d12 = false while Vulkan is the pin; a release build that finds a wrong effective rendering method or driver shows a fatal unsupported-GPU screen and never logs and continues."
    why: "A silent degrade to Compatibility ships a different look (use_hdr_2d ignored, Light2D and glow differ, colour path changes) with only a diagnostics-header line."
    adr: docs/architecture/adr-0008-render-pipeline-wiring-and-integer-scaling.md
    added: 2026-10-28
  - pattern: draw_or_read_in_notification_handler
    status: active           # ADR-0009 is Proposed
    description: "A subscriber, result or control-outcome handler only marks dirty (DirtyAccumulator.absorb), copies event scalars into a pre-sized ring and ends in return ctx.complete(); it never reads a view, touches a node, allocates, emits a signal, awaits (banned lexically in presenter and subscriber scripts) or submits."
    why: "Handlers run inside P5 with writes disabled and their cost is added to every other subscriber; views read there may be replaced by a later tick in the same frame; interpolation needs draws on frames with no notification."
    adr: docs/architecture/adr-0009-presentation-subscriber-contract.md
    added: 2026-10-28
  - pattern: presentation_write_outside_allow_list
    status: active           # ADR-0009 is Proposed
    description: "Presentation writes only CanvasItem, Material, Light2D, LightOccluder2D, CanvasModulate, particle and audio members; never a block, a command, a physics body, Camera2D, Viewport, SubViewport, SubViewportContainer or CanvasLayer members (Pipeline root and camera host excepted), SceneTree.paused, Engine.time_scale or synthetic input; simulation code never names a presentation or Node-derived class."
    why: "Presentation never writes the simulation (kernel H4); a corruptible display must be a transform of presentation nodes only."
    adr: docs/architecture/adr-0009-presentation-subscriber-contract.md
    added: 2026-10-28
  - pattern: engine_signal_in_kernel_or_sim
    status: active           # ADR-0009 is Proposed; consistent with ADR-0004 section 1 (kernel-owned observer registry, no engine signals)
    description: "No signal is declared or connected in src/kernel or src/sim; engine signals are used only between presentation objects for user-initiated events and never carry simulation values into a simulation module or replace a declared stage-read edge."
    why: "The simulation is scene-tree free and testable headless; signals are hidden synchronous dependencies that bypass the stage-read check."
    adr: docs/architecture/adr-0009-presentation-subscriber-contract.md
    added: 2026-10-28
  - pattern: unrounded_or_foreign_placement
    status: active           # ADR-0009 is Proposed
    description: "Position, global position, offset and transform of a Node2D or world-anchored Control (world layer 0, HUD layer 2) are written only in placement.gd (Placement.put / put_control) and the named allow-list (viewport_wiring.gd; the camera host's frame_pre_draw handler for canvas_transform and Placement.floor_v parallax offsets), by assignment, setter, relative-move method or animation property track; sim-owned positions are never rounded with int(), round or roundi and never animated by Tween or AnimationPlayer; presenters read alpha only from PresentFrame (tick_alpha is read only in presentation_driver.gd). Layer 3 and 4 UI Controls are outside the pattern."
    why: "One floor function and one alpha per frame keep the camera, the beam chest point and the sprite on the same pixel at every render rate."
    adr: docs/architecture/adr-0009-presentation-subscriber-contract.md
    added: 2026-10-28
  - pattern: presentation_state_fed_back_or_persisted
    status: active           # ADR-0009 is Proposed
    description: "A presentation-local scalar is never persisted, hashed, replicated or read by the simulation, never decides visibility of a truth-channel element, never changes what a value settles to, and is reset by on_discontinuity on restore, new game, camera cut and hard_start."
    why: "Restore must need no special draw path and a truth channel must stay a pure reader of the simulation."
    adr: docs/architecture/adr-0009-presentation-subscriber-contract.md
    added: 2026-10-28
  - pattern: preload_or_load_of_script_in_src
    status: active           # ADR-0010 is Proposed
    description: "No preload, load or ResourceLoader of a .gd path anywhere in src/ (reference other systems by class_name); non-script preload only in src/presentation and src/game; the one guarded load() of the dev roots in src/game is the sole exception. No waiver (ARCH-03)."
    why: "Architecture dependency rule 2: a preload cycle fails to parse and hides coupling; the import-edge matrix is checked on class_name tokens."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: scene_tree_or_engine_server_in_sim_layers
    status: active           # ADR-0010 is Proposed
    description: "No Node-derived class, scene-tree token (Node, SceneTree, get_tree, get_node, $, @onready, @export, _process, _input), engine server (RenderingServer, PhysicsServer2D, AudioServer, DisplayServer) or Input singleton in src/shared, src/kernel, src/data, src/save or src/sim. KernelHost and SaveHost live in src/game. No waiver (SIM-01)."
    why: "Kernel H10 and architecture Principle 1: the simulation runs headless; gdUnit4 runs inside a tree so tree-freedom is a lint, not an arrangement."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: float_or_wall_clock_in_sim
    status: active           # ADR-0010 is Proposed
    description: "No float declaration, float literal, float-producing member (.length, .normalized, .distance_to, ...), Vector2/Vector3/Transform2D, or any SIM-02 token (Time.*, Engine frame counters, get_process_delta_time, global RNG) in src/shared and src/sim; kernel and data confine floats and clock reads to the float allow-list (presentation_clock.gd, the diagnostics timer, *_read.gd) and the four-entry SIM-02 allow-list; the src/shared float allow-list is exactly det_rng_float.gd and canonical_encoder.gd."
    why: "Kernel H9, determinism by construction; a float or a wall-clock read that reaches state breaks replay and the state hash."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: integer_division_outside_int_math
    status: active           # ADR-0010 is Proposed
    description: "The operator tokens /, %, /= and %= appear only inside IntMath in shared, kernel and sim; there is exactly one @warning_ignore(\"integer_division\") in src/, on IntMath.trunc_div; min, max, clamp, abs, sign, floor, ceil, round and trig functions are not used on simulation values (use mini, maxi, clampi, absi, signi)."
    why: "Negative operands truncate toward zero and % keeps the sign (probed on 4.7.2); Vector2i division truncates silently and escapes INTEGER_DIVISION; one tested site removes the class of off-by-one bugs."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: unlisted_warning_ignore
    status: active           # ADR-0010 is Proposed
    description: "Every @warning_ignore, @warning_ignore_start and @warning_ignore_restore in src/ and tools/ is an entry of tools/lint/config/allowlists/warning_ignore.json (path, function, warning id, reason, owner); no waiver (PRJ-04)."
    why: "The engine raises promoted warnings, so a lint-allow comment cannot cover them; an unlisted ignore reopens the typing hole warnings-as-errors closes."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: static_var_in_src
    status: active           # ADR-0010 is Proposed
    description: "No static var in src/ and no [autoload] section in project.godot. No waiver (ARCH-04)."
    why: "The only way two kernels or catalogs in one process could silently share state; TR-cmd-052 and TR-itemdb-002 require independent instances."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: presentation_names_sim_internals_or_kernel_core
    status: active           # ADR-0010 is Proposed
    description: "src/presentation, src/debug and src/observer name only sim/<x>/views, sim/<x>/ports and the kernel/facets list; never Kernel, KernelHost, TickDriver, SimViews, WriteScope, Command, BlockDescriptor, CallContext, ValidateContext, ApplyContext, HookContext or SnapshotContext; NotifyFacet only in src/game and PresentationFacet. src/sim never names presentation, game, debug or observer; src/data names shared only. Checked on class_name tokens (ARCH-02, ARCH-08)."
    why: "Simulation never reads presentation; a facet leak would give presentation write or submit rights (ADR-0003 risk)."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: foreign_private_member_access
    status: active           # ADR-0010 is Proposed
    description: "No access to a ._member through a receiver other than self, and no assignment to a frozen catalog _field outside its own _freeze (ARCH-06); a same-class peer access carries a '# lint-allow: ARCH-06 reason' waiver."
    why: "GDScript has no private fields; write-once catalog fields and block internals are conventions the lint must hold (ADR-0007 section 1.5)."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: render_test_in_headless_lane
    status: active           # ADR-0010 is Proposed
    description: "Pixel, frame-diff, draw-call and flash checks live only under tests/render/ and run only in the windowed lane; the headless job lists them SKIPPED, and every rendered test asserts a nonzero draw or pixel count through RenderGuard."
    why: "A headless runner has no rasteriser; a vacuous pass reads as evidence (TR-pxl-037, TR-percfilter-033, TR-debug-045)."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: await_in_presenter_or_subscriber
    status: active           # ADR-0010 is Proposed
    description: "No await in any script registered through PresenterDescriptor or that calls .subscribe( (PRES-06); a subscriber handler returns its CompletionToken synchronously and the kernel's token-identity check records anything else INCOMPLETE."
    why: "A suspended coroutine returns a state object instead of the armed token; ADR-0004 section 2."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: thread_or_deferred_call_outside_save
    status: active           # ADR-0010 is Proposed
    description: "Thread, WorkerThreadPool, Mutex and Semaphore only under src/save/ (IO-02); call_deferred, set_deferred, call_thread_safe and Engine.get_main_loop absent from src/shared, kernel, sim, data and save (SIM-12); the only cross-thread payload is a PackedByteArray or PackedInt64Array handed over by value and never mutated afterwards."
    why: "Threads are confined to the one legal user; deferred calls reorder work outside the tick."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: packed_array_exposed_or_setter_tracked
    status: active           # ADR-0010 is Proposed
    description: "Accessors return Array[T] or Dictionary[K, V] marked read-only, never a Packed*Array; a Packed*Array property with a set( accessor is a finding in src/ unless the owner marks dirty explicitly (ARCH-11, CNT-03)."
    why: "Packed arrays have no read-only marker and pass by reference; 4.7 element writes skip setters."
    adr: docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
  - pattern: live_reference_in_snapshot_payload
    status: active
    description: "A snapshot payload never holds a live reference to a block's own packed array; every packed array in the payload is a duplicate. restore copies out of the payload and keeps no reference into it."
    why: "The kernel hashes and queues the payload after snapshot returns; a live reference lets a later mutator change a payload already encoded or being written."
    adr: docs/architecture/adr-0003-state-block-registry-and-owner-contract.md
    added: 2026-10-28
  - pattern: restore_epoch_read_outside_rng_facet
    status: active
    description: "restore_epoch is read only inside RngFacet.draw_epoch; no other code in src/sim/ reads kernel.clock.restore_epoch, and it is in no block, canonical byte string, state_hash or snapshot header."
    why: "restore_epoch is non-persisted and non-hashed; any other simulation-visible use breaks bit-exact replay of (save bytes, restore_epoch)."
    adr: docs/architecture/adr-0003-state-block-registry-and-owner-contract.md
    added: 2026-10-28

