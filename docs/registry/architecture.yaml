# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: simulation_clock
    status: active
    # was: "KernelHost._process(delta) -> TickDriver.frame(delta_us), delta_us = maxi(0, roundi(delta * 1_000_000.0))"
    api: "KernelHost (src/game/kernel_host.gd)._process(delta) -> TickDriver.frame(delta_us), delta_us = maxi(0, roundi(delta * 1_000_000.0)); TickDriver.frame is two statements: _frame_body(delta_us) then Kernel.deliver_frame_end() (unconditional, KRN-FRAME-END)"
    # was: "_physics_process or physics_jitter_fix / max_physics_steps_per_frame coupling; a Time.get_ticks_usec accumulator (kept only as the spike fallback)"
    not: "_physics_process or physics_jitter_fix / max_physics_steps_per_frame coupling; a Time.get_ticks_usec accumulator (kept only as the spike fallback); a return or statement in frame() after the body"
    adr: docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
    # was: "One accumulator, one wall-clock read that reaches the simulation, regular input latency; the kernel GDD (owner) rejected the physics callback in CR-1a"
    reason: "One accumulator, one wall-clock read that reaches the simulation, regular input latency, frame-end delivery on every exit path; the kernel GDD (owner) rejected the physics callback in CR-1a; the clock-API allow-list is owned by ADR-0010 SIM-02"
    referenced_by:
      - docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
      - docs/architecture/adr-0004-change-notification-and-dirty-keys.md
      - docs/architecture/adr-0010-source-layout-static-typing-and-lint-enforcement.md
    added: 2026-10-28
    revised: 2026-10-28
