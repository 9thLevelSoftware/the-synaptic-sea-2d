# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: kernel_autoload_or_global
    status: active
    description: "No autoload, static variable or group lookup exposes the kernel, a block or a read view. The composition root injects the narrowest facet each module needs through setup()."
    why: "Hidden dependencies, shared state between headless tests, and no second kernel for MIRROR or replay comparison."
    adr: docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
    added: 2026-10-28
  - pattern: physics_callback_tick_source
    status: active
    description: "No kernel, simulation or presentation script defines _physics_process or _integrate_forces, and nothing is coupled to physics_jitter_fix or max_physics_steps_per_frame."
    why: "Two accumulators drift; the simulation has no physics body; the kernel GDD rejected it."
    adr: docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
    added: 2026-10-28
  - pattern: cosmetic_phase_from_tick_counter
    status: active
    description: "Cosmetic animation phase uses present_time, never the tick counter; simulation-computed values use the committed tick."
    why: "Keeps pause, reduced motion and render rate from changing simulation-visible values."
    adr: docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
    added: 2026-10-28
  - pattern: await_process_frame_in_sim_or_presentation
    status: active
    description: "src/sim and src/presentation code does not await get_tree().process_frame; waiting is expressed in ticks or present_time."
    why: "That signal fires outside the per-node process_priority ordering (UNVERIFIED), outside the adapter-driver-presentation order."
    adr: docs/architecture/adr-0001-kernel-tick-driver-and-frame-order.md
    added: 2026-10-28
  - pattern: command_constructed_outside_kernel
    status: active
    description: "Command.new() is called only inside src/kernel/ (_admit); issuer_peer, origin, seq and submission_id are never read from or written to payload data."
    why: "The stamped fields are the authority boundary; GDScript has no private constructors, so a run-time seal and a CI check enforce it."
    adr: docs/architecture/adr-0002-authority-model-and-command-pipeline.md
    added: 2026-10-28
  - pattern: presentation_submit_without_handle
    status: active
    description: "Only the objects named at handle issue hold a SurfaceHandle or ControlHandle; subscribing as INPUT_SURFACE does not confer submit rights; SYSTEM commands are submitted only through ctx.submit_system inside a tick phase."
    why: "Presentation never writes the simulation (kernel H4); co-op must add ingress without changing owners."
    adr: docs/architecture/adr-0002-authority-model-and-command-pipeline.md
    added: 2026-10-28
  - pattern: peer_id_keyed_persistent_state
    status: active
    description: "Persistent per-player state and ownership are keyed by PlayerId; the peer id appears only in the ingress stamp and binding table half (a). Ownership is never derived from scene-tree node authority."
    why: "Peer ids change on reconnect and host change; a copied save or re-join must keep its characters."
    adr: docs/architecture/adr-0002-authority-model-and-command-pipeline.md
    added: 2026-10-28
  - pattern: write_outside_writescope_or_setter_dirty
    status: active
    description: "No block is written outside a kernel WriteScope (APPLY, PAUSED_APPLY, HOOK, INIT, RESTORE); every mutator begins with scope.open_for; dirty keys are marked only through scope.mark_dirty, never from a property setter."
    why: "Kernel CR-9 write discipline; 4.7 packed-array element writes no longer call setters, so setter-based dirty tracking silently misses changes."
    adr: docs/architecture/adr-0003-state-block-registry-and-owner-contract.md
    added: 2026-10-28
  - pattern: void_or_value_returning_owner_callable
    status: active
    description: "No kernel-invoked owner callable is declared -> void or returns a domain value; each is -> CompletionToken with return ctx.complete() as its last statement; outcomes go through ctx."
    why: "An aborted GDScript function returns a default the caller cannot tell from a result; the completion sentinel is the only release-build abort guard."
    adr: docs/architecture/adr-0003-state-block-registry-and-owner-contract.md
    added: 2026-10-28
  - pattern: block_as_resource_or_node
    status: active
    description: "State blocks are RefCounted plain data held by their owner, never a Resource or Node; restore copies into the existing block object."
    why: "Save-file trust (a .tres can embed scripts), canonical serialisation, scene-tree independence (H10), and long-lived read-view facades."
    adr: docs/architecture/adr-0003-state-block-registry-and-owner-contract.md
    added: 2026-10-28
  - pattern: content_directory_scan
    status: active
    description: "Game code never enumerates res://assets/data with DirAccess; every data file is read by an explicit path from a committed, sorted manifest whose case matches the file on disk."
    why: "Listing order and names differ between editor and export; a stray file would load silently; Windows is case-insensitive, the package and the Deck are not."
    adr: docs/architecture/adr-0007-static-content-data-pipeline-and-stable-type-ids.md
    added: 2026-10-28
  - pattern: mutable_or_resource_catalog
    status: active
    description: "No content catalog is a Resource, Node, autoload or static singleton, and none hands out a mutable container: arrays are read-only typed Array[T] stored once; packed arrays and per-call duplicate() are never returned."
    why: "Catalogs are shared by validate, P3 and presentation; packed arrays pass by reference and cannot be made read-only; duplicate() allocates (AC-69); many catalogs must coexist for tests and MIRROR."
    adr: docs/architecture/adr-0007-static-content-data-pipeline-and-stable-type-ids.md
    added: 2026-10-28
  - pattern: position_derived_persisted_id
    status: active
    description: "No id that reaches a save, snapshot, hash or replicated record is an array index, file or manifest position, Dictionary order, path hash or ResourceUID; item type_id never reaches one; ledgers are append-only and retired ids are never reused."
    why: "Ids must keep their meaning across builds; a renumber would silently load the wrong def from an old save."
    adr: docs/architecture/adr-0007-static-content-data-pipeline-and-stable-type-ids.md
    added: 2026-10-28
  - pattern: loader_side_effect_or_foreign_boot_code
    status: active
    description: "Content loaders return Array[BootError] with domain-2 codes from ContentFaults; they never call assert, push_error or quit, and never raise a content boot error from an owner system's own *_faults.gd."
    why: "assert is stripped in release, push_error trips gdUnit4, quit is untestable; one domain keeps src/data free of imports from Core and Feature fault files (ADR-0003 domain 2)."
    adr: docs/architecture/adr-0007-static-content-data-pipeline-and-stable-type-ids.md
    added: 2026-10-28

