# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

engine:
  name: "Godot"
  version: "4.7.2"
  language: "GDScript"
  rendering: "Forward+"
  physics: "Godot Physics 2D"
  path: "C:/Users/dasbl/Documents/Godot/Godot_v4.7.2-stable_mono_win64.exe"

specialists:
  code: "godot-gdscript-specialist"
  shader: "godot-shader-specialist"
  ui: "godot-specialist"
  additional: ["godot-gdextension-specialist"]

naming:
  classes: PascalCase
  variables: snake_case
  constants: SCREAMING_SNAKE
  signals: past_tense
  files: snake_case
  scenes: snake_case

commands:
  # build: no export presets exist yet — set via /settings once a preset is created
  build: "[TO BE CONFIGURED]"
  test: '"C:/Users/dasbl/Documents/Godot/Godot_v4.7.2-stable_mono_win64_console.exe" --headless -s -d --remote-debug tcp://127.0.0.1:0 res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests --ignoreHeadlessMode'
  run: '"C:/Users/dasbl/Documents/Godot/Godot_v4.7.2-stable_mono_win64.exe" --path . --windowed --resolution 1280x720'
  smoke: '"C:/Users/dasbl/Documents/Godot/Godot_v4.7.2-stable_mono_win64_console.exe" --headless --quit-after 5'

project:
  stage: Concept

modes:
  rigor: full
  automation: autonomous

# Reference machines for every wall-clock criterion (X14, closed 2026-10-28 by
# delegated ruling R12; the developer machine is not a reference machine).
qa:
  min_spec:
    desktop:
      id: RM-DESKTOP
      os: Windows 10/11 64-bit
      cpu: 6-core Intel Core i5-9400F / AMD Ryzen 5 2600 class
      ram_gb: 8
      gpu: NVIDIA GeForce GTX 1050 Ti 4 GB / AMD Radeon RX 570 4 GB class (Vulkan 1.2+)
      storage: SATA SSD
      display: 1920x1080 @ 60 Hz
      p99_cpu_frame_ms: 16.6
    handheld:
      id: RM-DECK
      device: Steam Deck LCD (2022), SteamOS stable
      display: 1280x800 @ 60 Hz, 30 fps target
      p99_cpu_frame_ms: 33.3
    build: Godot 4.7.2 release export template, renderer forward_plus, vsync on, 120-frame warm-up
    p99_headroom: P99 <= 90% of the ceiling
